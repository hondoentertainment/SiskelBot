<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Siskel Bot - Hierarchy Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
    }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }
    header {
      padding: 0.75rem 1rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { margin: 0; font-size: 1.125rem; font-weight: 600; }
    header a { color: #60a5fa; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    main {
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 1rem;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .panel h2 {
      margin: 0 0 0.75rem 0;
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    label {
      display: block;
      font-size: 0.78rem;
      color: #94a3b8;
      margin: 0.5rem 0 0.25rem;
    }
    textarea, input, select {
      width: 100%;
      padding: 0.5rem 0.6rem;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      font: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      background: #3b82f6;
      color: white;
      border: 0;
      padding: 0.55rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .row { display: flex; gap: 0.5rem; align-items: center; }
    .meta {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 0.5rem;
    }
    .status {
      font-size: 0.78rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      background: #334155;
      color: #cbd5e1;
      display: inline-block;
    }
    .status.ok { background: #065f46; color: #a7f3d0; }
    .status.err { background: #7f1d1d; color: #fecaca; }

    /* tree */
    .tree { font-size: 0.85rem; }
    .tree ul {
      list-style: none;
      padding-left: 1.25rem;
      margin: 0;
      border-left: 1px dashed #334155;
    }
    .tree > ul { padding-left: 0; border-left: 0; }
    .node {
      margin: 0.35rem 0;
      padding: 0.55rem 0.7rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-left: 3px solid #64748b;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .node:hover { background: #1a2436; }
    .node-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .toggle {
      width: 14px;
      display: inline-block;
      text-align: center;
      color: #64748b;
      font-family: ui-monospace, Menlo, monospace;
    }
    .badge {
      font-size: 0.7rem;
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
      background: #334155;
      color: #cbd5e1;
      text-transform: lowercase;
      font-family: ui-monospace, Menlo, monospace;
    }
    .badge.researcher { background: #1e3a8a; color: #bfdbfe; }
    .badge.coder { background: #064e3b; color: #a7f3d0; }
    .badge.analyst { background: #78350f; color: #fde68a; }
    .badge.writer { background: #4c1d95; color: #ddd6fe; }
    .badge.executor { background: #7f1d1d; color: #fecaca; }
    .badge.manager { background: #334155; color: #cbd5e1; }
    .task {
      flex: 1 1 auto;
      color: #e2e8f0;
      font-weight: 500;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .duration {
      font-size: 0.7rem;
      color: #64748b;
      font-family: ui-monospace, Menlo, monospace;
    }
    .node-body {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px dashed #334155;
      font-size: 0.78rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .node-body.error { color: #fecaca; }
    .collapsed > .node-body { display: none; }
    .collapsed > ul { display: none; }

    pre.raw {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.6rem;
      max-height: 320px;
      overflow: auto;
      font-size: 0.72rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <header>
    <h1>Hierarchy Viewer</h1>
    <a href="/">Home</a>
    <a href="/admin.html">Admin</a>
    <a href="/explain.html">Decision Explorer</a>
  </header>

  <main>
    <section>
      <div class="panel">
        <h2>Run a hierarchy</h2>
        <label for="task">Root task</label>
        <textarea id="task" placeholder="Plan a release: research, write notes, schedule rollout"></textarea>

        <label for="workers">Workers (comma separated, optional)</label>
        <input id="workers" placeholder="researcher,writer,executor">

        <label for="model">Model (optional)</label>
        <input id="model" placeholder="default">

        <div class="row" style="margin-top: 0.6rem;">
          <label style="margin: 0; flex: 1;">Max depth
            <input id="maxDepth" type="number" min="1" max="10" value="3">
          </label>
          <label style="margin: 0; flex: 1;">Timeout (ms)
            <input id="timeoutMs" type="number" min="1000" step="1000" value="60000">
          </label>
        </div>

        <div class="row" style="margin-top: 0.75rem;">
          <button id="runBtn">Execute</button>
          <span id="runStatus" class="meta"></span>
        </div>
      </div>

      <div class="panel">
        <h2>Available workers</h2>
        <div id="workersList" class="meta">Loading...</div>
      </div>
    </section>

    <section>
      <div class="panel">
        <h2>Execution tree</h2>
        <div id="summary" class="meta"></div>
        <div id="tree" class="tree"></div>
      </div>

      <div class="panel">
        <h2>Raw response</h2>
        <pre id="raw" class="raw">(no run yet)</pre>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const KNOWN_WORKERS = new Set(["researcher", "coder", "analyst", "writer", "executor"]);

    function workerBadge(workerId) {
      const cls = KNOWN_WORKERS.has(workerId) ? workerId : "manager";
      return `<span class="badge ${cls}">${workerId || "manager"}</span>`;
    }

    function fmtDuration(ms) {
      if (ms == null) return "";
      if (ms < 1000) return `${ms}ms`;
      return `${(ms / 1000).toFixed(2)}s`;
    }

    function renderTree(node, container) {
      const el = document.createElement("li");
      el.className = "node-wrap";
      const toggle = node.children && node.children.length ? "&minus;" : "&nbsp;";
      const card = document.createElement("div");
      card.className = "node";
      const cls = node.workerId && KNOWN_WORKERS.has(node.workerId) ? node.workerId : null;
      const colors = {
        researcher: "#3b82f6",
        coder: "#10b981",
        analyst: "#f59e0b",
        writer: "#a855f7",
        executor: "#ef4444",
      };
      if (cls && colors[cls]) card.style.borderLeftColor = colors[cls];
      card.innerHTML = `
        <div class="node-header">
          <span class="toggle">${toggle}</span>
          ${workerBadge(node.workerId)}
          <span class="task"></span>
          <span class="duration">${fmtDuration(node.durationMs)}</span>
        </div>
        ${node.result || node.error ? `<div class="node-body ${node.error ? "error" : ""}"></div>` : ""}
      `;
      card.querySelector(".task").textContent = node.task || "(no task)";
      const body = card.querySelector(".node-body");
      if (body) body.textContent = node.error || node.result || "";

      card.addEventListener("click", (e) => {
        e.stopPropagation();
        el.classList.toggle("collapsed");
        const tg = card.querySelector(".toggle");
        if (tg) tg.innerHTML = el.classList.contains("collapsed") ? "+" : (node.children && node.children.length ? "&minus;" : "&nbsp;");
      });

      el.appendChild(card);

      if (node.children && node.children.length) {
        const ul = document.createElement("ul");
        for (const child of node.children) renderTree(child, ul);
        el.appendChild(ul);
      }

      container.appendChild(el);
    }

    async function loadWorkers() {
      try {
        const res = await fetch("/api/v1/agent/workers");
        const data = await res.json();
        if (!Array.isArray(data.workers)) throw new Error("invalid response");
        const html = data.workers.map((w) => `
          <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.25rem;">
            ${workerBadge(w.id)}
            <span>${(w.description || "").slice(0, 80)}</span>
          </div>
        `).join("");
        $("workersList").innerHTML = html || "(none)";
      } catch (err) {
        $("workersList").textContent = "Failed to load workers: " + err.message;
      }
    }

    async function runHierarchy() {
      const task = $("task").value.trim();
      if (!task) {
        $("runStatus").textContent = "Task is required";
        return;
      }
      const workersRaw = $("workers").value.trim();
      const workers = workersRaw ? workersRaw.split(",").map((s) => s.trim()).filter(Boolean) : undefined;
      const model = $("model").value.trim() || undefined;
      const maxDepth = Number($("maxDepth").value) || undefined;
      const timeoutMs = Number($("timeoutMs").value) || undefined;

      $("runBtn").disabled = true;
      $("runStatus").innerHTML = '<span class="status">running...</span>';
      $("tree").innerHTML = "";
      $("summary").textContent = "";
      $("raw").textContent = "";

      try {
        const res = await fetch("/api/v1/agent/hierarchy/execute", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task, workers, model, maxDepth, timeoutMs }),
        });
        const data = await res.json();
        $("raw").textContent = JSON.stringify(data, null, 2);
        if (!res.ok) {
          $("runStatus").innerHTML = `<span class="status err">${data.error || res.status}</span>`;
          return;
        }
        $("runStatus").innerHTML = `<span class="status ok">done</span>`;
        $("summary").textContent = `Run ${data.runId} | ${data.agentCount || 0} agents | ${fmtDuration(data.totalTime)}${data.timedOut ? " | timeout" : ""}`;
        if (data.tree) {
          const ul = document.createElement("ul");
          renderTree(data.tree, ul);
          $("tree").appendChild(ul);
        }
      } catch (err) {
        $("runStatus").innerHTML = `<span class="status err">${err.message}</span>`;
      } finally {
        $("runBtn").disabled = false;
      }
    }

    $("runBtn").addEventListener("click", runHierarchy);
    loadWorkers();
  </script>
</body>
</html>
