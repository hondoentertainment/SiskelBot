<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>API Playground - SiskelBot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
    }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }

    header {
      padding: 0.75rem 1rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { font-size: 1.125rem; font-weight: 600; }
    header a { color: #60a5fa; text-decoration: none; }
    header a:hover { text-decoration: underline; }

    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
      min-height: calc(100vh - 56px);
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }

    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #334155;
      font-size: 0.875rem;
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-body {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-group { margin-bottom: 0.75rem; }
    .form-row { display: flex; gap: 0.5rem; }
    .form-row > .form-group { flex: 1; }

    select, input[type="text"], input[type="url"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.875rem;
      font-family: inherit;
    }
    select:hover, input:hover { border-color: #475569; }

    textarea {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.8125rem;
      font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace;
      resize: vertical;
      min-height: 120px;
      tab-size: 2;
    }

    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      font-family: inherit;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .btn-ghost { background: #334155; color: #e2e8f0; }
    .btn-ghost:hover { background: #475569; }
    .btn-danger { background: #7f1d1d; color: #fecaca; }
    .btn-danger:hover { background: #991b1b; }

    .btn-bar { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }

    .headers-list { display: flex; flex-direction: column; gap: 0.375rem; }
    .header-row {
      display: flex;
      gap: 0.375rem;
      align-items: center;
    }
    .header-row input { flex: 1; padding: 0.375rem 0.5rem; font-size: 0.8125rem; }
    .header-row button {
      background: none;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.25rem;
    }

    .status-badge {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: monospace;
    }
    .status-2xx { background: #064e3b; color: #6ee7b7; }
    .status-3xx { background: #78350f; color: #fcd34d; }
    .status-4xx { background: #7f1d1d; color: #fca5a5; }
    .status-5xx { background: #581c87; color: #d8b4fe; }

    .response-headers {
      font-size: 0.75rem;
      font-family: monospace;
      color: #94a3b8;
      margin: 0.5rem 0;
      white-space: pre-wrap;
      max-height: 150px;
      overflow-y: auto;
    }
    .response-body {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.8125rem;
      font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-y: auto;
      max-height: 500px;
      min-height: 80px;
    }
    .response-meta {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.5rem;
    }

    .codegen-block {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.75rem;
      font-size: 0.8125rem;
      font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace;
      white-space: pre;
      word-break: normal;
      overflow-x: auto;
      max-height: 300px;
    }

    .history-panel { grid-column: 1 / -1; }
    .history-list { display: flex; flex-direction: column; gap: 0.375rem; }
    .history-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8125rem;
    }
    .history-item:hover { border-color: #475569; }
    .history-method {
      font-weight: 600;
      font-family: monospace;
      font-size: 0.75rem;
      min-width: 3.5rem;
    }
    .method-GET { color: #34d399; }
    .method-POST { color: #60a5fa; }
    .method-PUT { color: #fbbf24; }
    .method-PATCH { color: #c084fc; }
    .method-DELETE { color: #f87171; }
    .history-path { flex: 1; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-status { font-family: monospace; font-size: 0.75rem; }
    .history-time { color: #64748b; font-size: 0.6875rem; white-space: nowrap; }
    .history-remove {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 0.875rem;
      padding: 0.125rem;
    }
    .history-remove:hover { color: #f87171; }
    .empty-state { color: #64748b; font-size: 0.875rem; text-align: center; padding: 2rem; }
  </style>
</head>
<body>
  <header>
    <h1>API Playground</h1>
    <a href="/">&larr; Chat</a>
    <a href="/admin.html">Admin</a>
  </header>

  <main>
    <!-- Request panel -->
    <div class="panel">
      <div class="panel-header">Request</div>
      <div class="panel-body">
        <div class="form-group">
          <label for="endpoint-select">Endpoint</label>
          <select id="endpoint-select">
            <option value="">Loading endpoints...</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="method-select">Method</label>
            <select id="method-select">
              <option value="GET">GET</option>
              <option value="POST">POST</option>
              <option value="PUT">PUT</option>
              <option value="PATCH">PATCH</option>
              <option value="DELETE">DELETE</option>
            </select>
          </div>
          <div class="form-group" style="flex:3">
            <label for="path-input">Path</label>
            <input type="text" id="path-input" placeholder="/api/v1/workspaces">
          </div>
        </div>

        <div class="form-group">
          <label for="api-key-input">API Key</label>
          <input type="text" id="api-key-input" placeholder="Paste your API key (auto-fills Authorization header)">
        </div>

        <div class="form-group">
          <label>Headers</label>
          <div class="headers-list" id="headers-list">
            <div class="header-row">
              <input type="text" placeholder="Header name" value="Content-Type">
              <input type="text" placeholder="Header value" value="application/json">
              <button type="button" onclick="removeHeader(this)" aria-label="Remove header">&times;</button>
            </div>
          </div>
          <button type="button" class="btn btn-ghost" style="margin-top:0.375rem;font-size:0.75rem;" onclick="addHeader()">+ Add Header</button>
        </div>

        <div class="form-group" id="body-group">
          <label for="body-editor">Body (JSON)</label>
          <textarea id="body-editor" rows="8" placeholder='{ "key": "value" }'></textarea>
        </div>

        <div class="btn-bar">
          <button type="button" class="btn btn-primary" id="send-btn" onclick="sendRequest()">Send Request</button>
          <button type="button" class="btn btn-ghost" onclick="clearRequest()">Clear</button>
          <button type="button" class="btn btn-ghost" onclick="openSaveToCollection()">Save to Collection</button>
        </div>
      </div>
    </div>

    <!-- Response panel -->
    <div class="panel">
      <div class="panel-header">
        <span>Response</span>
        <span id="response-status"></span>
      </div>
      <div class="panel-body">
        <div id="response-empty" class="empty-state">Send a request to see the response.</div>
        <div id="response-content" style="display:none">
          <div id="response-headers-section">
            <label>Response Headers</label>
            <div class="response-headers" id="response-headers"></div>
          </div>
          <label style="margin-top:0.5rem">Body</label>
          <div class="response-body" id="response-body"></div>
          <div class="response-meta" id="response-meta"></div>
        </div>
      </div>
    </div>

    <!-- Code generation panel -->
    <div class="panel">
      <div class="panel-header">
        <span>Code Snippet</span>
        <select id="codegen-lang" style="width:auto;padding:0.25rem 0.5rem;font-size:0.8125rem;">
          <option value="curl">curl</option>
          <option value="javascript">JavaScript (fetch)</option>
          <option value="python">Python (requests)</option>
          <option value="go">Go (net/http)</option>
          <option value="rust">Rust (reqwest)</option>
          <option value="ruby">Ruby (net/http)</option>
        </select>
      </div>
      <div class="panel-body">
        <div class="codegen-block" id="codegen-block">Configure a request to generate code.</div>
        <div class="btn-bar">
          <button type="button" class="btn btn-ghost" onclick="copyCodeSnippet()">Copy</button>
        </div>
      </div>
    </div>

    <!-- Collections panel -->
    <div class="panel">
      <div class="panel-header">
        <span>Collections</span>
        <button type="button" class="btn btn-ghost" style="font-size:0.75rem;padding:0.25rem 0.5rem;" onclick="createNewCollection()">+ New</button>
      </div>
      <div class="panel-body">
        <div id="collections-list" class="history-list">
          <div class="empty-state" id="collections-empty">No collections yet.</div>
        </div>
      </div>
    </div>

    <!-- History panel -->
    <div class="panel history-panel">
      <div class="panel-header">
        <span>History</span>
        <button type="button" class="btn btn-ghost" style="font-size:0.75rem;padding:0.25rem 0.5rem;" onclick="clearHistory()">Clear All</button>
      </div>
      <div class="panel-body">
        <div class="history-list" id="history-list">
          <div class="empty-state" id="history-empty">No requests yet.</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "siskelbot_playground_history";
    const MAX_HISTORY = 50;

    let endpoints = [];
    let history = [];
    let collections = [];

    try {
      history = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch { history = []; }

    // ─── Endpoints (OpenAPI) ───────────────────────────────────────
    async function loadEndpoints() {
      const sel = document.getElementById("endpoint-select");
      try {
        const resp = await fetch("/api/docs/openapi.json");
        if (!resp.ok) throw new Error("Failed to load spec");
        const spec = await resp.json();
        const paths = spec.paths || {};
        endpoints = [];
        for (const [path, methods] of Object.entries(paths)) {
          for (const [method, detail] of Object.entries(methods)) {
            if (["get", "post", "put", "patch", "delete"].includes(method)) {
              const summary = detail.summary || detail.operationId || "";
              endpoints.push({ method: method.toUpperCase(), path, summary });
            }
          }
        }
        endpoints.sort((a, b) => a.path.localeCompare(b.path) || a.method.localeCompare(b.method));

        sel.innerHTML = '<option value="">-- Select an endpoint --</option>';
        for (let i = 0; i < endpoints.length; i++) {
          const ep = endpoints[i];
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = `${ep.method} ${ep.path}${ep.summary ? " - " + ep.summary : ""}`;
          sel.appendChild(opt);
        }
      } catch (err) {
        sel.innerHTML = '<option value="">Failed to load endpoints</option>';
        console.warn("OpenAPI spec load failed:", err);
      }
    }

    document.getElementById("endpoint-select").addEventListener("change", function () {
      const idx = parseInt(this.value, 10);
      if (isNaN(idx) || !endpoints[idx]) return;
      const ep = endpoints[idx];
      document.getElementById("method-select").value = ep.method;
      document.getElementById("path-input").value = ep.path;
      updateBodyVisibility();
      updateCodegen();
    });

    document.getElementById("method-select").addEventListener("change", () => {
      updateBodyVisibility();
      updateCodegen();
    });
    document.getElementById("path-input").addEventListener("input", updateCodegen);
    document.getElementById("body-editor").addEventListener("input", updateCodegen);
    document.getElementById("api-key-input").addEventListener("input", updateCodegen);
    document.getElementById("codegen-lang").addEventListener("change", updateCodegen);

    function updateBodyVisibility() {
      const method = document.getElementById("method-select").value;
      const bodyGroup = document.getElementById("body-group");
      bodyGroup.style.display = (method === "GET" || method === "DELETE") ? "none" : "block";
    }

    function addHeader() {
      const list = document.getElementById("headers-list");
      const row = document.createElement("div");
      row.className = "header-row";
      row.innerHTML = `
        <input type="text" placeholder="Header name">
        <input type="text" placeholder="Header value">
        <button type="button" onclick="removeHeader(this)" aria-label="Remove header">&times;</button>
      `;
      list.appendChild(row);
      row.querySelectorAll("input").forEach(i => i.addEventListener("input", updateCodegen));
    }

    function removeHeader(btn) {
      btn.closest(".header-row").remove();
      updateCodegen();
    }

    function getHeaders() {
      const headers = {};
      const apiKey = document.getElementById("api-key-input").value.trim();
      if (apiKey) headers["Authorization"] = "Bearer " + apiKey;
      const rows = document.querySelectorAll("#headers-list .header-row");
      rows.forEach(row => {
        const inputs = row.querySelectorAll("input");
        const name = inputs[0].value.trim();
        const value = inputs[1].value.trim();
        if (name) headers[name] = value;
      });
      return headers;
    }

    function currentRequest() {
      const method = document.getElementById("method-select").value;
      const path = document.getElementById("path-input").value.trim();
      const bodyText = document.getElementById("body-editor").value;
      const headers = getHeaders();
      let body = null;
      if (method !== "GET" && method !== "DELETE" && bodyText) {
        body = bodyText;
      }
      return { endpoint: path, method, body, headers };
    }

    async function sendRequest() {
      const req = currentRequest();
      if (!req.endpoint) { alert("Enter a path"); return; }

      const btn = document.getElementById("send-btn");
      btn.disabled = true;
      btn.textContent = "Sending...";

      const opts = { method: req.method, headers: req.headers };
      if (req.body != null) opts.body = req.body;

      const startMs = performance.now();
      let status, statusText, respHeaders = "", respBody = "";

      try {
        const resp = await fetch(req.endpoint, opts);
        status = resp.status;
        statusText = resp.statusText;
        const elapsed = Math.round(performance.now() - startMs);

        const headerLines = [];
        resp.headers.forEach((v, k) => { headerLines.push(k + ": " + v); });
        respHeaders = headerLines.join("\n");

        const contentType = resp.headers.get("content-type") || "";
        const rawBody = await resp.text();
        if (contentType.includes("json")) {
          try { respBody = JSON.stringify(JSON.parse(rawBody), null, 2); }
          catch { respBody = rawBody; }
        } else {
          respBody = rawBody;
        }

        showResponse(status, statusText, respHeaders, respBody, elapsed);
        addToHistory({
          method: req.method, path: req.endpoint, status,
          elapsed, timestamp: Date.now(),
          body: req.body, headers: req.headers,
        });
      } catch (err) {
        const elapsed = Math.round(performance.now() - startMs);
        showResponse(0, "Network Error", "", err.message, elapsed);
        addToHistory({
          method: req.method, path: req.endpoint, status: 0,
          elapsed, timestamp: Date.now(),
        });
      } finally {
        btn.disabled = false;
        btn.textContent = "Send Request";
      }
    }

    function showResponse(status, statusText, headers, body, elapsed) {
      document.getElementById("response-empty").style.display = "none";
      document.getElementById("response-content").style.display = "block";

      const badge = document.getElementById("response-status");
      let cls = "status-badge";
      if (status >= 200 && status < 300) cls += " status-2xx";
      else if (status >= 300 && status < 400) cls += " status-3xx";
      else if (status >= 400 && status < 500) cls += " status-4xx";
      else cls += " status-5xx";
      badge.className = cls;
      badge.textContent = status ? `${status} ${statusText}` : "Error";

      document.getElementById("response-headers").textContent = headers;
      document.getElementById("response-body").textContent = body;
      document.getElementById("response-meta").textContent = `${elapsed}ms`;
    }

    function addToHistory(entry) {
      history.unshift(entry);
      if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch {}
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById("history-list");
      const empty = document.getElementById("history-empty");
      list.querySelectorAll(".history-item").forEach(el => el.remove());
      if (history.length === 0) { empty.style.display = "block"; return; }
      empty.style.display = "none";
      history.forEach((entry, idx) => {
        const item = document.createElement("div");
        item.className = "history-item";
        item.onclick = () => loadFromHistory(entry);
        const statusCls = entry.status >= 200 && entry.status < 300 ? "status-2xx"
          : entry.status >= 400 && entry.status < 500 ? "status-4xx"
          : entry.status >= 500 ? "status-5xx" : "";
        item.innerHTML = `
          <span class="history-method method-${entry.method}">${entry.method}</span>
          <span class="history-path">${escapeHtml(entry.path)}</span>
          <span class="history-status status-badge ${statusCls}">${entry.status || "ERR"}</span>
          <span class="history-time">${entry.elapsed}ms &middot; ${formatTime(entry.timestamp)}</span>
          <button class="history-remove" onclick="event.stopPropagation();removeHistory(${idx})" aria-label="Remove">&times;</button>
        `;
        list.appendChild(item);
      });
    }

    function loadFromHistory(entry) {
      document.getElementById("method-select").value = entry.method;
      document.getElementById("path-input").value = entry.path;
      if (entry.body != null) document.getElementById("body-editor").value = entry.body;
      updateBodyVisibility();
      updateCodegen();
    }

    function removeHistory(idx) {
      history.splice(idx, 1);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch {}
      renderHistory();
    }

    function clearHistory() {
      history = [];
      try { localStorage.removeItem(STORAGE_KEY); } catch {}
      renderHistory();
    }

    function clearRequest() {
      document.getElementById("path-input").value = "";
      document.getElementById("body-editor").value = "";
      document.getElementById("endpoint-select").value = "";
      document.getElementById("response-empty").style.display = "block";
      document.getElementById("response-content").style.display = "none";
      document.getElementById("response-status").className = "";
      document.getElementById("response-status").textContent = "";
      updateCodegen();
    }

    // ─── Code generation ───────────────────────────────────────────
    async function updateCodegen() {
      const block = document.getElementById("codegen-block");
      const lang = document.getElementById("codegen-lang").value;
      const req = currentRequest();
      if (!req.endpoint) {
        block.textContent = "Configure a request to generate code.";
        return;
      }
      try {
        const resp = await fetch("/api/v1/playground/codegen", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            lang, endpoint: req.endpoint, method: req.method,
            body: req.body, headers: req.headers,
          }),
        });
        if (!resp.ok) throw new Error(`codegen ${resp.status}`);
        const data = await resp.json();
        block.textContent = data.code || "";
      } catch (err) {
        block.textContent = `// Failed to generate code: ${err.message}`;
      }
    }

    function copyCodeSnippet() {
      const text = document.getElementById("codegen-block").textContent;
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text);
      }
    }

    // ─── Collections ───────────────────────────────────────────────
    async function loadCollections() {
      const list = document.getElementById("collections-list");
      const empty = document.getElementById("collections-empty");
      try {
        const resp = await fetch("/api/v1/playground/collections");
        if (!resp.ok) { collections = []; return; }
        const data = await resp.json();
        collections = data.items || [];
      } catch { collections = []; }
      list.querySelectorAll(".history-item").forEach(el => el.remove());
      if (collections.length === 0) { empty.style.display = "block"; return; }
      empty.style.display = "none";
      collections.forEach((col) => {
        const item = document.createElement("div");
        item.className = "history-item";
        item.innerHTML = `
          <span class="history-method">${(col.requests || []).length}</span>
          <span class="history-path">${escapeHtml(col.name)}</span>
          <button class="history-remove" onclick="event.stopPropagation();deleteCollectionById('${col.id}')" aria-label="Delete">&times;</button>
        `;
        list.appendChild(item);
      });
    }

    async function createNewCollection() {
      const name = prompt("Collection name:");
      if (!name) return;
      await fetch("/api/v1/playground/collections", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      loadCollections();
    }

    async function deleteCollectionById(id) {
      if (!confirm("Delete this collection?")) return;
      await fetch(`/api/v1/playground/collections/${id}`, { method: "DELETE" });
      loadCollections();
    }

    async function openSaveToCollection() {
      const req = currentRequest();
      if (!req.endpoint) { alert("Configure a request first."); return; }
      if (collections.length === 0) {
        alert("Create a collection first.");
        return;
      }
      const names = collections.map((c, i) => `${i + 1}. ${c.name}`).join("\n");
      const pick = prompt("Save to which collection?\n" + names);
      const idx = parseInt(pick, 10) - 1;
      if (isNaN(idx) || !collections[idx]) return;
      await fetch(`/api/v1/playground/collections/${collections[idx].id}/requests`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(req),
      });
      loadCollections();
    }

    function formatTime(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function escapeHtml(str) {
      const el = document.createElement("span");
      el.textContent = String(str ?? "");
      return el.innerHTML;
    }

    // Init
    updateBodyVisibility();
    renderHistory();
    loadEndpoints();
    loadCollections();
    // Wire existing default header-row inputs to updateCodegen
    document.querySelectorAll("#headers-list input").forEach(i => i.addEventListener("input", updateCodegen));
  </script>
</body>
</html>
