<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>SiskelBot Preference Dataset Builder</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
    }
    a:focus-visible, button:focus-visible, input:focus-visible,
    select:focus-visible, textarea:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }
    header {
      padding: 0.75rem 1rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 1.125rem; font-weight: 600; }
    header a { color: #60a5fa; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    main { padding: 1rem; max-width: 1200px; margin: 0 auto; }
    .section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .section h2 {
      margin: 0 0 0.75rem 0;
      font-size: 1rem;
      font-weight: 600;
      color: #94a3b8;
    }
    .form-row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .form-row label { min-width: 130px; color: #cbd5e1; font-size: 0.875rem; }
    .form-row input, .form-row select, .form-row textarea {
      padding: 0.5rem 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.875rem;
      font-family: inherit;
    }
    .form-row input[type="text"], .form-row input[type="password"] { min-width: 220px; }
    .form-row textarea { min-width: 400px; min-height: 80px; resize: vertical; }
    .form-row select { min-width: 180px; }
    button {
      padding: 0.5rem 1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.875rem;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      border: 1px solid #334155;
      color: #cbd5e1;
    }
    button.ghost:hover { background: #334155; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }

    .prompt-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.75rem;
      margin-bottom: 1rem;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }
    .prompt-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }
    .responses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 0.75rem;
    }
    .response-card {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 0.75rem;
      cursor: pointer;
      transition: border 0.15s, transform 0.1s;
      position: relative;
    }
    .response-card:hover { border-color: #475569; }
    .response-card.selected {
      border-color: #34d399;
      box-shadow: 0 0 0 2px rgba(52, 211, 153, 0.2);
    }
    .response-card.rank-1 { border-color: #facc15; }
    .response-card.rank-2 { border-color: #94a3b8; }
    .response-card.rank-3 { border-color: #b45309; }
    .response-card .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .response-card .key {
      background: #334155;
      color: #e2e8f0;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: ui-monospace, monospace;
    }
    .response-card .rank-badge {
      background: #2563eb;
      color: white;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    .response-card .content {
      font-size: 0.875rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 300px;
      overflow-y: auto;
    }
    .progress-bar {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .progress-fill {
      background: linear-gradient(90deg, #2563eb, #34d399);
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }
    .progress-text {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }
    .datasets-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .datasets-list li {
      padding: 0.5rem 0.75rem;
      border: 1px solid #334155;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      cursor: pointer;
    }
    .datasets-list li:hover { border-color: #475569; }
    .datasets-list li.active { border-color: #34d399; }
    .datasets-list .meta {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .stat-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
    }
    .stat-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }
    .stat-card .value {
      font-size: 1.25rem;
      font-weight: 600;
      color: #e2e8f0;
    }
    .issue {
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }
    .issue.error { background: rgba(220, 38, 38, 0.15); border: 1px solid #dc2626; color: #fecaca; }
    .issue.warning { background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #fcd34d; }
    .keyboard-hint {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.5rem;
    }
    kbd {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      background: #334155;
      border: 1px solid #475569;
      border-radius: 4px;
      color: #e2e8f0;
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      margin: 0 0.15rem;
    }
    .status {
      margin-top: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.875rem;
      display: none;
    }
    .status.visible { display: block; }
    .status.ok { background: rgba(52, 211, 153, 0.15); color: #86efac; border: 1px solid #34d399; }
    .status.err { background: rgba(220, 38, 38, 0.15); color: #fecaca; border: 1px solid #dc2626; }
    .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Preference Dataset Builder</h1>
    <a href="/">Home</a>
    <a href="/admin">Admin</a>
    <a href="/eval.html">Eval</a>
    <span style="flex: 1"></span>
    <label>
      <span style="font-size: 0.875rem; color: #94a3b8">Workspace</span>
      <input type="text" id="workspace" value="default" style="margin-left: 0.5rem; padding: 0.25rem 0.5rem; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0;">
    </label>
    <label>
      <span style="font-size: 0.875rem; color: #94a3b8">API Key</span>
      <input type="password" id="apiKey" placeholder="(optional)" style="margin-left: 0.5rem; padding: 0.25rem 0.5rem; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0;">
    </label>
  </header>

  <main>
    <div class="section">
      <h2>Datasets</h2>
      <div class="form-row">
        <input type="text" id="newDatasetName" placeholder="New dataset name">
        <select id="newDatasetFormat">
          <option value="dpo">DPO</option>
          <option value="reward_model">Reward model</option>
          <option value="openai_jsonl">OpenAI JSONL</option>
        </select>
        <select id="newDatasetSource">
          <option value="manual">Manual</option>
          <option value="feedback_ratings">Feedback ratings</option>
          <option value="pairwise_comparisons">Pairwise comparisons</option>
        </select>
        <button id="createBtn">Create</button>
        <button class="ghost" id="refreshBtn">Refresh</button>
      </div>
      <ul class="datasets-list" id="datasetsList"></ul>
      <div id="datasetStatus" class="status"></div>
    </div>

    <div class="section">
      <h2>Pairwise Comparison</h2>
      <div class="form-row">
        <label>Prompt</label>
        <textarea id="comparisonPrompt" placeholder="Enter prompt..."></textarea>
      </div>
      <div class="form-row">
        <label>Response A</label>
        <textarea id="respA" placeholder="First candidate response..."></textarea>
      </div>
      <div class="form-row">
        <label>Response B</label>
        <textarea id="respB" placeholder="Second candidate response..."></textarea>
      </div>
      <div class="form-row">
        <label>Response C (optional)</label>
        <textarea id="respC" placeholder="Third candidate (optional)..."></textarea>
      </div>
      <div class="actions">
        <button id="startCompareBtn">Start Ranking</button>
        <button class="ghost" id="extractBtn">Auto-Extract from Feedback</button>
      </div>
    </div>

    <div class="section" id="rankingSection" style="display: none">
      <h2>Rank Responses (best first)</h2>
      <div class="prompt-label">Prompt</div>
      <div class="prompt-box" id="currentPrompt"></div>
      <div class="responses-grid" id="responsesGrid"></div>
      <div class="keyboard-hint">
        Click a card to set its rank, or press
        <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> for best/second/third.
        <kbd>Enter</kbd> to submit. <kbd>Esc</kbd> to clear.
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">Ranked 0 / 0</div>
      <div class="actions">
        <button id="submitRankingBtn">Submit Ranking</button>
        <button class="ghost" id="clearRankingBtn">Clear</button>
        <button class="ghost" id="cancelRankingBtn">Cancel</button>
      </div>
      <div id="rankingStatus" class="status"></div>
    </div>

    <div class="section" id="datasetDetailsSection" style="display: none">
      <h2 id="activeDatasetTitle">Dataset</h2>
      <div class="stats-grid" id="statsGrid"></div>
      <div class="actions">
        <button id="validateBtn">Validate</button>
        <button id="exportDpoBtn">Export DPO</button>
        <button id="exportRewardBtn">Export Reward Model</button>
        <button id="exportOpenaiBtn">Export OpenAI</button>
        <button class="danger" id="deleteDatasetBtn">Delete</button>
      </div>
      <div id="validationResults" style="margin-top: 0.75rem"></div>
    </div>
  </main>

  <script>
    const state = {
      datasets: [],
      activeDatasetId: null,
      currentComparison: null,
      ranking: [],
    };

    const $ = (id) => document.getElementById(id);

    function headers() {
      const h = { "Content-Type": "application/json" };
      const key = $("apiKey").value.trim();
      if (key) h.Authorization = "Bearer " + key;
      return h;
    }

    function workspace() {
      return $("workspace").value.trim() || "default";
    }

    function showStatus(el, msg, ok = true) {
      el.textContent = msg;
      el.className = "status visible " + (ok ? "ok" : "err");
      setTimeout(() => { el.className = "status"; }, 4000);
    }

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: headers(),
        body: body ? JSON.stringify(body) : undefined,
      });
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
      if (!res.ok) throw new Error(data?.error?.message || data?.error || data?.message || ("HTTP " + res.status));
      return data;
    }

    async function loadDatasets() {
      try {
        const data = await api("GET", `/api/v1/preferences/datasets?workspace=${encodeURIComponent(workspace())}`);
        state.datasets = data.datasets || [];
        renderDatasetsList();
      } catch (err) {
        showStatus($("datasetStatus"), "Failed to load: " + err.message, false);
      }
    }

    function renderDatasetsList() {
      const list = $("datasetsList");
      list.innerHTML = "";
      if (state.datasets.length === 0) {
        list.innerHTML = '<li style="border: none; color: #94a3b8">No datasets yet. Create one above.</li>';
        return;
      }
      for (const ds of state.datasets) {
        const li = document.createElement("li");
        if (ds.id === state.activeDatasetId) li.className = "active";
        li.innerHTML = `
          <div>
            <div>${escapeHtml(ds.name)}</div>
            <div class="meta">${ds.format || "dpo"} · ${ds.sourceType || "manual"} · ${ds.pairCount || 0} pairs</div>
          </div>
          <button class="ghost">Open</button>
        `;
        li.onclick = () => selectDataset(ds.id);
        list.appendChild(li);
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    async function selectDataset(id) {
      state.activeDatasetId = id;
      renderDatasetsList();
      $("datasetDetailsSection").style.display = "block";
      const ds = state.datasets.find((d) => d.id === id);
      $("activeDatasetTitle").textContent = ds ? ds.name : "Dataset";
      $("validationResults").innerHTML = "";
      await loadStats();
    }

    async function loadStats() {
      if (!state.activeDatasetId) return;
      try {
        const stats = await api("GET", `/api/v1/preferences/datasets/${state.activeDatasetId}/stats?workspace=${encodeURIComponent(workspace())}`);
        const grid = $("statsGrid");
        grid.innerHTML = `
          <div class="stat-card"><div class="label">Total</div><div class="value">${stats.total}</div></div>
          <div class="stat-card"><div class="label">Avg Prompt Len</div><div class="value">${Math.round(stats.avgPromptLen)}</div></div>
          <div class="stat-card"><div class="label">Avg Chosen Len</div><div class="value">${Math.round(stats.avgChosenLen)}</div></div>
          <div class="stat-card"><div class="label">Avg Rejected Len</div><div class="value">${Math.round(stats.avgRejectedLen)}</div></div>
          <div class="stat-card"><div class="label">Avg Rating Diff</div><div class="value">${stats.avgRatingDiff.toFixed(2)}</div></div>
          <div class="stat-card"><div class="label">Length Bias</div><div class="value">${stats.lengthBias?.biased ? stats.lengthBias.direction : "none"}</div></div>
        `;
      } catch (err) {
        showStatus($("datasetStatus"), "Stats failed: " + err.message, false);
      }
    }

    async function createDataset() {
      const name = $("newDatasetName").value.trim();
      if (!name) { showStatus($("datasetStatus"), "Name is required", false); return; }
      try {
        await api("POST", "/api/v1/preferences/datasets", {
          name,
          workspace: workspace(),
          format: $("newDatasetFormat").value,
          sourceType: $("newDatasetSource").value,
        });
        $("newDatasetName").value = "";
        showStatus($("datasetStatus"), "Dataset created", true);
        await loadDatasets();
      } catch (err) {
        showStatus($("datasetStatus"), err.message, false);
      }
    }

    async function startComparison() {
      const prompt = $("comparisonPrompt").value.trim();
      const responses = [];
      for (const id of ["respA", "respB", "respC"]) {
        const v = $(id).value.trim();
        if (v) responses.push({ id, content: v });
      }
      if (!prompt) { alert("Prompt is required"); return; }
      if (responses.length < 2) { alert("At least 2 responses required"); return; }

      try {
        const result = await api("POST", "/api/v1/preferences/comparisons", {
          prompt,
          responses,
          workspace: workspace(),
        });
        state.currentComparison = result;
        state.ranking = [];
        renderRanking();
        $("rankingSection").style.display = "block";
        $("rankingSection").scrollIntoView({ behavior: "smooth" });
      } catch (err) {
        alert("Failed: " + err.message);
      }
    }

    function renderRanking() {
      if (!state.currentComparison) return;
      $("currentPrompt").textContent = state.currentComparison.prompt;
      const grid = $("responsesGrid");
      grid.innerHTML = "";
      state.currentComparison.responses.forEach((r, idx) => {
        const card = document.createElement("div");
        card.className = "response-card";
        const rank = state.ranking.indexOf(r.id);
        if (rank >= 0) card.classList.add("rank-" + (rank + 1));
        const key = idx < 9 ? String(idx + 1) : "";
        const rankText = rank >= 0 ? `Rank #${rank + 1}` : "Click to rank";
        card.innerHTML = `
          <div class="header-row">
            <span class="key">${key || r.id}</span>
            <span class="rank-badge">${rankText}</span>
          </div>
          <div class="content">${escapeHtml(r.content)}</div>
        `;
        card.onclick = () => toggleRank(r.id);
        grid.appendChild(card);
      });
      const total = state.currentComparison.responses.length;
      const ranked = state.ranking.length;
      $("progressFill").style.width = (total ? (ranked / total) * 100 : 0) + "%";
      $("progressText").textContent = `Ranked ${ranked} / ${total}`;
    }

    function toggleRank(responseId) {
      const existing = state.ranking.indexOf(responseId);
      if (existing >= 0) {
        state.ranking.splice(existing, 1);
      } else {
        state.ranking.push(responseId);
      }
      renderRanking();
    }

    async function submitRanking() {
      if (!state.currentComparison) return;
      if (state.ranking.length < 2) {
        showStatus($("rankingStatus"), "Rank at least 2 responses", false);
        return;
      }
      try {
        const body = {
          ranking: state.ranking,
          workspace: workspace(),
        };
        if (state.activeDatasetId) body.datasetId = state.activeDatasetId;
        const result = await api(
          "POST",
          `/api/v1/preferences/comparisons/${state.currentComparison.comparisonId}/rank`,
          body,
        );
        const msg = `${result.pairCount} pairs generated` +
          (result.added != null ? ` (${result.added} added to dataset)` : "");
        showStatus($("rankingStatus"), msg, true);
        state.currentComparison = null;
        state.ranking = [];
        $("rankingSection").style.display = "none";
        $("comparisonPrompt").value = "";
        $("respA").value = "";
        $("respB").value = "";
        $("respC").value = "";
        await loadDatasets();
        if (state.activeDatasetId) await loadStats();
      } catch (err) {
        showStatus($("rankingStatus"), err.message, false);
      }
    }

    async function extractFromFeedback() {
      if (!state.activeDatasetId) {
        alert("Select a dataset first");
        return;
      }
      try {
        const result = await api("POST", "/api/v1/preferences/extract/feedback", {
          workspace: workspace(),
          datasetId: state.activeDatasetId,
          minRatingDiff: 2,
        });
        showStatus(
          $("datasetStatus"),
          `Extracted ${result.extracted}, added ${result.added || 0}`,
          true,
        );
        await loadDatasets();
        await loadStats();
      } catch (err) {
        showStatus($("datasetStatus"), err.message, false);
      }
    }

    async function validateDataset() {
      if (!state.activeDatasetId) return;
      try {
        const result = await api("GET", `/api/v1/preferences/datasets/${state.activeDatasetId}/validate?workspace=${encodeURIComponent(workspace())}`);
        const div = $("validationResults");
        div.innerHTML = `
          <div style="margin-bottom: 0.5rem">
            <strong>${result.valid ? "Valid" : "Invalid"}</strong> · Score: ${result.score}/100 ·
            ${result.errorCount} errors · ${result.warningCount} warnings
          </div>
        `;
        for (const issue of result.issues || []) {
          const el = document.createElement("div");
          el.className = "issue " + issue.severity;
          el.textContent = `[${issue.type}] ${issue.message}`;
          div.appendChild(el);
        }
      } catch (err) {
        showStatus($("datasetStatus"), err.message, false);
      }
    }

    async function exportDataset(format) {
      if (!state.activeDatasetId) return;
      const url = `/api/v1/preferences/datasets/${state.activeDatasetId}/export?workspace=${encodeURIComponent(workspace())}&format=${format}&download=1`;
      const res = await fetch(url, { headers: headers() });
      if (!res.ok) {
        showStatus($("datasetStatus"), "Export failed", false);
        return;
      }
      const blob = await res.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `preferences-${state.activeDatasetId}-${format}.jsonl`;
      a.click();
    }

    async function deleteDataset() {
      if (!state.activeDatasetId) return;
      if (!confirm("Delete this dataset? This cannot be undone.")) return;
      try {
        await api("DELETE", `/api/v1/preferences/datasets/${state.activeDatasetId}?workspace=${encodeURIComponent(workspace())}`);
        state.activeDatasetId = null;
        $("datasetDetailsSection").style.display = "none";
        await loadDatasets();
      } catch (err) {
        showStatus($("datasetStatus"), err.message, false);
      }
    }

    // Keyboard shortcuts for ranking
    document.addEventListener("keydown", (e) => {
      if (!state.currentComparison) return;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
      if (e.key >= "1" && e.key <= "9") {
        const idx = parseInt(e.key, 10) - 1;
        const resp = state.currentComparison.responses[idx];
        if (resp) { toggleRank(resp.id); e.preventDefault(); }
      } else if (e.key === "Enter") {
        submitRanking(); e.preventDefault();
      } else if (e.key === "Escape") {
        state.ranking = []; renderRanking(); e.preventDefault();
      }
    });

    $("createBtn").onclick = createDataset;
    $("refreshBtn").onclick = loadDatasets;
    $("startCompareBtn").onclick = startComparison;
    $("extractBtn").onclick = extractFromFeedback;
    $("submitRankingBtn").onclick = submitRanking;
    $("clearRankingBtn").onclick = () => { state.ranking = []; renderRanking(); };
    $("cancelRankingBtn").onclick = () => {
      state.currentComparison = null;
      state.ranking = [];
      $("rankingSection").style.display = "none";
    };
    $("validateBtn").onclick = validateDataset;
    $("exportDpoBtn").onclick = () => exportDataset("dpo");
    $("exportRewardBtn").onclick = () => exportDataset("reward_model");
    $("exportOpenaiBtn").onclick = () => exportDataset("openai_jsonl");
    $("deleteDatasetBtn").onclick = deleteDataset;

    loadDatasets();
  </script>
</body>
</html>
