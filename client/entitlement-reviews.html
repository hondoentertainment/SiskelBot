<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Siskel Bot - Entitlement Reviews</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
    }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }
    header {
      padding: 0.75rem 1rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 1.125rem; font-weight: 600; }
    header a { color: #60a5fa; text-decoration: none; }
    header a:hover { text-decoration: underline; }

    main {
      padding: 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .section h2 {
      margin: 0 0 0.75rem 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls label { font-size: 0.8rem; color: #94a3b8; }
    .controls input, .controls select, .controls button, .controls textarea {
      padding: 0.4rem 0.6rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.85rem;
      font-family: inherit;
    }
    button {
      padding: 0.4rem 0.8rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { background: #2563eb; }
    button.ghost {
      background: transparent;
      border: 1px solid #334155;
      color: #e2e8f0;
    }
    button.ghost:hover { background: #243244; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    button.success { background: #16a34a; }
    button.success:hover { background: #15803d; }
    button.warning { background: #ca8a04; }
    button.warning:hover { background: #a16207; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .stat {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.75rem;
    }
    .stat .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.05em;
    }
    .stat .value {
      font-size: 1.5rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-top: 0.25rem;
    }
    .stat .value.green { color: #22c55e; }
    .stat .value.yellow { color: #eab308; }
    .stat .value.red { color: #ef4444; }
    .stat .value.blue { color: #60a5fa; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      text-align: left;
      padding: 0.5rem;
      border-bottom: 1px solid #334155;
    }
    th {
      background: #0f172a;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr:hover td { background: #243244; }

    .status-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status-badge.open { background: #1e3a8a; color: #93c5fd; }
    .status-badge.completed { background: #14532d; color: #4ade80; }
    .status-badge.pending { background: #1e293b; color: #94a3b8; }
    .status-badge.approved { background: #14532d; color: #4ade80; }
    .status-badge.revoked { background: #7f1d1d; color: #f87171; }
    .status-badge.changed { background: #713f12; color: #facc15; }
    .status-badge.overdue { background: #7f1d1d; color: #f87171; }

    .muted { color: #64748b; font-size: 0.85rem; }
    .error-box {
      background: #7f1d1d;
      color: #fecaca;
      padding: 0.6rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
    }
    .success-box {
      background: #14532d;
      color: #bbf7d0;
      padding: 0.6rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
    }

    .row-actions {
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
    }
    .row-actions button {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
    }

    .progress-bar {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 999px;
      height: 8px;
      overflow: hidden;
      margin: 0.5rem 0;
    }
    .progress-bar .fill {
      background: #22c55e;
      height: 100%;
      transition: width 0.3s ease;
    }

    .review-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
    }
    .review-card:hover { border-color: #60a5fa; }
    .review-card.selected { border-color: #60a5fa; background: #1e293b; }
    .review-card .name { font-weight: 600; margin-bottom: 0.25rem; }
    .review-card .meta { font-size: 0.75rem; color: #94a3b8; }

    .hidden { display: none; }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1rem;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 0.5rem;
    }
    .form-row label { font-size: 0.75rem; color: #94a3b8; }
    .form-row input, .form-row select, .form-row textarea {
      padding: 0.4rem 0.6rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.85rem;
      font-family: inherit;
    }

    .comment-input {
      width: 100%;
      padding: 0.4rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #e2e8f0;
      font-size: 0.75rem;
    }

    .ws-list {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .ws-list .ws-item {
      display: inline-block;
      background: #1e293b;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      margin: 0.1rem 0.2rem 0.1rem 0;
      font-family: ui-monospace, Menlo, monospace;
    }
  </style>
</head>
<body>
  <header>
    <h1>Entitlement Reviews</h1>
    <a href="/index.html">Chat</a>
    <a href="/admin.html">Admin</a>
    <a href="/compliance.html">Compliance</a>
  </header>

  <main>
    <div id="message"></div>

    <section class="section">
      <h2>Create new review</h2>
      <div class="controls" style="align-items: flex-end;">
        <div class="form-row" style="min-width: 200px;">
          <label for="new-name">Name</label>
          <input id="new-name" type="text" placeholder="Q1 2026 access review">
        </div>
        <div class="form-row">
          <label for="new-scope">Scope</label>
          <select id="new-scope">
            <option value="all_users">All users</option>
            <option value="workspace">Workspace</option>
            <option value="role">Role</option>
            <option value="users">Specific users</option>
          </select>
        </div>
        <div class="form-row" style="min-width: 200px;">
          <label for="new-reviewers">Reviewers (comma-separated)</label>
          <input id="new-reviewers" type="text" placeholder="admin@example.com,sec@example.com">
        </div>
        <div class="form-row">
          <label for="new-due">Due date</label>
          <input id="new-due" type="date">
        </div>
        <div class="form-row">
          <label for="new-auto-revoke">Auto-revoke on no action</label>
          <select id="new-auto-revoke">
            <option value="false">No</option>
            <option value="true">Yes</option>
          </select>
        </div>
        <button onclick="createNewReview()">Create review</button>
      </div>
    </section>

    <div class="layout">
      <section class="section">
        <h2>Active reviews</h2>
        <div class="controls">
          <select id="status-filter" onchange="loadReviews()">
            <option value="">All</option>
            <option value="open" selected>Open</option>
            <option value="completed">Completed</option>
          </select>
          <button class="ghost" onclick="loadReviews()">Refresh</button>
        </div>
        <div id="reviews-list"></div>
      </section>

      <section class="section">
        <div id="review-detail">
          <p class="muted">Select a review to see details.</p>
        </div>
      </section>
    </div>
  </main>

  <script>
    const API_BASE = "/api/v1";
    let selectedReviewId = null;
    let currentItems = [];

    function getApiKey() {
      return localStorage.getItem("siskelbot_api_key") || "";
    }

    function getAdminApiKey() {
      return localStorage.getItem("siskelbot_admin_api_key") || getApiKey();
    }

    async function api(method, path, body, opts = {}) {
      const key = opts.admin ? getAdminApiKey() : getApiKey();
      const headers = { "Content-Type": "application/json" };
      if (key) headers["Authorization"] = `Bearer ${key}`;
      const res = await fetch(`${API_BASE}${path}`, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || `${res.status} ${res.statusText}`);
      }
      return data;
    }

    function showError(msg) {
      const el = document.getElementById("message");
      el.innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
      setTimeout(() => { el.innerHTML = ""; }, 6000);
    }

    function showSuccess(msg) {
      const el = document.getElementById("message");
      el.innerHTML = `<div class="success-box">${escapeHtml(msg)}</div>`;
      setTimeout(() => { el.innerHTML = ""; }, 4000);
    }

    function escapeHtml(s) {
      if (s == null) return "";
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function loadReviews() {
      try {
        const status = document.getElementById("status-filter").value;
        const path = status ? `/reviews?status=${encodeURIComponent(status)}` : "/reviews";
        const data = await api("GET", path);
        const reviews = data.reviews || [];
        const container = document.getElementById("reviews-list");
        if (reviews.length === 0) {
          container.innerHTML = '<p class="muted">No reviews found.</p>';
          return;
        }
        container.innerHTML = reviews.map((r) => {
          const overdue = r.status === "open" && new Date(r.dueDate) < new Date();
          const statusBadge = overdue ? "overdue" : r.status;
          const statusLabel = overdue ? "Overdue" : r.status;
          const pct = r.summary.total > 0
            ? Math.round(((r.summary.total - r.summary.pending) / r.summary.total) * 100)
            : 0;
          return `
            <div class="review-card ${selectedReviewId === r.id ? "selected" : ""}"
                 onclick="selectReview('${r.id}')">
              <div class="name">${escapeHtml(r.name)}</div>
              <div class="meta">
                <span class="status-badge ${statusBadge}">${statusLabel}</span>
                ${escapeHtml(r.scope)} - due ${new Date(r.dueDate).toLocaleDateString()}
              </div>
              <div class="progress-bar"><div class="fill" style="width: ${pct}%"></div></div>
              <div class="meta">${pct}% reviewed (${r.summary.total - r.summary.pending}/${r.summary.total})</div>
            </div>
          `;
        }).join("");
      } catch (e) {
        showError(`Failed to load reviews: ${e.message}`);
      }
    }

    async function selectReview(reviewId) {
      selectedReviewId = reviewId;
      await loadReviews();
      try {
        const review = await api("GET", `/reviews/${reviewId}`);
        const items = await api("GET", `/reviews/${reviewId}/items`);
        currentItems = items.items || [];
        renderReviewDetail(review, currentItems);
      } catch (e) {
        showError(`Failed to load review: ${e.message}`);
      }
    }

    function renderReviewDetail(review, items) {
      const container = document.getElementById("review-detail");
      const isOpen = review.status === "open";
      container.innerHTML = `
        <h2 style="margin-top:0;">${escapeHtml(review.name)}</h2>
        <div class="muted" style="margin-bottom: 0.75rem;">
          Scope: ${escapeHtml(review.scope)} -
          Status: <span class="status-badge ${review.status}">${review.status}</span> -
          Due: ${new Date(review.dueDate).toLocaleDateString()}
        </div>

        <div class="summary-grid">
          <div class="stat"><div class="label">Total</div><div class="value">${review.summary.total}</div></div>
          <div class="stat"><div class="label">Pending</div><div class="value yellow">${review.summary.pending}</div></div>
          <div class="stat"><div class="label">Approved</div><div class="value green">${review.summary.approved}</div></div>
          <div class="stat"><div class="label">Revoked</div><div class="value red">${review.summary.revoked}</div></div>
          <div class="stat"><div class="label">Changed</div><div class="value blue">${review.summary.changed}</div></div>
        </div>

        <div class="controls">
          ${isOpen ? `
            <button class="success" onclick="bulkApprove()">Bulk approve all</button>
            <button class="warning" onclick="sendReminders('${review.id}')">Send reminders</button>
            <button class="danger" onclick="completeReviewNow('${review.id}')">Complete review</button>
          ` : ""}
          <button class="ghost" onclick="exportReport('${review.id}')">Export report</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Workspaces</th>
              <th>Status</th>
              <th>Comment</th>
              ${isOpen ? "<th>Actions</th>" : ""}
            </tr>
          </thead>
          <tbody>
            ${items.map((item, idx) => renderItemRow(review.id, item, idx, isOpen)).join("")}
          </tbody>
        </table>
      `;
    }

    function renderItemRow(reviewId, item, idx, isOpen) {
      const decisionLabel = item.decision || "pending";
      const wsHtml = (item.workspaces || []).map((w) =>
        `<span class="ws-item">${escapeHtml(w.id)} (${escapeHtml(w.role || "")})</span>`
      ).join("");
      return `
        <tr>
          <td>${escapeHtml(item.userId)}</td>
          <td><div class="ws-list">${wsHtml || '<span class="muted">none</span>'}</div></td>
          <td><span class="status-badge ${decisionLabel}">${decisionLabel}</span></td>
          <td>
            ${isOpen
              ? `<input class="comment-input" id="comment-${idx}" placeholder="Optional comment">`
              : escapeHtml(item.comment || "")}
          </td>
          ${isOpen ? `
            <td>
              <div class="row-actions">
                <button class="success" onclick="approveItem('${reviewId}', '${escapeHtml(item.userId)}', ${idx})">Approve</button>
                <button class="danger" onclick="revokeItem('${reviewId}', '${escapeHtml(item.userId)}', ${idx})">Revoke</button>
                <button class="warning" onclick="changeItem('${reviewId}', '${escapeHtml(item.userId)}', ${idx})">Change role</button>
              </div>
            </td>
          ` : ""}
        </tr>
      `;
    }

    function getComment(idx) {
      const el = document.getElementById(`comment-${idx}`);
      return el?.value || "";
    }

    async function approveItem(reviewId, userId, idx) {
      try {
        await api("POST", `/reviews/${reviewId}/items/${encodeURIComponent(userId)}/approve`, {
          comment: getComment(idx),
        });
        showSuccess(`Approved ${userId}`);
        await selectReview(reviewId);
      } catch (e) {
        showError(`Approve failed: ${e.message}`);
      }
    }

    async function revokeItem(reviewId, userId, idx) {
      if (!confirm(`Revoke access for ${userId}?`)) return;
      try {
        await api("POST", `/reviews/${reviewId}/items/${encodeURIComponent(userId)}/revoke`, {
          comment: getComment(idx),
        });
        showSuccess(`Revoked ${userId}`);
        await selectReview(reviewId);
      } catch (e) {
        showError(`Revoke failed: ${e.message}`);
      }
    }

    async function changeItem(reviewId, userId, idx) {
      const newRole = prompt(`New role for ${userId}?`, "member");
      if (!newRole) return;
      try {
        await api("POST", `/reviews/${reviewId}/items/${encodeURIComponent(userId)}/change`, {
          newRole,
          comment: getComment(idx),
        });
        showSuccess(`Role change requested for ${userId}`);
        await selectReview(reviewId);
      } catch (e) {
        showError(`Change failed: ${e.message}`);
      }
    }

    async function bulkApprove() {
      if (!selectedReviewId) return;
      if (!confirm("Approve ALL pending users in this review?")) return;
      try {
        const pending = currentItems.filter((it) => !it.decision);
        for (const it of pending) {
          await api("POST", `/reviews/${selectedReviewId}/items/${encodeURIComponent(it.userId)}/approve`, {
            comment: "bulk approved",
          });
        }
        showSuccess(`Bulk approved ${pending.length} users`);
        await selectReview(selectedReviewId);
      } catch (e) {
        showError(`Bulk approve failed: ${e.message}`);
      }
    }

    async function completeReviewNow(reviewId) {
      if (!confirm("Complete this review and apply all decisions?")) return;
      try {
        const result = await api("POST", `/reviews/${reviewId}/complete`, {}, { admin: true });
        showSuccess(`Completed: ${result.totalReviewed} reviewed, ${result.revoked} revoked, ${result.changed} changed`);
        await loadReviews();
        await selectReview(reviewId);
      } catch (e) {
        showError(`Complete failed: ${e.message}`);
      }
    }

    async function sendReminders(reviewId) {
      try {
        const result = await api("POST", `/reviews/${reviewId}/remind`, {}, { admin: true });
        showSuccess(`Sent ${result.sent} reminders`);
      } catch (e) {
        showError(`Reminder failed: ${e.message}`);
      }
    }

    async function exportReport(reviewId) {
      try {
        const report = await api("GET", `/reviews/${reviewId}/report`);
        const blob = new Blob([JSON.stringify(report, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `entitlement-review-${reviewId}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showSuccess("Report downloaded");
      } catch (e) {
        showError(`Export failed: ${e.message}`);
      }
    }

    async function createNewReview() {
      try {
        const name = document.getElementById("new-name").value.trim();
        const scope = document.getElementById("new-scope").value;
        const reviewers = document.getElementById("new-reviewers").value
          .split(",").map((s) => s.trim()).filter(Boolean);
        const dueDate = document.getElementById("new-due").value;
        const autoRevoke = document.getElementById("new-auto-revoke").value === "true";

        if (!name || !dueDate || reviewers.length === 0) {
          showError("Name, due date, and at least one reviewer are required.");
          return;
        }

        const result = await api("POST", "/reviews", {
          name,
          scope,
          reviewers,
          dueDate: new Date(dueDate).toISOString(),
          autoRevokeOnNoAction: autoRevoke,
        }, { admin: true });

        showSuccess(`Created review with ${result.summary.total} items`);
        document.getElementById("new-name").value = "";
        await loadReviews();
        await selectReview(result.id);
      } catch (e) {
        showError(`Create failed: ${e.message}`);
      }
    }

    // Initial load
    loadReviews();
  </script>
</body>
</html>
