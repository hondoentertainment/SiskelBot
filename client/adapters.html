<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>LoRA Adapters - Siskel Bot</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
    }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      padding: 0.75rem 1rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 1.125rem; font-weight: 600; }
    .ws-indicator {
      margin-left: auto;
      font-size: 0.8125rem;
      color: #94a3b8;
    }
    .ws-indicator strong { color: #facc15; }
    main {
      padding: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
    }
    .panel h2 {
      margin: 0 0 0.75rem 0;
      font-size: 0.875rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }
    .row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    input, select, textarea {
      padding: 0.5rem 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.875rem;
      font-family: inherit;
    }
    input[type="text"], input[type="password"] { min-width: 220px; }
    .btn {
      padding: 0.5rem 0.875rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 500;
      transition: background 0.15s;
      font-family: inherit;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover { background: #475569; }
    .btn-danger { background: #7f1d1d; color: #fecaca; }
    .btn-danger:hover { background: #991b1b; }
    .btn-success { background: #14532d; color: #bbf7d0; }
    .btn-success:hover { background: #166534; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .adapter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .adapter-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .adapter-card.active {
      border-color: #facc15;
      box-shadow: 0 0 0 1px #facc15 inset;
    }
    .adapter-card.loaded { border-left: 3px solid #22c55e; }
    .adapter-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .adapter-name {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
      color: #f1f5f9;
    }
    .adapter-badge {
      font-size: 0.6875rem;
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    .badge-loaded { background: #14532d; color: #bbf7d0; }
    .badge-unloaded { background: #334155; color: #94a3b8; }
    .badge-active { background: #854d0e; color: #fef3c7; }
    .adapter-meta {
      font-size: 0.75rem;
      color: #94a3b8;
      margin: 0;
      line-height: 1.5;
    }
    .adapter-meta strong { color: #cbd5e1; }
    .adapter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
    }
    .adapter-tag {
      font-size: 0.6875rem;
      padding: 0.125rem 0.5rem;
      border-radius: 999px;
      background: #1e3a8a;
      color: #c7d2fe;
    }
    .adapter-actions {
      display: flex;
      gap: 0.375rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .adapter-metrics {
      border-top: 1px solid #334155;
      padding-top: 0.5rem;
      font-size: 0.75rem;
      color: #94a3b8;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.25rem 0.75rem;
    }
    .adapter-metrics strong { color: #e2e8f0; }
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: #64748b;
      font-size: 0.875rem;
    }
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      padding: 0.75rem 1rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.8125rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      transform: translateY(200%);
      transition: transform 0.2s ease;
      max-width: 360px;
    }
    #toast.show { transform: translateY(0); }
    #toast.error { border-color: #7f1d1d; color: #fecaca; }
    #toast.success { border-color: #14532d; color: #bbf7d0; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    label.field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    label.field input, label.field select {
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>LoRA / Adapter Manager</h1>
    <a href="/">Chat</a>
    <a href="/admin.html">Admin</a>
    <span class="ws-indicator">Workspace: <strong id="wsLabel">default</strong></span>
  </header>

  <main>
    <div class="panel">
      <h2>Active workspace adapter</h2>
      <div class="row">
        <label class="field" style="flex:1; min-width:240px;">
          <span>Workspace ID</span>
          <input id="wsInput" type="text" value="default">
        </label>
        <label class="field" style="flex:1; min-width:240px;">
          <span>Active adapter</span>
          <select id="activeSelect">
            <option value="">(none)</option>
          </select>
        </label>
        <button class="btn btn-primary" id="btnSaveActive">Save</button>
        <button class="btn btn-secondary" id="btnClearActive">Clear</button>
      </div>
      <p class="adapter-meta" id="activeStatus" style="margin-top:0.5rem;">No active adapter</p>
    </div>

    <div class="panel">
      <h2>Register adapter</h2>
      <div class="form-grid">
        <label class="field">
          <span>Name</span>
          <input id="regName" type="text" placeholder="my-custom-adapter">
        </label>
        <label class="field">
          <span>Base model</span>
          <input id="regBase" type="text" placeholder="gpt-3.5-turbo or llama3">
        </label>
        <label class="field">
          <span>Source</span>
          <select id="regSource">
            <option value="local">local</option>
            <option value="huggingface">huggingface</option>
            <option value="openai">openai</option>
            <option value="url">url</option>
          </select>
        </label>
        <label class="field">
          <span>Adapter type</span>
          <select id="regType">
            <option value="lora">lora</option>
            <option value="qlora">qlora</option>
            <option value="full">full</option>
          </select>
        </label>
        <label class="field">
          <span>Scope</span>
          <select id="regScope">
            <option value="workspace">workspace</option>
            <option value="global">global</option>
          </select>
        </label>
        <label class="field">
          <span>Source config JSON</span>
          <input id="regConfig" type="text" placeholder='{"modelId":"org/name"}'>
        </label>
      </div>
      <div class="row" style="margin-top:0.75rem;">
        <button class="btn btn-primary" id="btnRegister">Register</button>
      </div>
    </div>

    <div class="panel">
      <h2>Import from OpenAI fine-tune</h2>
      <div class="row">
        <input id="openaiJobId" type="text" placeholder="ftjob-...">
        <input id="openaiKey" type="password" placeholder="OpenAI API key (optional if env set)">
        <button class="btn btn-success" id="btnImportOpenAI">Import</button>
      </div>
    </div>

    <div class="panel">
      <h2>Import from HuggingFace</h2>
      <div class="row">
        <input id="hfModelId" type="text" placeholder="org/adapter-name">
        <label class="field" style="flex-direction:row; align-items:center; gap:0.375rem;">
          <input id="hfRegister" type="checkbox" style="min-width:auto; width:auto;"> Register after fetch
        </label>
        <button class="btn btn-success" id="btnImportHF">Fetch / Import</button>
      </div>
    </div>

    <div class="panel">
      <h2>Adapters</h2>
      <div class="row" style="margin-bottom:0.75rem;">
        <button class="btn btn-secondary" id="btnRefresh">Refresh</button>
      </div>
      <div id="adapterList" class="adapter-grid"></div>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = { adapters: [], activeId: null };

    function toast(msg, kind = "info") {
      const t = $("toast");
      t.textContent = msg;
      t.className = "show " + kind;
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove("show"), 3200);
    }

    async function api(method, path, body) {
      const opts = { method, headers: { "Content-Type": "application/json" }, credentials: "include" };
      if (body != null) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      if (res.status === 204) return null;
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { error: text }; }
      if (!res.ok) throw new Error(data?.error || data?.message || `HTTP ${res.status}`);
      return data;
    }

    function getWorkspace() {
      return $("wsInput").value.trim() || "default";
    }

    function fmtDate(iso) {
      if (!iso) return "never";
      try { return new Date(iso).toLocaleString(); } catch { return iso; }
    }

    function renderAdapters() {
      const container = $("adapterList");
      if (!state.adapters.length) {
        container.innerHTML = '<div class="empty-state">No adapters registered. Register or import one above.</div>';
      } else {
        container.innerHTML = "";
        for (const a of state.adapters) {
          const card = document.createElement("div");
          const isActive = a.id === state.activeId;
          card.className = "adapter-card" + (a.loaded ? " loaded" : "") + (isActive ? " active" : "");
          const badges = [];
          if (isActive) badges.push('<span class="adapter-badge badge-active">active</span>');
          badges.push('<span class="adapter-badge ' + (a.loaded ? "badge-loaded" : "badge-unloaded") + '">' + (a.loaded ? "loaded" : "unloaded") + '</span>');
          const tags = (a.tags || []).map((t) => '<span class="adapter-tag">' + escapeHtml(t) + '</span>').join("");
          card.innerHTML = [
            '<div class="adapter-header">',
            '  <h3 class="adapter-name">' + escapeHtml(a.name) + '</h3>',
            '  <div>' + badges.join(" ") + '</div>',
            '</div>',
            '<p class="adapter-meta"><strong>ID:</strong> ' + escapeHtml(a.id) + '</p>',
            '<p class="adapter-meta"><strong>Base:</strong> ' + escapeHtml(a.baseModel) + '  <strong>Type:</strong> ' + escapeHtml(a.adapterType) + '  <strong>Source:</strong> ' + escapeHtml(a.source) + '</p>',
            '<p class="adapter-meta"><strong>Scope:</strong> ' + escapeHtml(a.scope) + (a.workspaceId ? " (" + escapeHtml(a.workspaceId) + ")" : "") + '</p>',
            tags ? '<div class="adapter-tags">' + tags + '</div>' : "",
            '<div class="adapter-metrics" data-metrics-id="' + escapeHtml(a.id) + '">',
            '  <div>Usage: <strong>...</strong></div>',
            '  <div>Avg latency: <strong>...</strong></div>',
            '  <div>Error rate: <strong>...</strong></div>',
            '  <div>Last used: <strong>...</strong></div>',
            '</div>',
            '<div class="adapter-actions">',
            '  <button class="btn btn-' + (a.loaded ? "secondary" : "success") + '" data-action="' + (a.loaded ? "unload" : "load") + '" data-id="' + escapeHtml(a.id) + '">' + (a.loaded ? "Unload" : "Load") + '</button>',
            '  <button class="btn btn-primary" data-action="activate" data-id="' + escapeHtml(a.id) + '">Set active</button>',
            '  <button class="btn btn-secondary" data-action="metrics" data-id="' + escapeHtml(a.id) + '">Metrics</button>',
            '  <button class="btn btn-danger" data-action="delete" data-id="' + escapeHtml(a.id) + '">Delete</button>',
            '</div>',
          ].join("");
          container.appendChild(card);
        }
      }
      const sel = $("activeSelect");
      sel.innerHTML = '<option value="">(none)</option>';
      for (const a of state.adapters) {
        const opt = document.createElement("option");
        opt.value = a.id;
        opt.textContent = a.name + " (" + a.source + ")";
        if (a.id === state.activeId) opt.selected = true;
        sel.appendChild(opt);
      }
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function loadAdapters() {
      const ws = getWorkspace();
      try {
        const data = await api("GET", "/api/v1/adapters?workspace=" + encodeURIComponent(ws));
        state.adapters = data?.adapters || [];
        const active = await api("GET", "/api/v1/workspaces/" + encodeURIComponent(ws) + "/active-adapter").catch(() => null);
        state.activeId = active?.adapter?.id || null;
        $("activeStatus").textContent = active?.adapter
          ? "Active: " + active.adapter.name + " (" + active.adapter.id + ")"
          : "No active adapter";
        $("wsLabel").textContent = ws;
        renderAdapters();
        for (const a of state.adapters) loadMetrics(a.id);
      } catch (e) {
        toast("Failed to load adapters: " + e.message, "error");
      }
    }

    async function loadMetrics(id) {
      try {
        const data = await api("GET", "/api/v1/adapters/" + encodeURIComponent(id) + "/metrics");
        const m = data?.metrics || {};
        const el = document.querySelector('[data-metrics-id="' + CSS.escape(id) + '"]');
        if (!el) return;
        el.innerHTML = [
          '<div>Usage: <strong>' + (m.usage || 0) + '</strong></div>',
          '<div>Avg latency: <strong>' + Math.round(m.avgLatency || 0) + 'ms</strong></div>',
          '<div>Error rate: <strong>' + ((m.errorRate || 0) * 100).toFixed(2) + '%</strong></div>',
          '<div>Last used: <strong>' + fmtDate(m.lastUsed) + '</strong></div>',
        ].join("");
      } catch (_) {}
    }

    document.addEventListener("click", async (evt) => {
      const btn = evt.target.closest("[data-action]");
      if (!btn) return;
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      try {
        if (action === "load") {
          await api("POST", "/api/v1/adapters/" + encodeURIComponent(id) + "/load");
          toast("Adapter loaded", "success");
        } else if (action === "unload") {
          await api("POST", "/api/v1/adapters/" + encodeURIComponent(id) + "/unload");
          toast("Adapter unloaded", "success");
        } else if (action === "activate") {
          const ws = getWorkspace();
          await api("PUT", "/api/v1/workspaces/" + encodeURIComponent(ws) + "/active-adapter", { adapterId: id });
          toast("Active adapter set", "success");
        } else if (action === "delete") {
          if (!confirm("Delete adapter " + id + "?")) return;
          await api("DELETE", "/api/v1/adapters/" + encodeURIComponent(id));
          toast("Adapter deleted", "success");
        } else if (action === "metrics") {
          await loadMetrics(id);
          toast("Metrics refreshed", "info");
          return;
        }
        await loadAdapters();
      } catch (e) {
        toast(e.message, "error");
      }
    });

    $("btnRefresh").addEventListener("click", loadAdapters);
    $("wsInput").addEventListener("change", loadAdapters);

    $("btnSaveActive").addEventListener("click", async () => {
      const ws = getWorkspace();
      const adapterId = $("activeSelect").value || null;
      try {
        await api("PUT", "/api/v1/workspaces/" + encodeURIComponent(ws) + "/active-adapter", { adapterId });
        toast("Active adapter saved", "success");
        await loadAdapters();
      } catch (e) { toast(e.message, "error"); }
    });

    $("btnClearActive").addEventListener("click", async () => {
      const ws = getWorkspace();
      try {
        await api("PUT", "/api/v1/workspaces/" + encodeURIComponent(ws) + "/active-adapter", { adapterId: null });
        toast("Active adapter cleared", "success");
        await loadAdapters();
      } catch (e) { toast(e.message, "error"); }
    });

    $("btnRegister").addEventListener("click", async () => {
      const name = $("regName").value.trim();
      const baseModel = $("regBase").value.trim();
      const source = $("regSource").value;
      const adapterType = $("regType").value;
      const scope = $("regScope").value;
      const workspaceId = scope === "workspace" ? getWorkspace() : null;
      let sourceConfig = {};
      const cfgRaw = $("regConfig").value.trim();
      if (cfgRaw) {
        try { sourceConfig = JSON.parse(cfgRaw); }
        catch { toast("Source config must be valid JSON", "error"); return; }
      }
      if (!name || !baseModel) { toast("Name and base model are required", "error"); return; }
      try {
        await api("POST", "/api/v1/adapters", { name, baseModel, adapterType, source, scope, workspaceId, sourceConfig });
        toast("Adapter registered", "success");
        $("regName").value = "";
        $("regBase").value = "";
        $("regConfig").value = "";
        await loadAdapters();
      } catch (e) { toast(e.message, "error"); }
    });

    $("btnImportOpenAI").addEventListener("click", async () => {
      const jobId = $("openaiJobId").value.trim();
      const apiKey = $("openaiKey").value.trim() || undefined;
      if (!jobId) { toast("jobId is required", "error"); return; }
      try {
        await api("POST", "/api/v1/adapters/import/openai", {
          jobId,
          apiKey,
          workspaceId: getWorkspace(),
          scope: "workspace",
        });
        toast("OpenAI fine-tune imported", "success");
        $("openaiJobId").value = "";
        $("openaiKey").value = "";
        await loadAdapters();
      } catch (e) { toast(e.message, "error"); }
    });

    $("btnImportHF").addEventListener("click", async () => {
      const modelId = $("hfModelId").value.trim();
      const register = $("hfRegister").checked;
      if (!modelId) { toast("modelId is required", "error"); return; }
      try {
        const res = await api("POST", "/api/v1/adapters/import/huggingface", {
          modelId,
          register,
          workspaceId: getWorkspace(),
          scope: "workspace",
        });
        if (register) {
          toast("HF adapter registered", "success");
          $("hfModelId").value = "";
          await loadAdapters();
        } else {
          toast("Fetched: " + (res?.info?.modelId || modelId), "info");
        }
      } catch (e) { toast(e.message, "error"); }
    });

    loadAdapters();
  </script>
</body>
</html>
