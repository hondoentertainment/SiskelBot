<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>SiskelBot Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body { font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; background: #0f172a; color: #e2e8f0; }

    .header { padding: 0.875rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; }
    .header h1 { font-size: 1.0625rem; font-weight: 700; }
    .header .meta { font-size: 0.75rem; color: #64748b; }
    .header-right { display: flex; align-items: center; gap: 0.75rem; }
    .header button { padding: 0.4rem 0.75rem; background: #334155; border: 1px solid #475569; border-radius: 6px; color: #e2e8f0; font-size: 0.75rem; cursor: pointer; }
    .header button:hover { background: #475569; }
    .refresh-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; display: inline-block; margin-right: 0.5rem; }
    .refresh-info { font-size: 0.75rem; color: #64748b; }

    .content { padding: 1.5rem; max-width: 1400px; margin: 0 auto; }

    .desc { font-size: 0.8125rem; color: #94a3b8; margin-bottom: 1rem; max-width: 700px; }

    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 0.875rem; }
    .widget { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem; min-height: 120px; }
    .widget-title { font-size: 0.8125rem; font-weight: 600; color: #e2e8f0; margin-bottom: 0.5rem; }
    .widget-body { font-size: 0.8125rem; color: #cbd5e1; }

    .metric-value { font-size: 2rem; font-weight: 700; color: #f1f5f9; }
    .metric-label { font-size: 0.6875rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.25rem; }

    .bar-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.375rem; font-size: 0.75rem; }
    .bar-row .bar-label { flex: 0 0 100px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-row .bar-track { flex: 1; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; }
    .bar-row .bar-fill { height: 100%; background: #3b82f6; }
    .bar-row .bar-val { flex: 0 0 50px; text-align: right; color: #cbd5e1; }

    table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
    th, td { padding: 0.375rem 0.5rem; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #64748b; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.6875rem; }

    .loading { text-align: center; padding: 3rem; color: #64748b; }
    .error { padding: 1rem; background: #7f1d1d33; border: 1px solid #991b1b; border-radius: 6px; color: #fecaca; }

    /* Presentation mode */
    body.presentation .header { display: none; }
    body.presentation .content { padding: 1rem; max-width: none; }
    body.presentation .desc { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1 id="dashTitle">Loading…</h1>
      <div class="meta" id="dashMeta"></div>
    </div>
    <div class="header-right">
      <span class="refresh-dot"></span>
      <span class="refresh-info">Auto-refresh: 60s</span>
      <button id="presentBtn">Presentation Mode</button>
    </div>
  </div>

  <div class="content">
    <div id="dashDesc" class="desc"></div>
    <div id="grid" class="grid">
      <div class="loading" style="grid-column: 1 / -1;">Loading dashboard…</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token");
    const presentParam = params.get("present");
    let dashboard = null;
    let refreshTimer = null;

    if (presentParam === "1") document.body.classList.add("presentation");

    document.getElementById("presentBtn").addEventListener("click", () => {
      const next = !document.body.classList.contains("presentation");
      document.body.classList.toggle("presentation", next);
      const u = new URL(location.href);
      if (next) u.searchParams.set("present", "1");
      else u.searchParams.delete("present");
      history.replaceState(null, "", u);
    });

    async function load() {
      if (!token) {
        document.getElementById("grid").innerHTML = '<div class="error" style="grid-column: 1 / -1;">Missing share token in URL.</div>';
        return;
      }
      try {
        const resMeta = await fetch(`/api/v1/dashboards/shared/${encodeURIComponent(token)}`);
        if (!resMeta.ok) throw new Error(`HTTP ${resMeta.status}`);
        dashboard = await resMeta.json();
        document.getElementById("dashTitle").textContent = dashboard.name || "Dashboard";
        document.getElementById("dashMeta").textContent = `Updated ${new Date(dashboard.updatedAt).toLocaleString()}`;
        document.getElementById("dashDesc").textContent = dashboard.description || "";
        document.title = `${dashboard.name} · SiskelBot Dashboard`;

        const resData = await fetch(`/api/v1/dashboards/shared/${encodeURIComponent(token)}/data`);
        if (!resData.ok) throw new Error(`HTTP ${resData.status}`);
        const data = await resData.json();
        renderGrid(dashboard.layout?.widgets || [], data.widgets || []);
      } catch (err) {
        document.getElementById("grid").innerHTML = `<div class="error" style="grid-column: 1 / -1;">Failed to load: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderGrid(widgets, rendered) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      if (widgets.length === 0) {
        grid.innerHTML = '<div class="loading" style="grid-column: 1 / -1;">No widgets configured.</div>';
        return;
      }
      const byId = {};
      for (const r of rendered) byId[r.widgetId] = r;
      widgets.forEach((w) => {
        const card = document.createElement("div");
        card.className = "widget";
        const colSpan = Math.min(12, Math.max(2, w.position?.w || 4));
        card.style.gridColumn = `span ${colSpan}`;
        card.innerHTML = `<div class="widget-title">${escapeHtml(w.title || w.type)}</div><div class="widget-body" id="body-${w.id}"></div>`;
        grid.appendChild(card);
        const bodyEl = card.querySelector(`#body-${CSS.escape(w.id)}`);
        renderWidgetBody(bodyEl, w, byId[w.id]);
      });
    }

    function renderWidgetBody(el, widget, rendered) {
      if (rendered?.error) {
        el.innerHTML = `<div style="color:#fca5a5;font-size:0.75rem;">Error: ${escapeHtml(rendered.error)}</div>`;
        return;
      }
      const data = rendered?.data;
      if (!data) {
        el.innerHTML = '<div style="color:#64748b;">No data</div>';
        return;
      }
      switch (widget.type) {
        case "metric_card":
          el.innerHTML = `<div class="metric-value">${formatNumber(data.value, data.format)}</div><div class="metric-label">${escapeHtml(data.metric)} · ${escapeHtml(data.period)}</div>`;
          break;
        case "line_chart": {
          const points = data.points || [];
          if (points.length === 0) { el.innerHTML = '<div style="color:#64748b;">No data</div>'; break; }
          const max = Math.max(1, ...points.map((p) => p.y));
          const w = 320, h = 100;
          const step = points.length > 1 ? w / (points.length - 1) : w;
          const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${i * step},${h - (p.y / max) * h}`).join(" ");
          el.innerHTML = `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="#3b82f6" stroke-width="2"/></svg>`;
          break;
        }
        case "bar_chart": {
          const bars = data.bars || [];
          if (bars.length === 0) { el.innerHTML = '<div style="color:#64748b;">No data</div>'; break; }
          const max = Math.max(1, ...bars.map((b) => b.value));
          el.innerHTML = bars.slice(0, 10).map((b) => `
            <div class="bar-row">
              <div class="bar-label" title="${escapeHtml(b.label)}">${escapeHtml(b.label)}</div>
              <div class="bar-track"><div class="bar-fill" style="width:${(b.value / max) * 100}%"></div></div>
              <div class="bar-val">${formatNumber(b.value)}</div>
            </div>`).join("");
          break;
        }
        case "table": {
          const rows = data.rows || [];
          const cols = data.columns || ["name", "requests"];
          if (rows.length === 0) { el.innerHTML = '<div style="color:#64748b;">No data</div>'; break; }
          const head = cols.map((c) => `<th>${escapeHtml(c)}</th>`).join("");
          const body = rows.map((r) => `<tr>${cols.map((c) => `<td>${escapeHtml(String(r[c] ?? ""))}</td>`).join("")}</tr>`).join("");
          el.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
          break;
        }
        case "text":
          el.innerHTML = `<div style="white-space: pre-wrap;">${escapeHtml(data.content || "")}</div>`;
          break;
        case "iframe":
          el.innerHTML = data.url
            ? `<iframe src="${escapeHtml(data.url)}" style="width:100%;height:${Number(data.height) || 200}px;border:1px solid #334155;border-radius:4px;"></iframe>`
            : '<div style="color:#64748b;">No URL configured</div>';
          break;
        case "status":
          el.innerHTML = `<div style="display:flex;align-items:center;gap:0.5rem;"><span style="width:10px;height:10px;border-radius:50%;background:#34d399;display:inline-block;"></span><span>${escapeHtml(data.service)}</span></div><div class="metric-label">${escapeHtml(data.endpoint)}</div>`;
          break;
        default:
          el.textContent = JSON.stringify(data);
      }
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function formatNumber(n, format) {
      const num = Number(n) || 0;
      if (format === "currency") return `$${num.toFixed(2)}`;
      if (num >= 1_000_000) return `${(num / 1_000_000).toFixed(1)}M`;
      if (num >= 1_000) return `${(num / 1_000).toFixed(1)}k`;
      return String(num);
    }

    load();
    refreshTimer = setInterval(load, 60_000);
  </script>
</body>
</html>
