<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>SiskelBot - Synthetic Monitoring</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f8fafc;
    }
    .meta {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .toolbar {
      max-width: 1200px;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .toolbar input {
      padding: 0.5rem 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.875rem;
      min-width: 240px;
    }
    .btn {
      padding: 0.5rem 1rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .btn:hover { background: #2563eb; }
    .btn.secondary { background: #334155; }
    .btn.secondary:hover { background: #475569; }
    .btn.danger { background: #b91c1c; }
    .btn.danger:hover { background: #991b1b; }

    .section {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    .section h2 {
      margin-bottom: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    th, td {
      padding: 0.65rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid #334155;
    }
    th {
      font-weight: 600;
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    tr:hover td { background: #253348; cursor: pointer; }
    tr.selected td { background: #1e3a8a; }

    .pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .pill.pass { background: #064e3b; color: #6ee7b7; }
    .pill.fail { background: #7f1d1d; color: #fca5a5; }
    .pill.unknown { background: #334155; color: #94a3b8; }

    .muted { color: #64748b; font-size: 0.8rem; }
    .numeric { font-variant-numeric: tabular-nums; }

    .chart {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 80px;
      padding: 8px 0;
    }
    .bar {
      flex: 1;
      min-width: 3px;
      background: #475569;
      border-radius: 2px 2px 0 0;
      position: relative;
    }
    .bar.pass { background: #10b981; }
    .bar.fail { background: #ef4444; }
    .bar:hover { opacity: 0.8; }

    .details {
      display: none;
    }
    .details.active { display: block; }

    .history-row {
      display: grid;
      grid-template-columns: 140px 80px 100px 1fr;
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid #334155;
      font-size: 0.8rem;
      font-family: ui-monospace, Menlo, monospace;
    }
    .history-row.header {
      font-weight: 600;
      color: #94a3b8;
      background: #0f172a;
    }
    .history-row .output {
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      padding: 2rem;
      color: #64748b;
    }

    .error-toast {
      max-width: 1200px;
      margin: 0 auto 1rem;
      padding: 0.75rem 1rem;
      background: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #991b1b;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    @media (max-width: 640px) {
      body { padding: 1rem; }
      header h1 { font-size: 1.15rem; }
      th, td { padding: 0.45rem 0.5rem; font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Synthetic Monitoring</h1>
      <div class="meta">
        Automated smoke tests run on a schedule ·
        <a href="/">Home</a> ·
        <a href="/health.html">Status</a> ·
        <a href="/admin.html">Admin</a>
      </div>
    </div>
    <div>
      <button class="btn secondary" id="refresh-btn">Refresh</button>
      <button class="btn" id="run-all-btn">Run All</button>
    </div>
  </header>

  <div class="toolbar">
    <input type="password" id="api-key" placeholder="Admin API key (x-api-key)">
    <button class="btn secondary" id="save-key-btn">Save key</button>
    <span class="meta" id="key-status"></span>
  </div>

  <div id="error-toast" class="error-toast" style="display:none"></div>

  <section class="section">
    <h2>Checks</h2>
    <div id="checks-container">
      <div class="empty">Loading…</div>
    </div>
  </section>

  <section class="section details" id="details-section">
    <h2 id="details-title">Check details</h2>
    <div id="chart-container">
      <div class="chart" id="history-chart"></div>
      <div class="muted" id="chart-summary"></div>
    </div>
    <div id="history-list" style="margin-top: 1rem;"></div>
    <div style="margin-top: 1rem;">
      <button class="btn" id="run-selected-btn">Run now</button>
      <button class="btn danger" id="delete-selected-btn">Delete</button>
    </div>
  </section>

  <script>
    const API_BASE = "/api/v1";
    let apiKey = localStorage.getItem("siskelbot.adminKey") || "";
    let selectedId = null;
    let cachedChecks = [];

    const $ = (sel) => document.querySelector(sel);
    const apiKeyInput = $("#api-key");
    const keyStatus = $("#key-status");
    const errorToast = $("#error-toast");
    const checksContainer = $("#checks-container");
    const detailsSection = $("#details-section");
    const detailsTitle = $("#details-title");
    const historyChart = $("#history-chart");
    const chartSummary = $("#chart-summary");
    const historyList = $("#history-list");

    apiKeyInput.value = apiKey;
    updateKeyStatus();

    function updateKeyStatus() {
      keyStatus.textContent = apiKey ? "Key set" : "No key (required for admin endpoints)";
      keyStatus.style.color = apiKey ? "#10b981" : "#f87171";
    }

    function showError(msg) {
      if (!msg) {
        errorToast.style.display = "none";
        return;
      }
      errorToast.textContent = msg;
      errorToast.style.display = "block";
    }

    async function api(path, opts = {}) {
      const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
      if (apiKey) headers["x-api-key"] = apiKey;
      const res = await fetch(API_BASE + path, { ...opts, headers });
      if (!res.ok) {
        let body = null;
        try { body = await res.json(); } catch (_) {}
        const msg = body?.error || body?.message || res.statusText || `HTTP ${res.status}`;
        throw new Error(msg);
      }
      return res.json();
    }

    function fmtPct(v) {
      if (v == null) return "—";
      return v.toFixed(2) + "%";
    }
    function fmtMs(v) {
      if (v == null) return "—";
      return Math.round(v) + "ms";
    }
    function fmtTime(v) {
      if (!v) return "—";
      try {
        const d = new Date(v);
        return d.toLocaleString();
      } catch (_) {
        return v;
      }
    }

    async function loadChecks() {
      try {
        showError(null);
        const data = await api("/synthetic/checks");
        cachedChecks = data.checks || [];
        renderChecks();
        if (selectedId) {
          const still = cachedChecks.find((c) => c.id === selectedId);
          if (still) loadDetails(selectedId);
          else hideDetails();
        }
      } catch (e) {
        showError("Failed to load checks: " + e.message);
      }
    }

    function renderChecks() {
      if (cachedChecks.length === 0) {
        checksContainer.innerHTML = '<div class="empty">No checks registered.</div>';
        return;
      }
      const rows = cachedChecks.map((c) => {
        const pill = c.lastStatus === "pass"
          ? '<span class="pill pass">PASS</span>'
          : c.lastStatus === "fail"
            ? '<span class="pill fail">FAIL</span>'
            : '<span class="pill unknown">unknown</span>';
        const sel = c.id === selectedId ? "selected" : "";
        return `<tr class="${sel}" data-id="${escapeHtml(c.id)}">
          <td><strong>${escapeHtml(c.name)}</strong><div class="muted">${escapeHtml(c.id)} · ${escapeHtml(c.type)}</div></td>
          <td>${pill}</td>
          <td class="numeric">${fmtPct(c.uptime24h)}</td>
          <td class="numeric">${fmtMs(c.avgDurationMs24h)}</td>
          <td class="muted">${fmtTime(c.lastCheckedAt)}</td>
        </tr>`;
      }).join("");
      checksContainer.innerHTML = `
        <table>
          <thead>
            <tr><th>Check</th><th>Last status</th><th>Uptime (24h)</th><th>Avg latency</th><th>Last checked</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
      checksContainer.querySelectorAll("tr[data-id]").forEach((tr) => {
        tr.addEventListener("click", () => {
          selectedId = tr.getAttribute("data-id");
          renderChecks();
          loadDetails(selectedId);
        });
      });
    }

    async function loadDetails(id) {
      try {
        showError(null);
        const [history, stats] = await Promise.all([
          api(`/synthetic/checks/${encodeURIComponent(id)}/history?limit=100`),
          api(`/synthetic/checks/${encodeURIComponent(id)}/stats?period=24h`),
        ]);
        detailsSection.classList.add("active");
        detailsTitle.textContent = `Check details — ${id}`;
        renderChart(history.history || []);
        chartSummary.textContent =
          `${stats.total} runs in last 24h · uptime ${fmtPct(stats.uptime)} · avg ${fmtMs(stats.avgDurationMs)} · p95 ${fmtMs(stats.p95DurationMs)} · ${stats.failures} failures`;
        renderHistoryList(history.history || []);
      } catch (e) {
        showError("Failed to load details: " + e.message);
      }
    }

    function renderChart(history) {
      if (history.length === 0) {
        historyChart.innerHTML = '<div class="muted">No history yet.</div>';
        return;
      }
      const max = Math.max(...history.map((r) => r.durationMs || 1), 1);
      historyChart.innerHTML = history.map((r) => {
        const pct = Math.max(4, Math.round(((r.durationMs || 0) / max) * 100));
        const cls = r.status === "pass" ? "pass" : "fail";
        const title = `${r.timestamp}\n${r.status.toUpperCase()} · ${r.durationMs}ms\n${r.output || r.error || ""}`;
        return `<div class="bar ${cls}" style="height:${pct}%" title="${escapeHtml(title)}"></div>`;
      }).join("");
    }

    function renderHistoryList(history) {
      const recent = history.slice().reverse().slice(0, 25);
      if (recent.length === 0) {
        historyList.innerHTML = '<div class="muted">No recent runs.</div>';
        return;
      }
      const rows = recent.map((r) => {
        const pill = r.status === "pass"
          ? '<span class="pill pass">PASS</span>'
          : '<span class="pill fail">FAIL</span>';
        const info = r.output || r.error || "";
        return `<div class="history-row">
          <span>${escapeHtml(fmtTime(r.timestamp))}</span>
          <span>${pill}</span>
          <span class="numeric">${r.durationMs}ms</span>
          <span class="output" title="${escapeHtml(info)}">${escapeHtml(info)}</span>
        </div>`;
      }).join("");
      historyList.innerHTML = `
        <div class="history-row header">
          <span>Timestamp</span><span>Status</span><span>Duration</span><span>Output</span>
        </div>
        ${rows}
      `;
    }

    function hideDetails() {
      detailsSection.classList.remove("active");
      selectedId = null;
    }

    function escapeHtml(s) {
      if (s == null) return "";
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Event handlers
    $("#save-key-btn").addEventListener("click", () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem("siskelbot.adminKey", apiKey);
      updateKeyStatus();
      loadChecks();
    });

    $("#refresh-btn").addEventListener("click", loadChecks);

    $("#run-all-btn").addEventListener("click", async () => {
      try {
        showError(null);
        await Promise.all(
          cachedChecks.map((c) =>
            api(`/synthetic/checks/${encodeURIComponent(c.id)}/run`, { method: "POST" }),
          ),
        );
        loadChecks();
      } catch (e) {
        showError("Failed to run all: " + e.message);
      }
    });

    $("#run-selected-btn").addEventListener("click", async () => {
      if (!selectedId) return;
      try {
        showError(null);
        await api(`/synthetic/checks/${encodeURIComponent(selectedId)}/run`, { method: "POST" });
        await loadChecks();
      } catch (e) {
        showError("Failed to run check: " + e.message);
      }
    });

    $("#delete-selected-btn").addEventListener("click", async () => {
      if (!selectedId) return;
      if (!confirm(`Delete check "${selectedId}"?`)) return;
      try {
        showError(null);
        await api(`/synthetic/checks/${encodeURIComponent(selectedId)}`, { method: "DELETE" });
        hideDetails();
        loadChecks();
      } catch (e) {
        showError("Failed to delete: " + e.message);
      }
    });

    // Auto-refresh every 30s
    loadChecks();
    setInterval(loadChecks, 30_000);
  </script>
</body>
</html>
