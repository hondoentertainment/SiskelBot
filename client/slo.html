<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>SiskelBot - SLO Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #f8fafc;
    }
    .meta {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .section-title {
      max-width: 1200px;
      margin: 0 auto 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .grid {
      max-width: 1200px;
      margin: 0 auto 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #475569; }
    .card.critical { border-color: #991b1b; }
    .card.warning { border-color: #92400e; }
    .card.healthy { border-color: #065f46; }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .card-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f1f5f9;
      text-transform: capitalize;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-badge.healthy { background: #064e3b; color: #6ee7b7; }
    .status-badge.healthy .dot { background: #34d399; }
    .status-badge.warning { background: #78350f; color: #fcd34d; }
    .status-badge.warning .dot { background: #fbbf24; }
    .status-badge.critical { background: #7f1d1d; color: #fca5a5; }
    .status-badge.critical .dot { background: #f87171; }
    .card-desc {
      font-size: 0.82rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    .metric-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    .metric-label { color: #94a3b8; }
    .metric-value { color: #e2e8f0; font-weight: 600; }
    .metric-value.ok { color: #6ee7b7; }
    .metric-value.bad { color: #fca5a5; }
    .budget-row {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .pie-wrap {
      width: 120px;
      height: 120px;
      position: relative;
      flex-shrink: 0;
    }
    .pie-wrap svg { width: 100%; height: 100%; }
    .pie-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 0.82rem;
      color: #e2e8f0;
    }
    .pie-label .big { font-size: 1.15rem; font-weight: 700; display: block; }
    .pie-label .small { color: #94a3b8; font-size: 0.7rem; }
    .budget-info { flex: 1; display: flex; flex-direction: column; gap: 0.35rem; }
    .burn-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      font-size: 0.82rem;
    }
    .burn-indicator.healthy { border-color: #065f46; color: #6ee7b7; }
    .burn-indicator.warning { border-color: #92400e; color: #fcd34d; }
    .burn-indicator.critical { border-color: #991b1b; color: #fca5a5; }
    .burn-indicator strong { font-size: 1rem; }
    .burn-chart {
      margin-top: 0.25rem;
      height: 80px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.5rem;
      position: relative;
    }
    .burn-chart svg { width: 100%; height: 100%; display: block; }
    .error-box {
      max-width: 1200px;
      margin: 0 auto 2rem;
      background: #7f1d1d;
      border: 1px solid #991b1b;
      color: #fca5a5;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    .empty-state {
      max-width: 1200px;
      margin: 0 auto 2rem;
      text-align: center;
      padding: 3rem 1rem;
      color: #64748b;
      background: #1e293b;
      border: 1px dashed #334155;
      border-radius: 12px;
    }
    footer {
      max-width: 1200px;
      margin: 2rem auto 0;
      text-align: center;
      color: #475569;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Service Level Objectives</h1>
    <div class="meta">
      <span id="last-updated">Loading...</span>
      <span style="margin-left:0.5rem;color:#64748b;">Auto-refresh every 15s</span>
    </div>
  </header>

  <div id="error-container"></div>
  <div class="section-title">SLO Status</div>
  <div id="slo-grid" class="grid"></div>

  <footer>SiskelBot SLO / Error Budget Dashboard</footer>

  <script>
    const REFRESH_INTERVAL_MS = 15000;

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = String(str == null ? "" : str);
      return div.innerHTML;
    }

    function fmtNumber(n, digits) {
      if (!Number.isFinite(n)) return "-";
      const d = digits == null ? 3 : digits;
      return Number(n).toFixed(d);
    }

    function fmtPct(n) {
      if (!Number.isFinite(n)) return "-";
      return (n * 100).toFixed(2) + "%";
    }

    function fmtMs(n) {
      if (!Number.isFinite(n)) return "-";
      return Math.round(n) + " ms";
    }

    function fmtMetricValue(slo) {
      if (slo.metric === "success_rate") return fmtPct(slo.current);
      if (slo.metric === "error_rate") return fmtPct(slo.current);
      if (slo.metric === "latency_ms") return fmtMs(slo.current);
      return fmtNumber(slo.current);
    }

    function fmtTarget(slo) {
      if (slo.metric === "success_rate") return fmtPct(slo.target);
      if (slo.metric === "error_rate") return fmtPct(slo.target);
      if (slo.metric === "latency_ms") return fmtMs(slo.target);
      return fmtNumber(slo.target);
    }

    function donut(consumedFraction, status) {
      const pct = Math.min(1, Math.max(0, consumedFraction));
      const size = 120;
      const r = 50;
      const c = 2 * Math.PI * r;
      const offset = c * (1 - pct);
      const colorBg = "#1e293b";
      const colorFg =
        status === "critical" ? "#f87171" :
        status === "warning" ? "#fbbf24" : "#34d399";
      return (
        '<svg viewBox="0 0 ' + size + ' ' + size + '">' +
          '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="' + colorBg + '" stroke-width="14"></circle>' +
          '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="' + colorFg + '" stroke-width="14"' +
            ' stroke-dasharray="' + c.toFixed(2) + '"' +
            ' stroke-dashoffset="' + offset.toFixed(2) + '"' +
            ' transform="rotate(-90 60 60)"' +
            ' stroke-linecap="round"></circle>' +
        '</svg>'
      );
    }

    function burnLineChart(series) {
      if (!Array.isArray(series) || series.length === 0) {
        return '<svg viewBox="0 0 200 60"><text x="100" y="32" text-anchor="middle" fill="#64748b" font-size="10">No data yet</text></svg>';
      }
      const w = 200, h = 60, pad = 4;
      const xs = series.length;
      const ys = series.map(function(p) { return Number(p.remainingFraction) || 0; });
      let path = "";
      let fill = "";
      for (let i = 0; i < xs; i++) {
        const x = pad + (i / Math.max(1, xs - 1)) * (w - pad * 2);
        const y = pad + (1 - ys[i]) * (h - pad * 2);
        path += (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
        fill += (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1) + " ";
      }
      fill += "L" + (w - pad).toFixed(1) + "," + (h - pad).toFixed(1) + " ";
      fill += "L" + pad.toFixed(1) + "," + (h - pad).toFixed(1) + " Z";
      return (
        '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
          '<path d="' + fill + '" fill="rgba(52,211,153,0.15)"></path>' +
          '<path d="' + path + '" fill="none" stroke="#34d399" stroke-width="1.5"></path>' +
        '</svg>'
      );
    }

    async function fetchBurnDown(name) {
      try {
        const r = await fetch("/api/v1/slo/" + encodeURIComponent(name) + "/burndown?buckets=24", { credentials: "include" });
        if (!r.ok) return null;
        return await r.json();
      } catch (_) {
        return null;
      }
    }

    function cardHtml(slo, burndown) {
      const status = slo.status || "healthy";
      const budget = slo.budget || {};
      const consumed = Number(budget.consumedFraction) || 0;
      const remaining = Number(budget.remainingFraction) || 0;
      const burnRate = Number(budget.burnRate) || 0;
      const burnChart = burnLineChart(burndown && burndown.series);

      return (
        '<div class="card ' + status + '">' +
          '<div class="card-header">' +
            '<span class="card-name">' + escapeHtml(slo.name) + '</span>' +
            '<span class="status-badge ' + status + '">' +
              '<span class="dot"></span>' + status +
            '</span>' +
          '</div>' +
          (slo.description ? '<div class="card-desc">' + escapeHtml(slo.description) + '</div>' : '') +
          '<div class="metric-row">' +
            '<span class="metric-label">Target</span>' +
            '<span class="metric-value">' + fmtTarget(slo) + ' (' + escapeHtml(slo.window) + ')</span>' +
          '</div>' +
          '<div class="metric-row">' +
            '<span class="metric-label">Current</span>' +
            '<span class="metric-value">' + fmtMetricValue(slo) + '</span>' +
          '</div>' +
          '<div class="metric-row">' +
            '<span class="metric-label">Samples</span>' +
            '<span class="metric-value">' + (slo.sampleSize != null ? slo.sampleSize : 0) + '</span>' +
          '</div>' +
          '<div class="budget-row">' +
            '<div class="pie-wrap">' + donut(consumed, status) +
              '<div class="pie-label">' +
                '<span class="big">' + (remaining * 100).toFixed(1) + '%</span>' +
                '<span class="small">budget left</span>' +
              '</div>' +
            '</div>' +
            '<div class="budget-info">' +
              '<div class="metric-row">' +
                '<span class="metric-label">Consumed</span>' +
                '<span class="metric-value">' + fmtPct(consumed) + '</span>' +
              '</div>' +
              '<div class="metric-row">' +
                '<span class="metric-label">Remaining</span>' +
                '<span class="metric-value">' + fmtPct(remaining) + '</span>' +
              '</div>' +
              '<div class="burn-indicator ' + status + '">' +
                'Burn rate: <strong>' + burnRate.toFixed(2) + 'x</strong>' +
              '</div>' +
            '</div>' +
          '</div>' +
          '<div class="burn-chart">' + burnChart + '</div>' +
        '</div>'
      );
    }

    async function fetchStatus() {
      const errorContainer = document.getElementById("error-container");
      errorContainer.innerHTML = "";
      const grid = document.getElementById("slo-grid");
      try {
        const r = await fetch("/api/v1/slo", { credentials: "include" });
        if (!r.ok) {
          errorContainer.innerHTML = '<div class="error-box">Failed to load SLOs (HTTP ' + r.status + ')</div>';
          grid.innerHTML = "";
          return;
        }
        const data = await r.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if (items.length === 0) {
          grid.innerHTML = '<div class="empty-state">No SLOs configured yet.</div>';
          return;
        }
        const burnDowns = await Promise.all(items.map(function(s) { return fetchBurnDown(s.name); }));
        grid.innerHTML = items.map(function(s, i) { return cardHtml(s, burnDowns[i]); }).join("");
      } catch (e) {
        errorContainer.innerHTML = '<div class="error-box">' + escapeHtml(e.message || String(e)) + '</div>';
      } finally {
        document.getElementById("last-updated").textContent =
          "Last checked: " + new Date().toLocaleTimeString();
      }
    }

    fetchStatus();
    setInterval(fetchStatus, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
