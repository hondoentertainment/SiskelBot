<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>SiskelBot Analytics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body { font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; background: #0f172a; color: #e2e8f0; }

    /* Header */
    .header { padding: 1rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; position: sticky; top: 0; z-index: 50; }
    .header h1 { font-size: 1.125rem; font-weight: 700; }
    .header-controls { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .header a { color: #60a5fa; text-decoration: none; font-size: 0.8125rem; }
    .header a:hover { text-decoration: underline; }

    /* Controls */
    select, .input { padding: 0.375rem 0.5rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 0.8125rem; cursor: pointer; }
    select:focus, .input:focus { outline: 2px solid #60a5fa; outline-offset: 1px; }

    .content { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }

    /* Stats cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem; }
    .card .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
    .card .value { font-size: 1.5rem; font-weight: 700; margin-top: 0.25rem; }
    .card .sub { font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem; }

    /* Sections */
    .section { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .section h3 { font-size: 0.875rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.75rem; }

    /* Chart */
    .chart-container { width: 100%; overflow-x: auto; }
    .chart-container svg { display: block; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
    th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #64748b; font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    tr:last-child td { border-bottom: none; }

    /* Bar */
    .bar-bg { height: 6px; border-radius: 3px; background: #334155; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; background: #3b82f6; }

    /* Loading */
    .loading { text-align: center; padding: 2rem; color: #64748b; font-size: 0.875rem; }

    /* Two-col grid */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } .cards { grid-template-columns: 1fr 1fr; } }

    /* Status indicator */
    .refresh-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; display: inline-block; margin-right: 0.5rem; }
    .refresh-info { font-size: 0.75rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex;align-items:center;gap:1rem;">
      <h1>Analytics Dashboard</h1>
      <a href="/">Chat</a>
      <a href="/admin.html">Admin</a>
    </div>
    <div class="header-controls">
      <span class="refresh-dot"></span>
      <span class="refresh-info" id="refreshInfo">Auto-refresh: 60s</span>
      <select id="periodSelect">
        <option value="24h">Last 24 hours</option>
        <option value="7d" selected>Last 7 days</option>
        <option value="30d">Last 30 days</option>
        <option value="90d">Last 90 days</option>
      </select>
      <select id="granularitySelect">
        <option value="hour">Hourly</option>
        <option value="day" selected>Daily</option>
        <option value="week">Weekly</option>
      </select>
      <input type="text" class="input" id="workspaceInput" placeholder="Workspace (optional)" style="width:160px;">
    </div>
  </div>

  <div class="content">
    <!-- Stats cards -->
    <div class="cards" id="statsCards">
      <div class="card"><div class="label">Total Requests</div><div class="value" id="statRequests">--</div></div>
      <div class="card"><div class="label">Total Tokens</div><div class="value" id="statTokens">--</div></div>
      <div class="card"><div class="label">Estimated Cost</div><div class="value" id="statCost">--</div></div>
      <div class="card"><div class="label">Error Rate</div><div class="value" id="statErrors">--</div></div>
    </div>

    <!-- Usage chart -->
    <div class="section">
      <h3>Usage Over Time</h3>
      <div class="chart-container" id="usageChart">
        <div class="loading">Loading chart data...</div>
      </div>
    </div>

    <div class="grid-2">
      <!-- Top models -->
      <div class="section">
        <h3>Top Models</h3>
        <div id="modelsTable"><div class="loading">Loading...</div></div>
      </div>

      <!-- Top users -->
      <div class="section">
        <h3>Top Users</h3>
        <div id="usersTable"><div class="loading">Loading...</div></div>
      </div>
    </div>

    <div class="grid-2">
      <!-- Agent performance -->
      <div class="section">
        <h3>Agent Performance</h3>
        <div id="agentStats"><div class="loading">Loading...</div></div>
      </div>

      <!-- Error breakdown -->
      <div class="section">
        <h3>Error Breakdown</h3>
        <div id="errorBreakdown"><div class="loading">Loading...</div></div>
      </div>
    </div>

    <!-- Cost breakdown -->
    <div class="section">
      <h3>Cost Breakdown by Model</h3>
      <div id="costBreakdown"><div class="loading">Loading...</div></div>
    </div>
  </div>

  <script>
    const API_BASE = "/api/v1";
    let refreshTimer = null;

    function getParams() {
      const period = document.getElementById("periodSelect").value;
      const granularity = document.getElementById("granularitySelect").value;
      const workspace = document.getElementById("workspaceInput").value.trim();
      const qs = new URLSearchParams({ period, granularity });
      if (workspace) qs.set("workspace", workspace);
      return { period, granularity, workspace, qs };
    }

    function fmt(n) {
      if (n == null) return "--";
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
      if (n >= 1_000) return (n / 1_000).toFixed(1) + "K";
      return String(n);
    }

    function fmtCost(n) {
      if (n == null) return "--";
      return "$" + Number(n).toFixed(4);
    }

    // SVG line chart renderer
    function renderLineChart(container, data, options = {}) {
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="loading">No data available for the selected period.</div>';
        return;
      }

      const width = options.width || Math.max(600, container.clientWidth || 800);
      const height = options.height || 260;
      const padding = { top: 20, right: 20, bottom: 50, left: 60 };
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;

      const yValues = data.map(d => d.y);
      const yMax = Math.max(...yValues, 1);
      const yMin = 0;

      function scaleX(i) {
        return padding.left + (i / Math.max(data.length - 1, 1)) * chartW;
      }
      function scaleY(v) {
        return padding.top + chartH - ((v - yMin) / (yMax - yMin)) * chartH;
      }

      // Build polyline points
      const points = data.map((d, i) => `${scaleX(i).toFixed(1)},${scaleY(d.y).toFixed(1)}`).join(" ");

      // Build area fill
      const areaPoints = points + ` ${scaleX(data.length - 1).toFixed(1)},${(padding.top + chartH).toFixed(1)} ${scaleX(0).toFixed(1)},${(padding.top + chartH).toFixed(1)}`;

      // Y-axis ticks (5 ticks)
      let yTicks = "";
      for (let i = 0; i <= 4; i++) {
        const val = yMin + (yMax - yMin) * (i / 4);
        const y = scaleY(val);
        yTicks += `<line x1="${padding.left}" y1="${y}" x2="${padding.left + chartW}" y2="${y}" stroke="#334155" stroke-width="1"/>`;
        yTicks += `<text x="${padding.left - 8}" y="${y + 4}" fill="#64748b" font-size="11" text-anchor="end">${fmt(Math.round(val))}</text>`;
      }

      // X-axis labels (max 8)
      let xLabels = "";
      const step = Math.max(1, Math.floor(data.length / 8));
      for (let i = 0; i < data.length; i += step) {
        const x = scaleX(i);
        const label = String(data[i].label || data[i].x || "");
        const shortLabel = label.length > 10 ? label.slice(5) : label;
        xLabels += `<text x="${x}" y="${padding.top + chartH + 20}" fill="#64748b" font-size="10" text-anchor="middle" transform="rotate(-30 ${x} ${padding.top + chartH + 20})">${shortLabel}</text>`;
      }

      // Dots on data points (if not too many)
      let dots = "";
      if (data.length <= 60) {
        data.forEach((d, i) => {
          dots += `<circle cx="${scaleX(i).toFixed(1)}" cy="${scaleY(d.y).toFixed(1)}" r="3" fill="#3b82f6" stroke="#1e293b" stroke-width="1.5"/>`;
        });
      }

      const lineColor = options.color || "#3b82f6";
      const fillColor = options.fillColor || "#3b82f620";
      const ylabel = options.ylabel || "";

      container.innerHTML = `
        <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg">
          ${yTicks}
          <polygon points="${areaPoints}" fill="${fillColor}"/>
          <polyline points="${points}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          ${dots}
          ${xLabels}
          ${ylabel ? `<text x="14" y="${padding.top + chartH / 2}" fill="#64748b" font-size="11" text-anchor="middle" transform="rotate(-90 14 ${padding.top + chartH / 2})">${ylabel}</text>` : ""}
        </svg>`;
    }

    async function fetchJson(path, qs) {
      try {
        const res = await fetch(`${API_BASE}${path}?${qs}`);
        if (!res.ok) return null;
        return await res.json();
      } catch { return null; }
    }

    async function loadAll() {
      const { qs } = getParams();

      const [trends, models, users, agents, costs, errors] = await Promise.all([
        fetchJson("/analytics/trends", qs),
        fetchJson("/analytics/models", qs),
        fetchJson("/analytics/users", qs),
        fetchJson("/analytics/agents", qs),
        fetchJson("/analytics/costs", qs),
        fetchJson("/analytics/errors", qs),
      ]);

      // Stats cards
      if (trends && trends.dataPoints) {
        const totalReqs = trends.dataPoints.reduce((s, d) => s + d.requests, 0);
        const totalTok = trends.dataPoints.reduce((s, d) => s + d.tokens, 0);
        const totalErr = trends.dataPoints.reduce((s, d) => s + d.errors, 0);
        document.getElementById("statRequests").textContent = fmt(totalReqs);
        document.getElementById("statTokens").textContent = fmt(totalTok);
        document.getElementById("statErrors").textContent = totalReqs > 0 ? (totalErr / totalReqs * 100).toFixed(1) + "%" : "0%";
      }
      if (costs) {
        document.getElementById("statCost").textContent = fmtCost(costs.estimatedCost);
      }

      // Usage chart
      const chartEl = document.getElementById("usageChart");
      if (trends && trends.dataPoints && trends.dataPoints.length > 0) {
        const chartData = trends.dataPoints.map(d => ({
          x: d.timestamp,
          y: d.requests,
          label: d.timestamp,
        }));
        renderLineChart(chartEl, chartData, { ylabel: "Requests" });
      } else {
        chartEl.innerHTML = '<div class="loading">No data available.</div>';
      }

      // Models table
      const modelsEl = document.getElementById("modelsTable");
      if (models && models.length > 0) {
        const maxTokens = Math.max(...models.map(m => m.tokens), 1);
        modelsEl.innerHTML = `<table>
          <thead><tr><th>Model</th><th>Requests</th><th>Tokens</th><th>Avg Latency</th><th></th></tr></thead>
          <tbody>${models.map(m => `<tr>
            <td>${esc(m.model)}</td>
            <td>${fmt(m.requests)}</td>
            <td>${fmt(m.tokens)}</td>
            <td>${m.avgLatency}ms</td>
            <td style="width:100px"><div class="bar-bg"><div class="bar-fill" style="width:${(m.tokens/maxTokens*100).toFixed(1)}%"></div></div></td>
          </tr>`).join("")}</tbody></table>`;
      } else {
        modelsEl.innerHTML = '<div class="loading">No model data.</div>';
      }

      // Users table
      const usersEl = document.getElementById("usersTable");
      if (users && users.length > 0) {
        const maxTok = Math.max(...users.map(u => u.tokens), 1);
        usersEl.innerHTML = `<table>
          <thead><tr><th>User</th><th>Requests</th><th>Tokens</th><th></th></tr></thead>
          <tbody>${users.slice(0, 10).map(u => `<tr>
            <td>${esc(u.userId)}</td>
            <td>${fmt(u.requests)}</td>
            <td>${fmt(u.tokens)}</td>
            <td style="width:100px"><div class="bar-bg"><div class="bar-fill" style="width:${(u.tokens/maxTok*100).toFixed(1)}%"></div></div></td>
          </tr>`).join("")}</tbody></table>`;
      } else {
        usersEl.innerHTML = '<div class="loading">No user data.</div>';
      }

      // Agent stats
      const agentEl = document.getElementById("agentStats");
      if (agents) {
        const toolEntries = Object.entries(agents.toolUsage || {}).sort((a,b) => b[1] - a[1]);
        agentEl.innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:0.75rem;">
            <div><span style="color:#64748b;font-size:0.75rem;">Total Runs</span><br><strong>${agents.totalRuns}</strong></div>
            <div><span style="color:#64748b;font-size:0.75rem;">Success Rate</span><br><strong>${agents.successRate}%</strong></div>
            <div><span style="color:#64748b;font-size:0.75rem;">Avg Iterations</span><br><strong>${agents.avgIterations}</strong></div>
            <div><span style="color:#64748b;font-size:0.75rem;">Avg Duration</span><br><strong>${agents.avgDuration}ms</strong></div>
          </div>
          ${toolEntries.length > 0 ? `<div style="font-size:0.75rem;color:#64748b;margin-bottom:0.25rem;">Tool Usage</div>
          <table><thead><tr><th>Tool</th><th>Calls</th></tr></thead>
          <tbody>${toolEntries.slice(0, 8).map(([name, count]) => `<tr><td>${esc(name)}</td><td>${count}</td></tr>`).join("")}</tbody></table>` : ""}`;
      } else {
        agentEl.innerHTML = '<div class="loading">No agent data.</div>';
      }

      // Error breakdown
      const errEl = document.getElementById("errorBreakdown");
      if (errors && errors.length > 0) {
        errEl.innerHTML = `<table>
          <thead><tr><th>Error Code</th><th>Count</th><th>Last Occurred</th></tr></thead>
          <tbody>${errors.map(e => `<tr>
            <td style="color:#f87171">${esc(e.code)}</td>
            <td>${e.count}</td>
            <td style="font-size:0.75rem;color:#94a3b8">${e.lastOccurred || "--"}</td>
          </tr>`).join("")}</tbody></table>`;
      } else {
        errEl.innerHTML = '<div class="loading" style="color:#34d399">No errors recorded.</div>';
      }

      // Cost breakdown
      const costEl = document.getElementById("costBreakdown");
      if (costs && costs.breakdown && Object.keys(costs.breakdown).length > 0) {
        const entries = Object.entries(costs.breakdown).sort((a, b) => b[1] - a[1]);
        const maxCost = Math.max(...entries.map(e => e[1]), 0.0001);
        costEl.innerHTML = `<table>
          <thead><tr><th>Model</th><th>Cost</th><th></th></tr></thead>
          <tbody>${entries.map(([model, cost]) => `<tr>
            <td>${esc(model)}</td>
            <td>${fmtCost(cost)}</td>
            <td style="width:200px"><div class="bar-bg"><div class="bar-fill" style="width:${(cost/maxCost*100).toFixed(1)}%;background:#f59e0b"></div></div></td>
          </tr>`).join("")}</tbody></table>
          <div style="margin-top:0.75rem;font-size:0.8125rem;color:#94a3b8;">Total: <strong>${fmtCost(costs.estimatedCost)}</strong> | Tokens: <strong>${fmt(costs.totalTokens)}</strong></div>`;
      } else {
        costEl.innerHTML = '<div class="loading">No cost data.</div>';
      }

      // Update refresh timestamp
      document.getElementById("refreshInfo").textContent = "Updated " + new Date().toLocaleTimeString() + " | Auto-refresh: 60s";
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s || "";
      return d.innerHTML;
    }

    // Event listeners
    document.getElementById("periodSelect").addEventListener("change", loadAll);
    document.getElementById("granularitySelect").addEventListener("change", loadAll);
    document.getElementById("workspaceInput").addEventListener("change", loadAll);

    // Auto-refresh every 60s
    function startRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(loadAll, 60_000);
    }

    // Initial load
    loadAll();
    startRefresh();
  </script>
</body>
</html>
