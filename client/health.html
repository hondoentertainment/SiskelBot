<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>SiskelBot - System Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      max-width: 960px;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .meta {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .meta .refresh-note {
      margin-left: 0.5rem;
      color: #64748b;
    }

    .overall-banner {
      max-width: 960px;
      margin: 0 auto 2rem;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
    }

    .overall-banner.healthy {
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #065f46;
    }

    .overall-banner.degraded {
      background: #78350f;
      color: #fcd34d;
      border: 1px solid #92400e;
    }

    .overall-banner.down {
      background: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #991b1b;
    }

    .overall-banner.loading {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }

    .section-title {
      max-width: 960px;
      margin: 0 auto 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .grid {
      max-width: 960px;
      margin: 0 auto 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: #475569;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-name {
      font-size: 1rem;
      font-weight: 600;
      color: #f1f5f9;
      text-transform: capitalize;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-badge.ok {
      background: #064e3b;
      color: #6ee7b7;
    }
    .status-badge.ok .dot { background: #34d399; }

    .status-badge.fail {
      background: #7f1d1d;
      color: #fca5a5;
    }
    .status-badge.fail .dot { background: #f87171; }

    .status-badge.skip {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .status-badge.skip .dot { background: #64748b; }

    .status-badge.warn {
      background: #78350f;
      color: #fcd34d;
    }
    .status-badge.warn .dot { background: #fbbf24; }

    .card-message {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    .card-detail {
      font-size: 0.8rem;
      color: #64748b;
    }

    .error-box {
      max-width: 960px;
      margin: 0 auto 2rem;
      background: #7f1d1d;
      border: 1px solid #991b1b;
      color: #fca5a5;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    footer {
      max-width: 960px;
      margin: 2rem auto 0;
      text-align: center;
      color: #475569;
      font-size: 0.8rem;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .loading-pulse {
      animation: pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <header>
    <h1>System Status</h1>
    <div class="meta">
      <span id="last-updated">Loading...</span>
      <span class="refresh-note">Auto-refresh every 15s</span>
    </div>
  </header>

  <div id="overall-banner" class="overall-banner loading loading-pulse">Checking system status...</div>

  <div id="error-container"></div>

  <div id="readiness-section" style="display:none;">
    <div class="section-title">Backend Connectivity</div>
    <div id="readiness-grid" class="grid"></div>
  </div>

  <div id="integrations-section" style="display:none;">
    <div class="section-title">Integrations</div>
    <div id="integrations-grid" class="grid"></div>
  </div>

  <footer>
    SiskelBot Status Page
  </footer>

  <script>
    const REFRESH_INTERVAL_MS = 15000;

    function createCard(name, status, message, detail) {
      const card = document.createElement("div");
      card.className = "card";

      const badgeClass = status === "ok" ? "ok" : status === "fail" ? "fail" : status === "warn" ? "warn" : "skip";
      const badgeLabel = status === "ok" ? "Operational" : status === "fail" ? "Down" : status === "warn" ? "Degraded" : "Inactive";

      card.innerHTML =
        '<div class="card-header">' +
          '<span class="card-name">' + escapeHtml(name) + '</span>' +
          '<span class="status-badge ' + badgeClass + '">' +
            '<span class="dot"></span>' +
            badgeLabel +
          '</span>' +
        '</div>' +
        (message ? '<div class="card-message">' + escapeHtml(message) + '</div>' : '') +
        (detail ? '<div class="card-detail">' + escapeHtml(detail) + '</div>' : '');

      return card;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function setOverallStatus(readyOk, integrationResults) {
      const banner = document.getElementById("overall-banner");
      banner.classList.remove("loading", "loading-pulse", "healthy", "degraded", "down");

      if (!readyOk) {
        banner.className = "overall-banner down";
        banner.textContent = "System Unavailable";
        return;
      }

      const hasFailure = integrationResults.some(function(r) { return r.status === "fail"; });
      const allOk = integrationResults.every(function(r) { return r.status === "ok" || r.status === "skip"; });

      if (hasFailure) {
        banner.className = "overall-banner degraded";
        banner.textContent = "Partial Outage -- Some integrations are unreachable";
      } else if (allOk) {
        banner.className = "overall-banner healthy";
        banner.textContent = "All Systems Operational";
      } else {
        banner.className = "overall-banner healthy";
        banner.textContent = "All Systems Operational";
      }
    }

    async function fetchStatus() {
      const errorContainer = document.getElementById("error-container");
      errorContainer.innerHTML = "";

      let readyOk = false;
      let readyData = null;
      let integrationResults = [];

      // Fetch readiness and integrations in parallel
      const [readyRes, intRes] = await Promise.allSettled([
        fetch("/health/ready"),
        fetch("/health/integrations"),
      ]);

      // Process readiness
      const readinessSection = document.getElementById("readiness-section");
      const readinessGrid = document.getElementById("readiness-grid");
      readinessGrid.innerHTML = "";

      if (readyRes.status === "fulfilled") {
        try {
          readyData = await readyRes.value.json();
          readyOk = readyData.ok === true;

          readinessSection.style.display = "";

          // Backend card
          var backendStatus = readyOk ? "ok" : "fail";
          var backendMsg = readyOk
            ? "Backend " + (readyData.backend || "unknown") + " is reachable"
            : readyData.reason || "Backend unreachable";
          readinessGrid.appendChild(createCard("Backend (" + (readyData.backend || "unknown") + ")", backendStatus, backendMsg));

          // Storage card -- readiness probe tests storage
          var storageStatus = readyData.reason === "storage_unavailable" ? "fail" : "ok";
          var storageMsg = storageStatus === "ok" ? "Storage layer is responsive" : "Storage is unavailable";
          readinessGrid.appendChild(createCard("Storage", storageStatus, storageMsg));

        } catch (e) {
          readinessSection.style.display = "";
          readinessGrid.appendChild(createCard("Readiness", "fail", "Failed to parse readiness response"));
        }
      } else {
        readinessSection.style.display = "";
        readinessGrid.appendChild(createCard("Readiness", "fail", "Unable to reach health endpoint"));
      }

      // Process integrations
      const intSection = document.getElementById("integrations-section");
      const intGrid = document.getElementById("integrations-grid");
      intGrid.innerHTML = "";

      if (intRes.status === "fulfilled") {
        try {
          var intData = await intRes.value.json();
          integrationResults = Array.isArray(intData) ? intData : (intData.checks || intData.results || []);

          if (integrationResults.length > 0) {
            intSection.style.display = "";
            integrationResults.forEach(function(check) {
              var detail = "";
              if (check.latencyMs != null) {
                detail = "Latency: " + check.latencyMs + "ms";
              }
              intGrid.appendChild(createCard(check.name, check.status, check.message, detail));
            });
          } else {
            intSection.style.display = "none";
          }
        } catch (e) {
          intSection.style.display = "";
          intGrid.appendChild(createCard("Integrations", "fail", "Failed to parse integration response"));
        }
      } else {
        intSection.style.display = "";
        intGrid.appendChild(createCard("Integrations", "fail", "Unable to reach integrations endpoint"));
      }

      setOverallStatus(readyOk, integrationResults);

      document.getElementById("last-updated").textContent =
        "Last checked: " + new Date().toLocaleTimeString();
    }

    // Initial load
    fetchStatus();

    // Auto-refresh
    setInterval(fetchStatus, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
