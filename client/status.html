<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>SiskelBot Status</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body { font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; background: #0f172a; color: #e2e8f0; }
    .header { padding: 1.25rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; text-align: center; }
    .header h1 { font-size: 1.25rem; font-weight: 700; }
    .header p { font-size: 0.875rem; color: #94a3b8; margin-top: 0.25rem; }
    .content { padding: 1.5rem; max-width: 960px; margin: 0 auto; }
    .overall { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 1.5rem; text-align: center; margin-bottom: 1.5rem; }
    .overall .pulse { width: 16px; height: 16px; border-radius: 50%; display: inline-block; margin-right: 0.75rem; vertical-align: middle; }
    .overall .label { font-size: 1.25rem; font-weight: 600; vertical-align: middle; }
    .overall.green { border-color: #059669; }
    .overall.yellow { border-color: #d97706; }
    .overall.red { border-color: #dc2626; }
    .section { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .section h3 { font-size: 0.875rem; font-weight: 600; color: #94a3b8; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .comp-row { display: flex; align-items: center; padding: 0.625rem 0; border-bottom: 1px solid #334155; }
    .comp-row:last-child { border-bottom: none; }
    .comp-row .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 0.75rem; flex-shrink: 0; }
    .comp-row .name { flex: 1; font-weight: 500; }
    .comp-row .note { font-size: 0.75rem; color: #64748b; }
    .comp-row .state { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.125rem 0.5rem; border-radius: 4px; }
    .dot.green, .state.green { background: #059669; color: #ecfdf5; }
    .dot.yellow, .state.yellow { background: #d97706; color: #fff7ed; }
    .dot.red, .state.red { background: #dc2626; color: #fef2f2; }
    .dot.unknown, .state.unknown { background: #475569; color: #f1f5f9; }
    .history { display: grid; grid-template-columns: repeat(90, 1fr); gap: 2px; margin-top: 0.5rem; }
    .history .cell { aspect-ratio: 1/3; min-height: 24px; border-radius: 2px; }
    .history .cell.green { background: #059669; }
    .history .cell.yellow { background: #d97706; }
    .history .cell.red { background: #dc2626; }
    .history-legend { display: flex; justify-content: space-between; font-size: 0.75rem; color: #64748b; margin-top: 0.5rem; }
    .incident { border-left: 3px solid #334155; padding: 0.75rem 1rem; margin-bottom: 0.75rem; background: #0f172a; border-radius: 4px; }
    .incident .title { font-weight: 600; margin-bottom: 0.375rem; }
    .incident .meta { display: flex; gap: 0.75rem; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.5rem; flex-wrap: wrap; }
    .incident.major { border-left-color: #d97706; }
    .incident.critical { border-left-color: #dc2626; }
    .incident .updates { margin-top: 0.5rem; }
    .incident .update { font-size: 0.8125rem; color: #cbd5e1; padding: 0.25rem 0; border-top: 1px dashed #334155; }
    .incident .update:first-child { border-top: none; }
    .incident .update .at { color: #64748b; font-size: 0.75rem; margin-right: 0.5rem; }
    .empty { color: #64748b; font-style: italic; text-align: center; padding: 1rem; }
    .footer { text-align: center; color: #64748b; font-size: 0.75rem; padding: 1.5rem; }
    .footer a { color: #60a5fa; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .pulse.green { background: #059669; animation: pulse 2s infinite; }
    .pulse.yellow { background: #d97706; animation: pulse 2s infinite; }
    .pulse.red { background: #dc2626; animation: pulse 1.5s infinite; }
    .pulse.unknown { background: #475569; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SiskelBot Status</h1>
    <p id="generatedAt">Loading status...</p>
  </div>
  <div class="content">
    <div id="overall" class="overall unknown">
      <span class="pulse unknown"></span>
      <span class="label">Loading...</span>
    </div>
    <div class="section">
      <h3>Components</h3>
      <div id="components"><div class="empty">Loading components...</div></div>
    </div>
    <div class="section">
      <h3>Past 90 Days</h3>
      <div id="history" class="history"></div>
      <div class="history-legend">
        <span>90 days ago</span>
        <span>Today</span>
      </div>
    </div>
    <div class="section">
      <h3>Active Incidents</h3>
      <div id="activeIncidents"><div class="empty">No active incidents</div></div>
    </div>
    <div class="section">
      <h3>Incident History</h3>
      <div id="pastIncidents"><div class="empty">No past incidents</div></div>
    </div>
  </div>
  <div class="footer">
    <p>Auto-refreshes every 30 seconds. <a href="/api/v1/status">Raw JSON</a></p>
  </div>
  <script>
    const API_BASE = "/api/v1/status";
    const REFRESH_MS = 30_000;

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === "className") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k === "html") node.innerHTML = v;
        else node.setAttribute(k, v);
      }
      for (const c of children) if (c) node.appendChild(c);
      return node;
    }

    function setText(id, text) {
      const n = document.getElementById(id);
      if (n) n.textContent = text;
    }

    function fmtState(state) {
      return (state || "unknown").toString();
    }

    function overallLabel(state) {
      if (state === "green") return "All Systems Operational";
      if (state === "yellow") return "Partial Degradation";
      if (state === "red") return "Major Outage";
      return "Status Unknown";
    }

    function renderOverall(status) {
      const wrap = document.getElementById("overall");
      const state = status?.overall || "unknown";
      wrap.className = `overall ${state}`;
      wrap.innerHTML = "";
      wrap.appendChild(el("span", { className: `pulse ${state}` }));
      wrap.appendChild(el("span", { className: "label", text: overallLabel(state) }));
    }

    function renderComponents(components) {
      const wrap = document.getElementById("components");
      wrap.innerHTML = "";
      if (!components || components.length === 0) {
        wrap.appendChild(el("div", { className: "empty", text: "No components configured" }));
        return;
      }
      for (const c of components) {
        const row = el("div", { className: "comp-row" });
        row.appendChild(el("span", { className: `dot ${c.state}` }));
        const info = el("div", { className: "name" });
        info.appendChild(el("div", { text: c.name }));
        if (c.description || c.note) {
          info.appendChild(el("div", { className: "note", text: c.note || c.description }));
        }
        row.appendChild(info);
        row.appendChild(el("span", { className: `state ${c.state}`, text: fmtState(c.state) }));
        wrap.appendChild(row);
      }
    }

    function renderHistory(history) {
      const wrap = document.getElementById("history");
      wrap.innerHTML = "";
      if (!history || history.length === 0) return;
      for (const b of history) {
        const cell = el("div", { className: `cell ${b.state}` });
        cell.setAttribute("title", `${b.date}: ${b.state} (${b.incidentCount} incidents)`);
        wrap.appendChild(cell);
      }
    }

    function renderIncident(inc) {
      const wrap = el("div", { className: `incident ${inc.impact}` });
      wrap.appendChild(el("div", { className: "title", text: inc.title }));
      const meta = el("div", { className: "meta" });
      meta.appendChild(el("span", { text: `Status: ${inc.status}` }));
      meta.appendChild(el("span", { text: `Impact: ${inc.impact}` }));
      meta.appendChild(el("span", { text: `Started: ${new Date(inc.startedAt).toLocaleString()}` }));
      if (inc.resolvedAt) {
        meta.appendChild(el("span", { text: `Resolved: ${new Date(inc.resolvedAt).toLocaleString()}` }));
      }
      wrap.appendChild(meta);
      if (inc.components && inc.components.length > 0) {
        wrap.appendChild(el("div", { className: "meta", text: `Components: ${inc.components.join(", ")}` }));
      }
      if (Array.isArray(inc.updates) && inc.updates.length > 0) {
        const updates = el("div", { className: "updates" });
        for (let i = inc.updates.length - 1; i >= 0; i -= 1) {
          const u = inc.updates[i];
          const line = el("div", { className: "update" });
          line.appendChild(el("span", { className: "at", text: new Date(u.at).toLocaleString() }));
          line.appendChild(el("span", { text: `[${u.status}] ${u.message || ""}` }));
          updates.appendChild(line);
        }
        wrap.appendChild(updates);
      }
      return wrap;
    }

    function renderIncidents(elementId, incidents, emptyMessage) {
      const wrap = document.getElementById(elementId);
      wrap.innerHTML = "";
      if (!incidents || incidents.length === 0) {
        wrap.appendChild(el("div", { className: "empty", text: emptyMessage }));
        return;
      }
      for (const inc of incidents) wrap.appendChild(renderIncident(inc));
    }

    async function load() {
      try {
        const [statusRes, incidentsRes] = await Promise.all([
          fetch(API_BASE),
          fetch(`${API_BASE}/incidents?resolved=true&sinceMs=${90 * 24 * 60 * 60 * 1000}`),
        ]);
        if (!statusRes.ok) throw new Error(`status ${statusRes.status}`);
        const status = await statusRes.json();
        renderOverall(status);
        setText("generatedAt", `Last updated ${new Date(status.generatedAt).toLocaleString()}`);
        renderComponents(status.components);
        renderHistory(status.history);
        renderIncidents("activeIncidents", status.activeIncidents, "No active incidents");
        const past = incidentsRes.ok ? (await incidentsRes.json()).incidents : [];
        renderIncidents("pastIncidents", past.slice(0, 20), "No past incidents in the last 90 days");
      } catch (err) {
        setText("generatedAt", `Error loading status: ${err.message}`);
      }
    }

    load();
    setInterval(load, REFRESH_MS);
  </script>
</body>
</html>
