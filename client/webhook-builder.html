<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Webhook Builder - SiskelBot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
    }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }

    header {
      padding: 0.75rem 1rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 { font-size: 1.125rem; font-weight: 600; }
    header a { color: #60a5fa; text-decoration: none; }
    header a:hover { text-decoration: underline; }

    main {
      padding: 1rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .section h2 {
      font-size: 0.875rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 0.75rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-group { margin-bottom: 0.75rem; }

    input[type="text"], input[type="url"], input[type="password"], select {
      width: 100%;
      padding: 0.5rem 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.875rem;
      font-family: inherit;
    }
    input:hover, select:hover { border-color: #475569; }
    input.invalid { border-color: #f87171; }
    .url-feedback {
      font-size: 0.75rem;
      margin-top: 0.25rem;
      min-height: 1.125rem;
    }
    .url-feedback.ok { color: #34d399; }
    .url-feedback.err { color: #f87171; }

    .btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      font-family: inherit;
    }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .btn-ghost { background: #334155; color: #e2e8f0; }
    .btn-ghost:hover { background: #475569; }
    .btn-danger { background: #7f1d1d; color: #fecaca; }
    .btn-danger:hover { background: #991b1b; }
    .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }

    .btn-bar { display: flex; gap: 0.5rem; margin-top: 0.75rem; }

    /* Event checkboxes */
    .event-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.375rem;
    }
    .event-checkbox {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.5rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8125rem;
    }
    .event-checkbox:hover { border-color: #475569; }
    .event-checkbox input[type="checkbox"] { accent-color: #2563eb; width: 1rem; height: 1rem; }

    /* Webhook list */
    table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
    th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #64748b; font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    tr:last-child td { border-bottom: none; }

    .badge {
      font-size: 0.6875rem;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      display: inline-block;
      margin: 0.125rem;
    }
    .badge-event { background: #1e3a5f; color: #93c5fd; }
    .badge-ok { background: #064e3b; color: #6ee7b7; }
    .badge-fail { background: #7f1d1d; color: #fca5a5; }

    .empty-state { color: #64748b; font-size: 0.875rem; text-align: center; padding: 2rem; }

    /* DLQ entries */
    .dlq-entry {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .dlq-entry-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.375rem;
    }
    .dlq-entry-url {
      font-family: monospace;
      font-size: 0.8125rem;
      color: #cbd5e1;
      word-break: break-all;
    }
    .dlq-entry-detail {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 0.25rem;
    }
    .status-dot.green { background: #34d399; }
    .status-dot.red { background: #f87171; }

    .toast {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #064e3b; color: #6ee7b7; border: 1px solid #065f46; }
    .toast.error { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
  </style>
</head>
<body>
  <header>
    <h1>Webhook Builder</h1>
    <a href="/">&larr; Chat</a>
    <a href="/admin.html">Admin</a>
    <a href="/playground.html">API Playground</a>
  </header>

  <main>
    <!-- Create / Edit webhook -->
    <div class="section" id="editor-section">
      <h2 id="editor-title">Create Webhook</h2>

      <div class="form-group">
        <label for="webhook-url">Webhook URL</label>
        <input type="url" id="webhook-url" placeholder="https://example.com/webhook">
        <div class="url-feedback" id="url-feedback"></div>
      </div>

      <div class="form-group">
        <label for="webhook-secret">Secret (optional, for HMAC signing)</label>
        <input type="password" id="webhook-secret" placeholder="Enter a shared secret">
      </div>

      <div class="form-group">
        <label>Event Types</label>
        <div class="event-grid" id="event-grid">
          <!-- populated dynamically -->
        </div>
      </div>

      <div class="btn-bar">
        <button type="button" class="btn btn-primary" id="save-btn" onclick="saveWebhook()">Create Webhook</button>
        <button type="button" class="btn btn-ghost" id="cancel-edit-btn" onclick="cancelEdit()" style="display:none">Cancel</button>
        <button type="button" class="btn btn-ghost" onclick="testWebhook()">Test Delivery</button>
      </div>
    </div>

    <!-- Registered webhooks -->
    <div class="section">
      <h2>Registered Webhooks</h2>
      <div id="webhooks-table-container">
        <div class="empty-state" id="webhooks-empty">No webhooks registered.</div>
        <table id="webhooks-table" style="display:none">
          <thead>
            <tr>
              <th>URL</th>
              <th>Events</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="webhooks-body"></tbody>
        </table>
      </div>
      <div class="btn-bar">
        <button type="button" class="btn btn-ghost btn-sm" onclick="loadWebhooks()">Refresh</button>
      </div>
    </div>

    <!-- DLQ / Delivery history -->
    <div class="section">
      <h2>Delivery History (Dead-Letter Queue)</h2>
      <div id="dlq-stats" style="font-size:0.8125rem;margin-bottom:0.75rem;color:#94a3b8;"></div>
      <div id="dlq-list">
        <div class="empty-state" id="dlq-empty">No failed deliveries.</div>
      </div>
      <div class="btn-bar">
        <button type="button" class="btn btn-ghost btn-sm" onclick="loadDLQ()">Refresh DLQ</button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const EVENT_TYPES = [
      "message_sent",
      "plan_created",
      "recipe_executed",
      "schedule_completed",
      "swarm_started",
      "swarm_specialist_completed",
      "swarm_completed",
    ];

    let editingWebhookId = null;

    function getApiHeaders() {
      const headers = { "Content-Type": "application/json" };
      const stored = localStorage.getItem("siskelbot_api_key");
      if (stored) headers["Authorization"] = "Bearer " + stored;
      return headers;
    }

    // Populate event checkboxes
    function initEventGrid() {
      const grid = document.getElementById("event-grid");
      grid.innerHTML = "";
      EVENT_TYPES.forEach(ev => {
        const lbl = document.createElement("label");
        lbl.className = "event-checkbox";
        lbl.innerHTML = `<input type="checkbox" value="${ev}"> ${ev}`;
        grid.appendChild(lbl);
      });
    }

    function getSelectedEvents() {
      const checks = document.querySelectorAll("#event-grid input[type=checkbox]:checked");
      return Array.from(checks).map(c => c.value);
    }

    function setSelectedEvents(events) {
      const checks = document.querySelectorAll("#event-grid input[type=checkbox]");
      checks.forEach(c => { c.checked = events.includes(c.value); });
    }

    // URL validation
    document.addEventListener("DOMContentLoaded", () => {
      initEventGrid();
      loadWebhooks();
      loadDLQ();

      const urlInput = document.getElementById("webhook-url");
      urlInput.addEventListener("input", () => {
        const feedback = document.getElementById("url-feedback");
        const val = urlInput.value.trim();
        urlInput.classList.remove("invalid");
        if (!val) { feedback.textContent = ""; feedback.className = "url-feedback"; return; }
        try {
          const parsed = new URL(val);
          if (parsed.protocol === "https:") {
            feedback.textContent = "Valid HTTPS URL";
            feedback.className = "url-feedback ok";
          } else if (parsed.protocol === "http:" && /^(localhost|127\.)/.test(parsed.hostname)) {
            feedback.textContent = "HTTP allowed for localhost (requires ALLOW_WEBHOOK_LOCALHOST=1)";
            feedback.className = "url-feedback ok";
          } else {
            feedback.textContent = "URL must use HTTPS";
            feedback.className = "url-feedback err";
            urlInput.classList.add("invalid");
          }
        } catch {
          feedback.textContent = "Invalid URL format";
          feedback.className = "url-feedback err";
          urlInput.classList.add("invalid");
        }
      });
    });

    // Load webhooks
    async function loadWebhooks() {
      try {
        const resp = await fetch("/api/v1/webhooks", { headers: getApiHeaders() });
        if (!resp.ok) throw new Error("Failed to load");
        const data = await resp.json();
        const items = data.items || [];
        renderWebhooks(items);
      } catch (err) {
        console.warn("Load webhooks:", err);
      }
    }

    function renderWebhooks(items) {
      const empty = document.getElementById("webhooks-empty");
      const table = document.getElementById("webhooks-table");
      const body = document.getElementById("webhooks-body");

      if (items.length === 0) {
        empty.style.display = "block";
        table.style.display = "none";
        return;
      }
      empty.style.display = "none";
      table.style.display = "table";
      body.innerHTML = "";

      items.forEach(wh => {
        const tr = document.createElement("tr");
        const evBadges = (wh.events || []).map(e => `<span class="badge badge-event">${escapeHtml(e)}</span>`).join(" ");
        tr.innerHTML = `
          <td style="font-family:monospace;font-size:0.8125rem;max-width:300px;word-break:break-all">${escapeHtml(wh.url)}</td>
          <td>${evBadges}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick="deleteWebhook('${escapeHtml(wh.id)}')">Delete</button>
          </td>
        `;
        body.appendChild(tr);
      });
    }

    // Save webhook
    async function saveWebhook() {
      const url = document.getElementById("webhook-url").value.trim();
      const secret = document.getElementById("webhook-secret").value.trim();
      const events = getSelectedEvents();

      if (!url) { toast("URL is required", "error"); return; }
      if (events.length === 0) { toast("Select at least one event", "error"); return; }

      const payload = { url, events };
      if (secret) payload.secret = secret;

      const btn = document.getElementById("save-btn");
      btn.disabled = true;

      try {
        const resp = await fetch("/api/v1/webhooks", {
          method: "POST",
          headers: getApiHeaders(),
          body: JSON.stringify(payload),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || "Failed to create");
        }
        toast("Webhook created", "success");
        clearEditor();
        loadWebhooks();
      } catch (err) {
        toast(err.message, "error");
      } finally {
        btn.disabled = false;
      }
    }

    // Delete webhook
    async function deleteWebhook(id) {
      if (!confirm("Delete this webhook?")) return;
      try {
        const resp = await fetch(`/api/v1/webhooks/${id}`, {
          method: "DELETE",
          headers: getApiHeaders(),
        });
        if (!resp.ok && resp.status !== 204) throw new Error("Failed to delete");
        toast("Webhook deleted", "success");
        loadWebhooks();
      } catch (err) {
        toast(err.message, "error");
      }
    }

    // Test delivery
    async function testWebhook() {
      const url = document.getElementById("webhook-url").value.trim();
      if (!url) { toast("Enter a URL to test", "error"); return; }

      const events = getSelectedEvents();
      const testPayload = {
        url,
        events: events.length ? events : ["message_sent"],
        secret: document.getElementById("webhook-secret").value.trim() || undefined,
      };

      toast("Sending test payload...", "success");

      try {
        // Create a temporary webhook, which triggers the system to register it
        const resp = await fetch("/api/v1/webhooks", {
          method: "POST",
          headers: getApiHeaders(),
          body: JSON.stringify(testPayload),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || "Test delivery failed");
        }
        const wh = await resp.json();
        toast("Test webhook created with ID: " + wh.id + ". It will fire on the next matching event.", "success");
        loadWebhooks();
      } catch (err) {
        toast("Test failed: " + err.message, "error");
      }
    }

    // DLQ
    async function loadDLQ() {
      try {
        const [statsResp, dlqResp] = await Promise.all([
          fetch("/api/v1/webhooks/dlq/stats", { headers: getApiHeaders() }),
          fetch("/api/v1/webhooks/dlq", { headers: getApiHeaders() }),
        ]);

        if (statsResp.ok) {
          const stats = await statsResp.json();
          document.getElementById("dlq-stats").textContent =
            `Total entries: ${stats.total || 0} | Oldest: ${stats.oldest ? new Date(stats.oldest).toLocaleString() : "N/A"}`;
        }

        if (dlqResp.ok) {
          const data = await dlqResp.json();
          renderDLQ(data.items || []);
        }
      } catch (err) {
        console.warn("Load DLQ:", err);
      }
    }

    function renderDLQ(items) {
      const list = document.getElementById("dlq-list");
      const empty = document.getElementById("dlq-empty");

      // Remove existing entries but keep the empty state
      list.querySelectorAll(".dlq-entry").forEach(el => el.remove());

      if (items.length === 0) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      items.forEach(entry => {
        const el = document.createElement("div");
        el.className = "dlq-entry";
        el.innerHTML = `
          <div class="dlq-entry-header">
            <span class="dlq-entry-url">${escapeHtml(entry.url || "unknown")}</span>
            <span>
              <button class="btn btn-ghost btn-sm" onclick="retryDLQ('${escapeHtml(entry.id)}')">Retry</button>
              <button class="btn btn-danger btn-sm" onclick="removeDLQ('${escapeHtml(entry.id)}')">Dismiss</button>
            </span>
          </div>
          <div class="dlq-entry-detail">
            Error: ${escapeHtml(entry.error || "unknown")} |
            Attempts: ${entry.attempts || "?"} |
            Time: ${entry.timestamp ? new Date(entry.timestamp).toLocaleString() : "N/A"}
          </div>
        `;
        list.appendChild(el);
      });
    }

    async function retryDLQ(id) {
      try {
        const resp = await fetch(`/api/v1/webhooks/dlq/${id}/retry`, {
          method: "POST",
          headers: getApiHeaders(),
        });
        if (!resp.ok) throw new Error("Retry failed");
        toast("Retry queued", "success");
        loadDLQ();
      } catch (err) {
        toast(err.message, "error");
      }
    }

    async function removeDLQ(id) {
      try {
        const resp = await fetch(`/api/v1/webhooks/dlq/${id}`, {
          method: "DELETE",
          headers: getApiHeaders(),
        });
        if (!resp.ok && resp.status !== 204) throw new Error("Remove failed");
        toast("Entry dismissed", "success");
        loadDLQ();
      } catch (err) {
        toast(err.message, "error");
      }
    }

    // Editor helpers
    function clearEditor() {
      document.getElementById("webhook-url").value = "";
      document.getElementById("webhook-secret").value = "";
      document.getElementById("url-feedback").textContent = "";
      document.getElementById("url-feedback").className = "url-feedback";
      setSelectedEvents([]);
      editingWebhookId = null;
      document.getElementById("editor-title").textContent = "Create Webhook";
      document.getElementById("save-btn").textContent = "Create Webhook";
      document.getElementById("cancel-edit-btn").style.display = "none";
    }

    function cancelEdit() {
      clearEditor();
    }

    // Toast notification
    function toast(message, type) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.className = "toast " + type + " show";
      clearTimeout(el._timer);
      el._timer = setTimeout(() => { el.classList.remove("show"); }, 3000);
    }

    function escapeHtml(str) {
      const el = document.createElement("span");
      el.textContent = String(str);
      return el.innerHTML;
    }
  </script>
</body>
</html>
