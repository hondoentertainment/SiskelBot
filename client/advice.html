<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Honest advice — SiskelBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #0c1210;
      --bg1: #14201c;
      --ink: #e8f0ec;
      --muted: #8aa399;
      --accent: #3dcf9a;
      --accent-dim: #1f6b4f;
      --warn: #e8b86d;
      --bubble-me: #1f3d32;
      --bubble-them: #1a2420;
      --line: rgba(232, 240, 236, 0.12);
      --radius: 1.1rem;
      --font: "DM Sans", system-ui, sans-serif;
      --display: "Fraunces", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a3a2e 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #243528 0%, transparent 50%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100dvh;
    }
    header {
      padding: 0.9rem 1rem 0.75rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1rem;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      background: rgba(12, 18, 16, 0.72);
    }
    header h1 {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 650;
      margin: 0;
      letter-spacing: -0.02em;
    }
    header p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.85rem; }
    .brand-block { min-width: 12rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; }
    input, select, button, textarea {
      font: inherit;
      border-radius: 0.65rem;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.28);
      color: var(--ink);
      padding: 0.45rem 0.65rem;
    }
    button {
      background: var(--accent-dim);
      border-color: transparent;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    button:hover { background: #25825e; }
    button:active { transform: scale(0.98); }
    button.ghost { background: transparent; border-color: var(--line); }
    button.primary { background: var(--accent); color: #062218; font-weight: 600; }
    a { color: var(--accent); }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 320px);
      gap: 0;
      min-height: 0;
    }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { max-height: 38vh; border-left: 0; border-top: 1px solid var(--line); }
    }
    #thread {
      overflow: auto;
      padding: 1rem 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: min(34rem, 92%);
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius);
      line-height: 1.45;
      animation: rise 0.28s ease both;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.me { align-self: flex-end; background: var(--bubble-me); border-bottom-right-radius: 0.35rem; }
    .msg.them { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 0.35rem; }
    .msg.sys { align-self: center; color: var(--muted); font-size: 0.8rem; background: transparent; max-width: 90%; text-align: center; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    aside {
      border-left: 1px solid var(--line);
      padding: 0.85rem;
      overflow: auto;
      background: rgba(0, 0, 0, 0.18);
    }
    aside h2 {
      font-family: var(--display);
      font-size: 1rem;
      margin: 0 0 0.5rem;
    }
    .thought {
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      padding: 0.55rem 0.65rem;
      margin: 0.4rem 0;
      font-size: 0.88rem;
      background: rgba(20, 32, 28, 0.8);
    }
    .thought .meta { color: var(--muted); font-size: 0.75rem; margin-bottom: 0.25rem; }
    .thought button { margin-top: 0.35rem; font-size: 0.75rem; padding: 0.25rem 0.45rem; }
    footer {
      border-top: 1px solid var(--line);
      padding: 0.65rem 0.85rem calc(0.65rem + env(safe-area-inset-bottom));
      background: rgba(12, 18, 16, 0.85);
      backdrop-filter: blur(8px);
    }
    .compose {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      max-width: 52rem;
      margin: 0 auto;
    }
    #msg {
      resize: none;
      min-height: 2.75rem;
      max-height: 8rem;
      field-sizing: content;
    }
    .capture-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.45rem;
      max-width: 52rem;
      margin-left: auto;
      margin-right: auto;
    }
    .capture-row input { flex: 1 1 12rem; }
    .status { color: var(--muted); font-size: 0.78rem; }
    .status.on { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div class="brand-block">
      <h1>Honest advice</h1>
      <p>Think clearer. Choose better. Won’t sugar-coat it.</p>
    </div>
    <div class="controls">
      <label class="status" id="mode-status">Mode: …</label>
      <label>Workspace <input id="ws" value="default" style="width:7rem" /></label>
      <label><input type="checkbox" id="challenge" /> Challenge me</label>
      <button type="button" id="enable" class="primary">Enable advice mode</button>
      <a class="ghost" href="/" style="padding:0.45rem 0.65rem;border:1px solid var(--line);border-radius:0.65rem;text-decoration:none;color:inherit">Main chat</a>
    </div>
  </header>
  <main>
    <div id="thread" aria-live="polite"></div>
    <aside>
      <h2>Thoughts</h2>
      <p class="status">Capture notes, ideas, reminders — they’ll resurface when useful.</p>
      <div id="thoughts"></div>
      <button type="button" id="reload-thoughts" class="ghost" style="margin-top:0.5rem;width:100%">Refresh</button>
    </aside>
  </main>
  <footer>
    <div class="capture-row">
      <select id="thought-kind" aria-label="Thought kind">
        <option value="note">Note</option>
        <option value="idea">Idea</option>
        <option value="reminder">Reminder</option>
        <option value="moment">Moment</option>
        <option value="decision">Decision</option>
      </select>
      <input id="thought-text" placeholder="Capture a thought…" />
      <button type="button" id="capture">Save thought</button>
    </div>
    <form class="compose" id="chat-form">
      <textarea id="msg" rows="1" placeholder="What’s on your mind?" autocomplete="off"></textarea>
      <button type="submit" class="primary">Send</button>
    </form>
  </footer>
  <script>
    const thread = document.getElementById("thread");
    const history = [];
    let systemPrompt = "";

    function headers() {
      const h = { "Content-Type": "application/json", Accept: "application/json" };
      const key = localStorage.getItem("siskelbot_api_key");
      if (key) h.Authorization = "Bearer " + key;
      return h;
    }
    function ws() {
      return document.getElementById("ws").value.trim() || "default";
    }
    function addMsg(role, text) {
      const d = document.createElement("div");
      d.className = "msg " + (role === "user" ? "me" : role === "assistant" ? "them" : "sys");
      d.textContent = text;
      thread.appendChild(d);
      thread.scrollTop = thread.scrollHeight;
    }
    async function refreshStatus() {
      const res = await fetch("/api/v1/advice/status?workspace=" + encodeURIComponent(ws()), {
        headers: headers(),
        credentials: "include",
      });
      const j = await res.json().catch(() => ({}));
      const el = document.getElementById("mode-status");
      if (j.enabled) {
        el.textContent = "Mode: on" + (j.challenge ? " · challenge" : "");
        el.className = "status on";
        systemPrompt = j.defaultSystemPrompt || systemPrompt;
        document.getElementById("challenge").checked = !!j.challenge;
      } else {
        el.textContent = "Mode: off — enable to persist persona";
        el.className = "status";
      }
    }
    async function loadPrompt() {
      const challenge = document.getElementById("challenge").checked;
      const res = await fetch("/api/v1/advice/prompt?challenge=" + (challenge ? "1" : "0"), {
        headers: headers(),
        credentials: "include",
      });
      const j = await res.json().catch(() => ({}));
      if (j.systemPrompt) systemPrompt = j.systemPrompt;
    }
    async function enableMode() {
      await loadPrompt();
      const res = await fetch("/api/v1/advice/enable", {
        method: "POST",
        headers: headers(),
        credentials: "include",
        body: JSON.stringify({
          workspace: ws(),
          challenge: document.getElementById("challenge").checked,
        }),
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) {
        addMsg("sys", j.error || j.message || "Could not enable advice mode");
        return;
      }
      systemPrompt = j.defaultSystemPrompt || systemPrompt;
      addMsg("sys", "Advice mode enabled. I’ll be honest with you.");
      refreshStatus();
      loadThoughts();
    }
    async function loadThoughts() {
      const res = await fetch("/api/v1/advice/resurface?workspace=" + encodeURIComponent(ws()) + "&limit=12", {
        headers: headers(),
        credentials: "include",
      });
      const j = await res.json().catch(() => ({}));
      const root = document.getElementById("thoughts");
      root.innerHTML = "";
      const items = j.thoughts || [];
      if (!items.length) {
        root.innerHTML = '<p class="status">No thoughts yet.</p>';
        return;
      }
      for (const t of items) {
        const div = document.createElement("div");
        div.className = "thought";
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = (t.metadata?.thoughtKind || "note") + (t.metadata?.resurfaceAt ? " · due" : "");
        const body = document.createElement("div");
        body.textContent = t.content || "";
        const del = document.createElement("button");
        del.type = "button";
        del.className = "ghost";
        del.textContent = "Forget";
        del.onclick = async () => {
          await fetch("/api/v1/advice/thoughts/" + encodeURIComponent(t.id) + "?workspace=" + encodeURIComponent(ws()), {
            method: "DELETE",
            headers: headers(),
            credentials: "include",
          });
          loadThoughts();
        };
        div.appendChild(meta);
        div.appendChild(body);
        div.appendChild(del);
        root.appendChild(div);
      }
    }
    async function captureThought() {
      const content = document.getElementById("thought-text").value.trim();
      if (!content) return;
      const res = await fetch("/api/v1/advice/thoughts", {
        method: "POST",
        headers: headers(),
        credentials: "include",
        body: JSON.stringify({
          workspace: ws(),
          content,
          kind: document.getElementById("thought-kind").value,
        }),
      });
      if (!res.ok) {
        const j = await res.json().catch(() => ({}));
        addMsg("sys", j.error || j.message || "Could not save thought");
        return;
      }
      document.getElementById("thought-text").value = "";
      addMsg("sys", "Thought saved.");
      loadThoughts();
    }
    async function sendChat(text) {
      if (!systemPrompt) await loadPrompt();
      addMsg("user", text);
      history.push({ role: "user", content: text });
      let thoughtHint = "";
      try {
        const tr = await fetch(
          "/api/v1/advice/resurface?workspace=" + encodeURIComponent(ws()) +
            "&limit=6&q=" + encodeURIComponent(text),
          { headers: headers(), credentials: "include" },
        );
        const tj = await tr.json().catch(() => ({}));
        const items = tj.thoughts || [];
        if (items.length) {
          thoughtHint =
            "\n\nPersonal thoughts to keep in mind:\n" +
            items
              .map((t, i) => (i + 1) + ". [" + (t.metadata?.thoughtKind || "note") + "] " + t.content)
              .join("\n");
        }
      } catch { /* optional */ }
      const messages = [
        { role: "system", content: systemPrompt + thoughtHint },
        ...history.slice(-24),
      ];
      const res = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: headers(),
        credentials: "include",
        body: JSON.stringify({
          model: "default",
          stream: false,
          messages,
          agentOptions: { workspace: ws() },
        }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        const msg = err.error?.message || err.error || err.message || ("HTTP " + res.status);
        addMsg("sys", String(msg));
        return;
      }
      const data = await res.json();
      const content =
        data.choices?.[0]?.message?.content ||
        data.content ||
        "";
      history.push({ role: "assistant", content: String(content) });
      addMsg("assistant", String(content));
    }

    document.getElementById("enable").onclick = enableMode;
    document.getElementById("capture").onclick = captureThought;
    document.getElementById("reload-thoughts").onclick = loadThoughts;
    document.getElementById("challenge").onchange = loadPrompt;
    document.getElementById("chat-form").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("msg");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      await sendChat(text);
    };
    document.getElementById("thought-text").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        captureThought();
      }
    });

    addMsg("sys", "Ask for a decision, vent a dilemma, or capture a thought. Enable advice mode to keep the persona on this workspace.");
    refreshStatus();
    loadPrompt();
    loadThoughts();
  </script>
</body>
</html>
