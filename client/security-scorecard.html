<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>SiskelBot - Security Scorecard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    header h1 { font-size: 1.5rem; font-weight: 600; color: #f8fafc; }
    .meta { font-size: 0.85rem; color: #94a3b8; }

    .toolbar {
      max-width: 1200px;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .toolbar input {
      padding: 0.5rem 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.875rem;
      min-width: 240px;
    }
    .btn {
      padding: 0.5rem 1rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .btn:hover { background: #2563eb; }
    .btn.secondary { background: #334155; }
    .btn.secondary:hover { background: #475569; }

    .section {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1.25rem;
    }
    .section h2 {
      margin-bottom: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hero {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 2rem;
      align-items: center;
    }
    @media (max-width: 640px) { .hero { grid-template-columns: 1fr; } }

    .grade-card {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }
    .grade-letter {
      font-size: 4rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.25rem;
    }
    .grade-score { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
    .grade-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.5rem; }

    .grade-A { color: #22c55e; border-color: #22c55e; }
    .grade-B { color: #84cc16; border-color: #84cc16; }
    .grade-C { color: #eab308; border-color: #eab308; }
    .grade-D { color: #f97316; border-color: #f97316; }
    .grade-F { color: #ef4444; border-color: #ef4444; }

    .counts { display: flex; gap: 1rem; flex-wrap: wrap; }
    .count-pill {
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .count-pill.pass { background: #064e3b; color: #6ee7b7; }
    .count-pill.warn { background: #78350f; color: #fcd34d; }
    .count-pill.fail { background: #7f1d1d; color: #fca5a5; }
    .count-pill.total { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.75rem;
    }
    .cat-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.9rem;
    }
    .cat-name {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 0.4rem;
    }
    .cat-score { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .cat-bar {
      margin-top: 0.5rem;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }
    .cat-bar-fill { height: 100%; border-radius: 3px; }
    .cat-meta { margin-top: 0.4rem; font-size: 0.75rem; color: #94a3b8; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td { padding: 0.65rem 0.75rem; text-align: left; border-bottom: 1px solid #334155; }
    th {
      font-weight: 600;
      color: #94a3b8;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: #0f172a;
      position: sticky;
      top: 0;
    }
    tr:hover td { background: #253348; }

    .pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .pill.pass { background: #064e3b; color: #6ee7b7; }
    .pill.warn { background: #78350f; color: #fcd34d; }
    .pill.fail { background: #7f1d1d; color: #fca5a5; }

    .muted { color: #64748b; font-size: 0.8rem; }
    .numeric { font-variant-numeric: tabular-nums; }

    .rec-item {
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-left: 3px solid #f97316;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }
    .rec-item.fail { border-left-color: #ef4444; }
    .rec-item.warn { border-left-color: #eab308; }
    .rec-title { font-weight: 600; margin-bottom: 0.25rem; }
    .rec-body { font-size: 0.85rem; color: #94a3b8; }

    .trend-chart {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 120px;
      padding: 8px 0;
    }
    .trend-bar {
      flex: 1;
      min-width: 4px;
      background: #475569;
      border-radius: 2px 2px 0 0;
      position: relative;
      transition: opacity 0.2s;
    }
    .trend-bar:hover { opacity: 0.75; }

    .error-toast {
      max-width: 1200px;
      margin: 0 auto 1rem;
      padding: 0.75rem 1rem;
      background: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #991b1b;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .empty { text-align: center; padding: 1.5rem; color: #64748b; }

    @media (max-width: 640px) {
      body { padding: 1rem; }
      header h1 { font-size: 1.15rem; }
      th, td { padding: 0.45rem 0.5rem; font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Security Scorecard</h1>
      <div class="meta">
        Automated daily audit of security posture &middot;
        <a href="/">Home</a> &middot;
        <a href="/admin.html">Admin</a> &middot;
        <a href="/health.html">Health</a>
      </div>
    </div>
    <div>
      <button class="btn secondary" id="refresh-btn">Refresh</button>
      <button class="btn" id="scan-btn">Run scan now</button>
    </div>
  </header>

  <div class="toolbar">
    <input type="password" id="api-key" placeholder="Admin API key (x-api-key)">
    <button class="btn secondary" id="save-key-btn">Save key</button>
    <span class="meta" id="key-status"></span>
  </div>

  <div id="error-toast" class="error-toast" style="display:none"></div>

  <section class="section">
    <h2>Overall score</h2>
    <div class="hero">
      <div id="grade-card" class="grade-card grade-F">
        <div class="grade-letter" id="grade-letter">-</div>
        <div class="grade-score" id="grade-score">-/100</div>
        <div class="grade-label">Security grade</div>
      </div>
      <div>
        <div id="counts" class="counts"></div>
        <div style="margin-top: 1rem; color: #94a3b8; font-size: 0.85rem;" id="last-scan">No scan yet.</div>
      </div>
    </div>
  </section>

  <section class="section">
    <h2>Category breakdown</h2>
    <div id="categories" class="categories">
      <div class="empty">Loading...</div>
    </div>
  </section>

  <section class="section">
    <h2>Historical trend (last 30 days)</h2>
    <div id="trend-chart" class="trend-chart"></div>
    <div class="muted" id="trend-summary"></div>
  </section>

  <section class="section">
    <h2>Recommendations</h2>
    <div id="recommendations"><div class="empty">Loading...</div></div>
  </section>

  <section class="section">
    <h2>All checks</h2>
    <div id="checks-container"><div class="empty">Loading...</div></div>
  </section>

  <script>
    const API_BASE = "/api/v1";
    let apiKey = localStorage.getItem("siskelbot.adminKey") || "";

    const $ = (sel) => document.querySelector(sel);
    const apiKeyInput = $("#api-key");
    const keyStatus = $("#key-status");
    const errorToast = $("#error-toast");
    apiKeyInput.value = apiKey;
    updateKeyStatus();

    function updateKeyStatus() {
      keyStatus.textContent = apiKey ? "Key set" : "No key (required for admin endpoints)";
      keyStatus.style.color = apiKey ? "#10b981" : "#f87171";
    }

    function showError(msg) {
      if (!msg) { errorToast.style.display = "none"; return; }
      errorToast.textContent = msg;
      errorToast.style.display = "block";
    }

    async function api(path, opts = {}) {
      const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
      if (apiKey) headers["x-api-key"] = apiKey;
      const res = await fetch(API_BASE + path, { ...opts, headers });
      if (!res.ok) {
        let body = null;
        try { body = await res.json(); } catch (_) {}
        const msg = body?.error || body?.message || res.statusText || `HTTP ${res.status}`;
        throw new Error(msg);
      }
      return res.json();
    }

    function escapeHtml(s) {
      if (s == null) return "";
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function fmtTime(v) {
      if (!v) return "-";
      try { return new Date(v).toLocaleString(); } catch { return v; }
    }

    function gradeColor(grade) {
      return {
        A: "#22c55e", B: "#84cc16", C: "#eab308", D: "#f97316", F: "#ef4444"
      }[grade] || "#64748b";
    }

    function renderScorecard(sc) {
      if (!sc) {
        $("#grade-letter").textContent = "-";
        $("#grade-score").textContent = "-/100";
        $("#last-scan").textContent = "No scan yet. Click 'Run scan now'.";
        $("#counts").innerHTML = "";
        $("#categories").innerHTML = '<div class="empty">No data yet.</div>';
        $("#recommendations").innerHTML = '<div class="empty">No data yet.</div>';
        $("#checks-container").innerHTML = '<div class="empty">No data yet.</div>';
        return;
      }

      const card = $("#grade-card");
      card.className = "grade-card grade-" + sc.grade;
      $("#grade-letter").textContent = sc.grade;
      $("#grade-score").textContent = sc.score + "/100";
      $("#last-scan").textContent = "Last scanned: " + fmtTime(sc.timestamp);

      const counts = sc.counts || {};
      $("#counts").innerHTML = `
        <span class="count-pill total">${sc.totalChecks} checks</span>
        <span class="count-pill pass">${counts.pass || 0} pass</span>
        <span class="count-pill warn">${counts.warn || 0} warn</span>
        <span class="count-pill fail">${counts.fail || 0} fail</span>
      `;

      const cats = Object.values(sc.byCategory || {});
      if (cats.length === 0) {
        $("#categories").innerHTML = '<div class="empty">No categories.</div>';
      } else {
        $("#categories").innerHTML = cats.map((c) => {
          const color = gradeColor(c.grade);
          return `<div class="cat-card">
            <div class="cat-name">${escapeHtml(c.category)}</div>
            <div class="cat-score" style="color:${color}">${c.score}/100 (${c.grade})</div>
            <div class="cat-bar"><div class="cat-bar-fill" style="width:${c.score}%;background:${color}"></div></div>
            <div class="cat-meta">${c.pass} pass &middot; ${c.warn} warn &middot; ${c.fail} fail</div>
          </div>`;
        }).join("");
      }

      const recs = sc.recommendations || [];
      if (recs.length === 0) {
        $("#recommendations").innerHTML = '<div class="empty">All checks passed - no recommendations.</div>';
      } else {
        $("#recommendations").innerHTML = recs.map((r) => `
          <div class="rec-item ${r.status}">
            <div class="rec-title">${escapeHtml(r.description || r.id)} <span class="pill ${r.status}">${r.status.toUpperCase()}</span></div>
            <div class="rec-body">${escapeHtml(r.remediation)} <span class="muted">(weight ${r.weight})</span></div>
          </div>
        `).join("");
      }

      const checks = sc.checks || [];
      const rows = checks.map((c) => `
        <tr>
          <td><strong>${escapeHtml(c.id)}</strong><div class="muted">${escapeHtml(c.description || "")}</div></td>
          <td>${escapeHtml(c.category)}</td>
          <td class="numeric">${c.weight}</td>
          <td><span class="pill ${c.status}">${c.status.toUpperCase()}</span></td>
          <td class="muted">${escapeHtml(c.remediation || "-")}</td>
        </tr>
      `).join("");
      $("#checks-container").innerHTML = `
        <table>
          <thead><tr><th>Check</th><th>Category</th><th>Weight</th><th>Status</th><th>Remediation</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function renderTrend(history) {
      const chart = $("#trend-chart");
      const summary = $("#trend-summary");
      if (!history || history.length === 0) {
        chart.innerHTML = '<div class="muted">No historical data yet.</div>';
        summary.textContent = "";
        return;
      }
      const sorted = history.slice().reverse(); // oldest -> newest
      chart.innerHTML = sorted.map((s) => {
        const h = Math.max(4, s.score);
        const color = gradeColor(s.grade);
        const title = `${fmtTime(s.timestamp)}\nScore ${s.score}/100 (${s.grade})`;
        return `<div class="trend-bar" style="height:${h}%;background:${color}" title="${escapeHtml(title)}"></div>`;
      }).join("");
      const first = sorted[0];
      const last = sorted[sorted.length - 1];
      const delta = last.score - first.score;
      const sign = delta >= 0 ? "+" : "";
      summary.textContent = `${history.length} scans &middot; oldest ${first.score} (${first.grade}) &middot; latest ${last.score} (${last.grade}) &middot; delta ${sign}${delta}`;
    }

    async function loadAll() {
      try {
        showError(null);
        const [latest, history] = await Promise.all([
          api("/security/scorecard"),
          api("/security/scorecard/history?days=30"),
        ]);
        renderScorecard(latest.scorecard);
        renderTrend(history.history || []);
      } catch (e) {
        showError("Failed to load scorecard: " + e.message);
      }
    }

    $("#save-key-btn").addEventListener("click", () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem("siskelbot.adminKey", apiKey);
      updateKeyStatus();
      loadAll();
    });

    $("#refresh-btn").addEventListener("click", loadAll);

    $("#scan-btn").addEventListener("click", async () => {
      try {
        showError(null);
        $("#scan-btn").disabled = true;
        $("#scan-btn").textContent = "Scanning...";
        await api("/security/scorecard/scan", { method: "POST" });
        await loadAll();
      } catch (e) {
        showError("Scan failed: " + e.message);
      } finally {
        $("#scan-btn").disabled = false;
        $("#scan-btn").textContent = "Run scan now";
      }
    });

    loadAll();
    setInterval(loadAll, 60_000);
  </script>
</body>
</html>
