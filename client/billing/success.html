<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Subscription updated — Siskel Bot</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.5;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      max-width: 420px;
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.35rem; }
    p { margin: 0 0 1.25rem; color: #94a3b8; font-size: 0.95rem; }
    a {
      display: inline-block;
      margin: 0.25rem;
      padding: 0.65rem 1.1rem;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    a.secondary { background: #475569; }
    a:hover { filter: brightness(1.06); }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're all set</h1>
    <p>Your subscription change was processed. It may take a minute for quotas and billing state to refresh.</p>
    <p>
      <a href="/app.html">Open app</a>
      <a class="secondary" href="/pricing.html">View plans</a>
    </p>
  </div>
</body>
</html>
