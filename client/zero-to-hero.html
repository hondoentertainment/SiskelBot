<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Zero to Hero — SiskelBot</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.5;
    }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }
    header {
      padding: 1rem 1.5rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }
    header .subtitle { color: #94a3b8; font-size: 0.85rem; }
    header a { color: #60a5fa; text-decoration: none; margin-left: 1rem; }
    main {
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
    }
    .panel h2 {
      margin: 0 0 0.75rem 0;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }
    .progress-bar {
      height: 10px;
      background: #0f172a;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 0.5rem;
      border: 1px solid #334155;
    }
    .progress-bar > div {
      height: 100%;
      background: linear-gradient(90deg, #60a5fa, #34d399);
      width: 0%;
      transition: width 0.4s ease;
    }
    .progress-text { font-size: 0.85rem; color: #94a3b8; }
    .lesson-list { list-style: none; padding: 0; margin: 0; }
    .lesson-list li {
      padding: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      margin-bottom: 0.5rem;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .lesson-list li:hover { background: #0f172a; border-color: #475569; }
    .lesson-list li.active { background: #1e3a5f; border-color: #60a5fa; }
    .lesson-list li.completed .indicator { background: #34d399; }
    .lesson-list li.locked { opacity: 0.4; cursor: not-allowed; }
    .lesson-list .indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #475569;
      flex-shrink: 0;
    }
    .lesson-title { font-size: 0.9rem; font-weight: 500; }
    .lesson-order { color: #94a3b8; font-size: 0.75rem; }
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 0.5rem;
    }
    .badge {
      padding: 0.5rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .badge.earned { border-color: #34d399; color: #e2e8f0; background: #064e3b; }
    .lesson-view h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      color: #f8fafc;
      text-transform: none;
      letter-spacing: 0;
    }
    .lesson-view .meta {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .lesson-view .meta a { color: #60a5fa; text-decoration: none; }
    .topic-chip {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background: #334155;
      border-radius: 999px;
      font-size: 0.75rem;
      margin: 0.15rem 0.15rem 0.15rem 0;
      color: #cbd5e1;
    }
    .exercise {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
    }
    .exercise h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1rem;
      color: #60a5fa;
    }
    .code-editor {
      width: 100%;
      min-height: 200px;
      background: #020617;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 0.75rem;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      resize: vertical;
      tab-size: 2;
    }
    .code-editor:focus { border-color: #60a5fa; outline: none; }
    button {
      background: #60a5fa;
      color: #0f172a;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 0.75rem;
    }
    button:hover { background: #93c5fd; }
    button.secondary { background: #334155; color: #e2e8f0; margin-left: 0.5rem; }
    button.secondary:hover { background: #475569; }
    .result {
      margin-top: 0.75rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .result.pass { background: #064e3b; color: #d1fae5; border: 1px solid #34d399; }
    .result.fail { background: #7f1d1d; color: #fecaca; border: 1px solid #f87171; }
    .leaderboard-row {
      display: flex;
      justify-content: space-between;
      padding: 0.35rem 0;
      border-bottom: 1px solid #334155;
      font-size: 0.85rem;
    }
    .leaderboard-row:last-child { border-bottom: none; }
    .rank { color: #94a3b8; font-weight: 700; }
    .empty { color: #64748b; font-size: 0.85rem; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Zero to Hero</h1>
      <div class="subtitle">Neural Networks curriculum by Andrej Karpathy</div>
    </div>
    <nav>
      <a href="/">Chat</a>
      <a href="/admin.html">Admin</a>
    </nav>
  </header>
  <main>
    <aside>
      <section class="panel">
        <h2>Your Progress</h2>
        <div class="progress-bar"><div id="progressFill"></div></div>
        <div class="progress-text" id="progressText">Loading...</div>
      </section>
      <section class="panel">
        <h2>Lessons</h2>
        <ul class="lesson-list" id="lessonList"></ul>
      </section>
      <section class="panel">
        <h2>Badges</h2>
        <div class="badge-grid" id="badgeGrid"></div>
      </section>
      <section class="panel">
        <h2>Leaderboard</h2>
        <div id="leaderboard"><span class="empty">Loading...</span></div>
      </section>
    </aside>
    <section>
      <div class="panel lesson-view" id="lessonView">
        <h2>Select a lesson</h2>
        <p class="meta">Choose a lesson from the sidebar to begin.</p>
      </div>
    </section>
  </main>

  <script type="module">
    const apiBase = "/api/v1";
    let curriculum = null;
    let progress = null;
    let currentLessonId = null;

    async function api(path, options) {
      const res = await fetch(apiBase + path, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res.json();
    }

    function prereqsMet(lesson) {
      if (!lesson.prerequisites || lesson.prerequisites.length === 0) return true;
      return lesson.prerequisites.every((p) => progress.completedLessons.includes(p));
    }

    function renderSidebar() {
      const list = document.getElementById("lessonList");
      list.innerHTML = "";
      for (const lesson of curriculum.lessons) {
        const li = document.createElement("li");
        const completed = progress.completedLessons.includes(lesson.id);
        const unlocked = prereqsMet(lesson);
        li.className = [
          completed ? "completed" : "",
          currentLessonId === lesson.id ? "active" : "",
          !unlocked && !completed ? "locked" : "",
        ].filter(Boolean).join(" ");
        li.innerHTML = `
          <span class="indicator"></span>
          <span>
            <div class="lesson-order">Lesson ${lesson.order}</div>
            <div class="lesson-title">${escapeHtml(lesson.title)}</div>
          </span>
        `;
        if (unlocked || completed) {
          li.addEventListener("click", () => selectLesson(lesson.id));
        }
        list.appendChild(li);
      }
    }

    function renderProgress() {
      const pct = progress.percentComplete || 0;
      document.getElementById("progressFill").style.width = pct + "%";
      document.getElementById("progressText").textContent =
        `${progress.completedCount || 0} / ${progress.totalLessons || curriculum.lessons.length} lessons complete (${pct}%)`;
    }

    async function renderBadges() {
      const data = await api("/learn/badges");
      const grid = document.getElementById("badgeGrid");
      grid.innerHTML = "";
      const earnedIds = new Set((data.badges || []).map((b) => b.id));
      for (const badge of data.available || []) {
        const div = document.createElement("div");
        div.className = "badge" + (earnedIds.has(badge.id) ? " earned" : "");
        div.title = badge.criteria;
        div.textContent = badge.name;
        grid.appendChild(div);
      }
    }

    async function renderLeaderboard() {
      try {
        const data = await api("/learn/leaderboard");
        const el = document.getElementById("leaderboard");
        if (!data.entries || data.entries.length === 0) {
          el.innerHTML = '<span class="empty">No participants yet.</span>';
          return;
        }
        el.innerHTML = "";
        for (const entry of data.entries.slice(0, 10)) {
          const row = document.createElement("div");
          row.className = "leaderboard-row";
          row.innerHTML = `
            <span><span class="rank">#${entry.rank}</span> ${escapeHtml(entry.userId)}</span>
            <span>${entry.completedLessons} lessons</span>
          `;
          el.appendChild(row);
        }
      } catch (e) {
        // ignore
      }
    }

    async function selectLesson(lessonId) {
      currentLessonId = lessonId;
      renderSidebar();
      const { lesson } = await api("/learn/lessons/" + encodeURIComponent(lessonId));
      const view = document.getElementById("lessonView");
      const topics = (lesson.topics || []).map((t) => `<span class="topic-chip">${escapeHtml(t)}</span>`).join(" ");
      const completed = progress.completedLessons.includes(lessonId);
      view.innerHTML = `
        <h2>${escapeHtml(lesson.title)}</h2>
        <div class="meta">
          Lesson ${lesson.order} &middot; ~${lesson.estimatedHours}h
          ${lesson.karpathyVideo ? ` &middot; <a href="${escapeHtml(lesson.karpathyVideo)}" target="_blank" rel="noopener">Watch on YouTube</a>` : ""}
        </div>
        <p>${escapeHtml(lesson.description)}</p>
        <div>${topics}</div>
        <div id="exercises"></div>
        <button id="completeBtn" ${completed ? "disabled" : ""}>${completed ? "Completed" : "Mark lesson complete"}</button>
      `;

      const exContainer = document.getElementById("exercises");
      for (const ex of lesson.exercises || []) {
        if (!ex.description) continue;
        const div = document.createElement("div");
        div.className = "exercise";
        div.innerHTML = `
          <h3>${escapeHtml(ex.id)} <span style="font-size:0.75rem;color:#94a3b8">(${escapeHtml(ex.difficulty || "")})</span></h3>
          <p>${escapeHtml(ex.description)}</p>
          <textarea class="code-editor" spellcheck="false"></textarea>
          <button class="run-btn">Run</button>
          <button class="secondary reset-btn">Reset</button>
          <div class="result" style="display:none"></div>
        `;
        const editor = div.querySelector(".code-editor");
        editor.value = ex.starterCode || "";
        div.querySelector(".run-btn").addEventListener("click", async () => {
          const result = div.querySelector(".result");
          result.style.display = "block";
          result.className = "result";
          result.textContent = "Running...";
          try {
            const r = await api("/learn/exercises/" + encodeURIComponent(ex.id) + "/submit", {
              method: "POST",
              body: JSON.stringify({ solution: editor.value }),
            });
            result.className = "result " + (r.passed ? "pass" : "fail");
            result.textContent =
              (r.passed ? "PASS" : "FAIL") +
              `\n${r.feedback || ""}\nScore: ${r.score}/100` +
              (r.errors && r.errors.length ? "\n\nErrors:\n" + r.errors.join("\n") : "");
          } catch (e) {
            result.className = "result fail";
            result.textContent = "Error: " + e.message;
          }
        });
        div.querySelector(".reset-btn").addEventListener("click", () => {
          editor.value = ex.starterCode || "";
        });
        exContainer.appendChild(div);
      }

      document.getElementById("completeBtn").addEventListener("click", async () => {
        if (completed) return;
        try {
          await api("/learn/lessons/" + encodeURIComponent(lessonId) + "/complete", {
            method: "POST",
            body: JSON.stringify({}),
          });
          await reload();
          selectLesson(lessonId);
        } catch (e) {
          alert("Could not complete lesson: " + e.message);
        }
      });
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    async function reload() {
      const [curriculumData, progressData] = await Promise.all([
        api("/learn/curriculum"),
        api("/learn/progress"),
      ]);
      curriculum = curriculumData.curriculum;
      progress = progressData;
      renderSidebar();
      renderProgress();
      await renderBadges();
      await renderLeaderboard();
    }

    reload().catch((e) => {
      document.getElementById("lessonView").innerHTML =
        '<h2>Error</h2><p class="meta">Could not load curriculum: ' + escapeHtml(e.message) + "</p>";
    });
  </script>
</body>
</html>
