<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>SiskelBot - Live Trace</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body { font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; background: #0f172a; color: #e2e8f0; }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }

    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 0.75rem 1.5rem; }
    header h1 { font-size: 1rem; font-weight: 700; }
    header .subtitle { font-size: 0.75rem; color: #64748b; margin-top: 0.125rem; }

    .topbar { padding: 0.75rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; position: sticky; top: 0; z-index: 50; }

    .input { padding: 0.375rem 0.5rem; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 0.8125rem; }
    .input:focus { border-color: #60a5fa; }

    .btn { padding: 0.375rem 0.75rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8125rem; font-weight: 500; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-ghost { background: #334155; color: #e2e8f0; }
    .btn-ghost:hover:not(:disabled) { background: #475569; }
    .btn-danger { background: #7f1d1d; color: #fecaca; }
    .btn-danger:hover:not(:disabled) { background: #991b1b; }

    .spacer { flex: 1; }
    label { font-size: 0.8125rem; color: #94a3b8; }

    .statusbar { padding: 0.5rem 1.5rem; background: #0b1220; border-bottom: 1px solid #334155; font-size: 0.8125rem; display: flex; gap: 1.25rem; align-items: center; }
    .statusbar .dot { width: 0.625rem; height: 0.625rem; border-radius: 50%; display: inline-block; margin-right: 0.375rem; vertical-align: middle; }
    .dot-off { background: #64748b; }
    .dot-connecting { background: #fbbf24; animation: pulse 1s infinite; }
    .dot-live { background: #34d399; }
    .dot-error { background: #f87171; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .counter { color: #94a3b8; }
    .counter strong { color: #e2e8f0; }

    .banner { margin: 0.75rem 1.5rem 0; padding: 0.625rem 0.875rem; border-radius: 8px; font-size: 0.8125rem; }
    .banner-error { background: #7f1d1d; color: #fecaca; border: 1px solid #f87171; }
    .banner-info { background: #1e3a5f; color: #bfdbfe; border: 1px solid #3b82f6; }

    .log { padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .event { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 0.625rem 0.875rem; }
    .event-header { display: flex; align-items: center; gap: 0.625rem; flex-wrap: wrap; font-size: 0.8125rem; }
    .event-type { font-weight: 600; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
    .event-ts { color: #64748b; font-size: 0.75rem; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
    pre.payload { background: #0b1220; border: 1px solid #334155; border-radius: 6px; padding: 0.5rem 0.625rem; font-size: 0.7rem; color: #cbd5e1; overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin-top: 0.5rem; }

    .ev-tool-call { border-color: #3b82f6; }
    .ev-tool-call .event-type { color: #93c5fd; }
    .ev-tool-result-ok { border-color: #10b981; }
    .ev-tool-result-ok .event-type { color: #6ee7b7; }
    .ev-tool-result-fail { border-color: #ef4444; }
    .ev-tool-result-fail .event-type { color: #fca5a5; }
    .ev-status { border-color: #a855f7; }
    .ev-status .event-type { color: #d8b4fe; }
    .ev-done { border-color: #10b981; }
    .ev-done .event-type { color: #6ee7b7; font-weight: 800; }
    .ev-error { border-color: #ef4444; }
    .ev-error .event-type { color: #fca5a5; font-weight: 800; }
    .ev-hello { border-color: #0ea5e9; }
    .ev-hello .event-type { color: #7dd3fc; }
    .ev-gray { border-color: #334155; }
    .ev-gray .event-type { color: #94a3b8; }

    .empty { color: #64748b; font-size: 0.875rem; padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>SiskelBot - Live Trace</h1>
    <div class="subtitle">Watch an active agent run in real time. <a href="/trace-viewer.html">Historical trace viewer</a> · <a href="/admin">Back to admin</a></div>
  </header>

  <div class="topbar">
    <label>Admin key
      <input type="password" class="input" id="admin-key" placeholder="ADMIN_API_KEY" autocomplete="off" style="width:200px">
    </label>
    <label>Session ID
      <input type="text" class="input" id="session-id" placeholder="session-abc-123" style="width:260px">
    </label>
    <button class="btn btn-primary" id="connect-btn">Connect</button>
    <button class="btn btn-ghost" id="disconnect-btn" disabled>Disconnect</button>
    <div class="spacer"></div>
    <button class="btn btn-ghost" id="clear-btn">Clear log</button>
    <button class="btn btn-ghost" id="copy-btn">Copy all as JSON</button>
  </div>

  <div class="statusbar">
    <span id="status-ind"><span class="dot dot-off"></span>Disconnected</span>
    <span class="counter"><strong id="ev-count">0</strong> events received</span>
    <span class="counter"><strong id="sec-count">0</strong> seconds connected</span>
  </div>

  <div id="banner"></div>

  <div class="log" id="log">
    <div class="empty">Enter admin key and session ID, then click Connect.</div>
  </div>

  <!--
    Security note: EventSource can't attach custom headers, so the admin
    key is passed via `?key=...`. This can leak the key into access logs
    and server referer headers. For programmatic consumers, prefer curl
    with `x-admin-api-key`. The key is never written to console here.
  -->

  <script>
    (function () {
      'use strict';

      const KEY_STORAGE = 'siskelbot_live_trace_key';
      const SID_STORAGE = 'siskelbot_live_trace_sid';

      const state = {
        /** @type {EventSource|null} */
        es: null,
        events: [],
        connectedAt: 0,
        secTimer: null,
        reconnectAttempt: 0,
        manualDisconnect: false,
      };

      function escapeHtml(input) {
        const s = input == null ? '' : String(input);
        return s
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Recursive escaper: stringify and walk the resulting JSON so we never
      // inject unescaped user content into the DOM via innerHTML.
      function safeStringify(value) {
        try {
          return JSON.stringify(value, null, 2);
        } catch (_) {
          return '[unserializable]';
        }
      }

      function setBanner(msg, kind) {
        const el = document.getElementById('banner');
        if (!msg) { el.innerHTML = ''; return; }
        const cls = kind === 'info' ? 'banner-info' : 'banner-error';
        const div = document.createElement('div');
        div.className = 'banner ' + cls;
        div.textContent = msg;
        el.innerHTML = '';
        el.appendChild(div);
      }

      function adminKey() { return document.getElementById('admin-key').value.trim(); }
      function sessionId() { return document.getElementById('session-id').value.trim(); }

      function persistInputs() {
        const k = adminKey();
        const s = sessionId();
        if (k) sessionStorage.setItem(KEY_STORAGE, k);
        if (s) sessionStorage.setItem(SID_STORAGE, s);
      }

      function restoreInputs() {
        const k = sessionStorage.getItem(KEY_STORAGE);
        const s = sessionStorage.getItem(SID_STORAGE);
        if (k) document.getElementById('admin-key').value = k;
        if (s) document.getElementById('session-id').value = s;
      }

      function setStatus(kind, text) {
        const el = document.getElementById('status-ind');
        const map = { off: 'dot-off', connecting: 'dot-connecting', live: 'dot-live', error: 'dot-error' };
        const cls = map[kind] || 'dot-off';
        el.innerHTML = '';
        const dot = document.createElement('span');
        dot.className = 'dot ' + cls;
        el.appendChild(dot);
        el.appendChild(document.createTextNode(text));
      }

      function updateCounters() {
        document.getElementById('ev-count').textContent = String(state.events.length);
        const secs = state.connectedAt ? Math.floor((Date.now() - state.connectedAt) / 1000) : 0;
        document.getElementById('sec-count').textContent = String(secs);
      }

      function classForEvent(type, payload) {
        if (type === 'tool.call') return 'ev-tool-call';
        if (type === 'tool.result') {
          const ok = payload && payload.payload && payload.payload.ok;
          const okTop = payload && payload.ok;
          if (ok === false || okTop === false) return 'ev-tool-result-fail';
          return 'ev-tool-result-ok';
        }
        if (type === 'status.change') return 'ev-status';
        if (type === 'done') return 'ev-done';
        if (type === 'error') return 'ev-error';
        if (type === 'hello') return 'ev-hello';
        return 'ev-gray';
      }

      function renderEvent(ev) {
        const log = document.getElementById('log');
        // drop "empty" placeholder
        const empty = log.querySelector('.empty');
        if (empty) empty.remove();

        const div = document.createElement('div');
        div.className = 'event ' + classForEvent(ev.type, ev.data);

        const header = document.createElement('div');
        header.className = 'event-header';

        const typeSpan = document.createElement('span');
        typeSpan.className = 'event-type';
        typeSpan.textContent = ev.type;

        const tsSpan = document.createElement('span');
        tsSpan.className = 'event-ts';
        tsSpan.textContent = new Date(ev.receivedAt).toLocaleTimeString();

        header.appendChild(typeSpan);
        header.appendChild(tsSpan);

        const pre = document.createElement('pre');
        pre.className = 'payload';
        pre.textContent = safeStringify(ev.data);

        div.appendChild(header);
        div.appendChild(pre);

        // newest on top
        if (log.firstChild) log.insertBefore(div, log.firstChild);
        else log.appendChild(div);
      }

      function pushEvent(type, data) {
        const ev = { type: type, data: data, receivedAt: Date.now() };
        state.events.push(ev);
        renderEvent(ev);
        updateCounters();
      }

      function disconnect(manual) {
        if (manual) state.manualDisconnect = true;
        if (state.es) {
          try { state.es.close(); } catch (_) { /* ignore */ }
          state.es = null;
        }
        if (state.secTimer) { clearInterval(state.secTimer); state.secTimer = null; }
        document.getElementById('connect-btn').disabled = false;
        document.getElementById('disconnect-btn').disabled = true;
        setStatus('off', manual ? 'Disconnected' : 'Disconnected — connection closed');
      }

      function connect() {
        const key = adminKey();
        const sid = sessionId();
        if (!key) { setBanner('Admin key is required', 'error'); return; }
        if (!sid) { setBanner('Session ID is required', 'error'); return; }
        setBanner('', 'info');
        persistInputs();
        state.manualDisconnect = false;

        // Pass the admin key via ?key=... because EventSource cannot send
        // custom headers. See the HTML comment above for the trade-off.
        const url = '/api/admin/traces/' + encodeURIComponent(sid) + '/stream?key=' + encodeURIComponent(key);
        setStatus('connecting', 'Connecting...');
        document.getElementById('connect-btn').disabled = true;
        document.getElementById('disconnect-btn').disabled = false;

        let es;
        try {
          es = new EventSource(url);
        } catch (err) {
          setBanner('Failed to open SSE connection', 'error');
          setStatus('error', 'Error');
          document.getElementById('connect-btn').disabled = false;
          document.getElementById('disconnect-btn').disabled = true;
          return;
        }
        state.es = es;

        es.addEventListener('open', function () {
          state.connectedAt = Date.now();
          state.reconnectAttempt = 0;
          setStatus('live', 'Live');
          if (state.secTimer) clearInterval(state.secTimer);
          state.secTimer = setInterval(updateCounters, 1000);
        });

        // Named events from the server (hello, tool.call, tool.result, ...).
        const knownTypes = [
          'hello', 'waiting', 'tool.call', 'tool.result', 'tool.retry',
          'status.change', 'plan.update', 'artifact.new', 'cost.update',
          'hitl.request', 'hitl.resolved', 'subagent.spawned', 'subagent.done',
          'error', 'done',
        ];
        knownTypes.forEach(function (type) {
          es.addEventListener(type, function (e) {
            let parsed;
            try { parsed = e.data ? JSON.parse(e.data) : {}; } catch (_) { parsed = { raw: e.data }; }
            pushEvent(type, parsed);
            if (type === 'done') {
              // server will close; mark manual so we don't reconnect
              state.manualDisconnect = true;
            }
          });
        });

        // Fallback: raw `message` events (no `event:` field).
        es.addEventListener('message', function (e) {
          let parsed;
          try { parsed = e.data ? JSON.parse(e.data) : {}; } catch (_) { parsed = { raw: e.data }; }
          pushEvent('message', parsed);
        });

        es.addEventListener('error', function () {
          // EventSource fires 'error' both for transient disconnects
          // (readyState === CONNECTING during auto-reconnect) and for
          // terminal failures. Handle the terminal case with a manual
          // reconnect hint so the user knows what happened.
          if (es.readyState === 2 /* CLOSED */) {
            if (!state.manualDisconnect) {
              setStatus('error', 'Connection lost — reconnecting in 2s');
              setTimeout(function () {
                if (state.manualDisconnect) return;
                state.reconnectAttempt += 1;
                setBanner('Reconnect attempt ' + state.reconnectAttempt + '. If this keeps failing, check the admin key and session ID.', 'info');
                connect();
              }, 2000);
            }
            disconnect(false);
          } else {
            setStatus('connecting', 'Reconnecting...');
          }
        });
      }

      function clearLog() {
        state.events = [];
        const log = document.getElementById('log');
        log.innerHTML = '';
        const d = document.createElement('div');
        d.className = 'empty';
        d.textContent = 'Log cleared.';
        log.appendChild(d);
        updateCounters();
      }

      async function copyAll() {
        const text = safeStringify(state.events);
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            setBanner('Copied ' + state.events.length + ' events to clipboard.', 'info');
          } else {
            // Fallback: create a temporary textarea.
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            setBanner('Copied ' + state.events.length + ' events to clipboard.', 'info');
          }
        } catch (_) {
          setBanner('Copy failed. Your browser may not allow clipboard writes.', 'error');
        }
      }

      document.getElementById('connect-btn').addEventListener('click', connect);
      document.getElementById('disconnect-btn').addEventListener('click', function () { disconnect(true); });
      document.getElementById('clear-btn').addEventListener('click', clearLog);
      document.getElementById('copy-btn').addEventListener('click', copyAll);

      restoreInputs();
      updateCounters();
    })();
  </script>
</body>
</html>
