<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SiskelBot WebXR</title>
  <style>
    :root {
      --bg: #07090f;
      --bg-elev: #121623;
      --bg-elev2: #1a2031;
      --fg: #e6e8ee;
      --fg-dim: #8a93a6;
      --accent: #5b9dff;
      --accent-2: #8b6dff;
      --good: #57d68d;
      --bad: #ff6b6b;
      --border: #232a3a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 920px;
      margin: 0 auto;
      padding: 24px;
      gap: 20px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      color: var(--fg-dim);
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--fg-dim);
    }
    .dot.on { background: var(--good); box-shadow: 0 0 6px var(--good); }
    .dot.off { background: var(--bad); }
    main {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }
    .support-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .support-card {
      background: var(--bg-elev2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .support-card h3 {
      margin: 0 0 6px 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
    }
    .support-card .state {
      font-size: 12px;
      color: var(--fg-dim);
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    button.xr-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--accent), #3a7ce0);
      color: white;
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 120ms ease, transform 120ms ease;
    }
    button.xr-btn:hover:not(:disabled) { filter: brightness(1.1); }
    button.xr-btn:active:not(:disabled) { transform: translateY(1px); }
    button.xr-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      background: var(--bg-elev2);
      color: var(--fg-dim);
    }
    button.xr-btn.secondary {
      background: var(--bg-elev2);
      color: var(--fg);
    }
    .log {
      background: #05070d;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--fg-dim);
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    footer {
      color: var(--fg-dim);
      font-size: 12px;
      text-align: center;
    }
    .chat-input {
      display: flex;
      gap: 8px;
    }
    .chat-input input {
      flex: 1;
      padding: 10px 12px;
      background: var(--bg-elev2);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }
    .chat-input input:focus { outline: 1px solid var(--accent); }
    .fallback {
      background: #2a1a1a;
      border: 1px solid #5a2a2a;
      color: #ff9999;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 13px;
    }
    canvas#xr-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 10;
    }
    canvas#xr-canvas.active { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>SiskelBot WebXR</h1>
      <span class="badge" id="statusBadge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">probing...</span>
      </span>
    </header>

    <main>
      <section>
        <h2 style="margin:0 0 8px 0;font-size:15px;font-weight:600;">Session support</h2>
        <div class="support-grid">
          <div class="support-card">
            <h3>Immersive VR</h3>
            <div class="state" id="stateVr">checking</div>
          </div>
          <div class="support-card">
            <h3>Immersive AR</h3>
            <div class="state" id="stateAr">checking</div>
          </div>
          <div class="support-card">
            <h3>Inline 3D</h3>
            <div class="state" id="stateInline">checking</div>
          </div>
        </div>
      </section>

      <section>
        <h2 style="margin:0 0 8px 0;font-size:15px;font-weight:600;">Launch a session</h2>
        <div class="actions">
          <button class="xr-btn" id="btnVr" disabled>Enter VR</button>
          <button class="xr-btn" id="btnAr" disabled>Enter AR</button>
          <button class="xr-btn secondary" id="btnInline" disabled>View in 3D</button>
          <button class="xr-btn secondary" id="btnEnd" disabled>End session</button>
        </div>
      </section>

      <section class="chat-input">
        <input id="chatInput" type="text" placeholder="Type a message to show on the VR panel..." />
        <button class="xr-btn" id="btnSend">Send</button>
      </section>

      <section>
        <h2 style="margin:0 0 8px 0;font-size:15px;font-weight:600;">Log</h2>
        <div class="log" id="log">starting...\n</div>
        <div id="fallback"></div>
      </section>
    </main>

    <footer>
      WebXR availability depends on your browser and device. In Chrome on desktop,
      install a WebXR emulator extension to test without a headset.
    </footer>
  </div>

  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import {
      checkXrSupport,
      requestSession,
      createWebGlContext,
      XrRenderer,
      XrInputHandler,
      connectChatStream,
    } from "./js/xr-session.js";

    const els = {
      statusDot: document.getElementById("statusDot"),
      statusText: document.getElementById("statusText"),
      stateVr: document.getElementById("stateVr"),
      stateAr: document.getElementById("stateAr"),
      stateInline: document.getElementById("stateInline"),
      btnVr: document.getElementById("btnVr"),
      btnAr: document.getElementById("btnAr"),
      btnInline: document.getElementById("btnInline"),
      btnEnd: document.getElementById("btnEnd"),
      btnSend: document.getElementById("btnSend"),
      chatInput: document.getElementById("chatInput"),
      log: document.getElementById("log"),
      fallback: document.getElementById("fallback"),
      canvas: document.getElementById("xr-canvas"),
    };

    function logLine(msg) {
      els.log.textContent += msg + "\n";
      els.log.scrollTop = els.log.scrollHeight;
    }

    function markState(el, ok, label) {
      el.textContent = ok ? "available" : "unavailable";
      el.style.color = ok ? "var(--good)" : "var(--bad)";
    }

    // Panel content is drawn to an offscreen 2D canvas and uploaded as a texture.
    const panelCanvas = document.createElement("canvas");
    panelCanvas.width = 1024;
    panelCanvas.height = 640;
    const panelCtx = panelCanvas.getContext("2d");

    const chatHistory = [];

    function redrawPanel() {
      const ctx = panelCtx;
      ctx.fillStyle = "rgba(10,14,24,0.92)";
      ctx.fillRect(0, 0, panelCanvas.width, panelCanvas.height);
      ctx.strokeStyle = "#5b9dff";
      ctx.lineWidth = 4;
      ctx.strokeRect(6, 6, panelCanvas.width - 12, panelCanvas.height - 12);

      ctx.fillStyle = "#e6e8ee";
      ctx.font = "bold 38px system-ui";
      ctx.fillText("SiskelBot XR", 32, 60);

      ctx.font = "22px system-ui";
      ctx.fillStyle = "#8a93a6";
      ctx.fillText("Latest messages", 32, 100);

      ctx.font = "24px system-ui";
      ctx.fillStyle = "#e6e8ee";
      const lines = chatHistory.slice(-10);
      lines.forEach((line, i) => {
        const y = 150 + i * 42;
        ctx.fillStyle = line.role === "user" ? "#5b9dff" : "#e6e8ee";
        const prefix = line.role === "user" ? "you: " : "bot: ";
        const text = (prefix + line.content).slice(0, 78);
        ctx.fillText(text, 32, y);
      });

      if (chatHistory.length === 0) {
        ctx.fillStyle = "#8a93a6";
        ctx.font = "italic 24px system-ui";
        ctx.fillText("Start typing to chat from the headset...", 32, 180);
      }
    }

    let session = null;
    let renderer = null;
    let inputHandler = null;
    let refSpace = null;
    let gl = null;

    async function startSession(mode) {
      if (session) return;
      try {
        session = await requestSession(mode);
        logLine(`session started (${mode})`);

        gl = createWebGlContext(els.canvas);
        els.canvas.classList.add("active");

        // XRWebGLLayer is a global provided by the WebXR polyfill / native impl.
        const baseLayer = new XRWebGLLayer(session, gl);
        await session.updateRenderState({ baseLayer });

        refSpace = await session.requestReferenceSpace(mode === "inline" ? "viewer" : "local-floor");
        renderer = new XrRenderer(gl);
        inputHandler = new XrInputHandler(session);

        session.addEventListener("end", onSessionEnd);

        // Log a session start with the server for analytics.
        try {
          await fetch("/api/v1/xr/session", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ mode, device: navigator.userAgent.slice(0, 120) }),
          });
        } catch (_) { /* best-effort */ }

        session.requestAnimationFrame(onXrFrame);
        els.btnEnd.disabled = false;
        [els.btnVr, els.btnAr, els.btnInline].forEach((b) => (b.disabled = true));
      } catch (err) {
        logLine(`failed to start ${mode}: ${err.message}`);
      }
    }

    function onXrFrame(_t, frame) {
      if (!session) return;
      renderer.beginFrame(frame, refSpace);
      redrawPanel();
      renderer.drawText(null, panelCanvas, 1.4);
      if (inputHandler) inputHandler.pollControllers(frame, refSpace);
      renderer.endFrame();
      session.requestAnimationFrame(onXrFrame);
    }

    async function onSessionEnd() {
      logLine("session ended");
      session = null;
      renderer = null;
      inputHandler = null;
      refSpace = null;
      els.canvas.classList.remove("active");
      els.btnEnd.disabled = true;
      await refreshSupport();
    }

    async function endSession() {
      if (session) await session.end();
    }

    async function sendMessage() {
      const text = els.chatInput.value.trim();
      if (!text) return;
      els.chatInput.value = "";
      chatHistory.push({ role: "user", content: text });
      chatHistory.push({ role: "assistant", content: "" });
      redrawPanel();
      logLine("> " + text);

      try {
        const idx = chatHistory.length - 1;
        await connectChatStream(
          "/v1/chat/completions",
          chatHistory.slice(0, -1),
          (token) => {
            chatHistory[idx].content += token;
            redrawPanel();
          },
        );
        logLine("< " + chatHistory[idx].content.slice(0, 80));
      } catch (err) {
        chatHistory[chatHistory.length - 1].content = "(error) " + err.message;
        logLine("chat error: " + err.message);
        redrawPanel();
      }
    }

    async function refreshSupport() {
      const sup = await checkXrSupport();
      markState(els.stateVr, sup.vr);
      markState(els.stateAr, sup.ar);
      markState(els.stateInline, sup.inline);

      els.btnVr.disabled = !sup.vr;
      els.btnAr.disabled = !sup.ar;
      els.btnInline.disabled = !sup.inline;

      const anyOk = sup.vr || sup.ar || sup.inline;
      els.statusDot.className = "dot " + (anyOk ? "on" : "off");
      els.statusText.textContent = anyOk ? "WebXR ready" : "WebXR unavailable";

      if (!anyOk) {
        els.fallback.innerHTML = `<div class="fallback">
          ${sup.reason || "This browser does not support any WebXR session mode."}
          You can still chat below; messages are sent to the SiskelBot chat API.
        </div>`;
      } else {
        els.fallback.innerHTML = "";
      }
      return sup;
    }

    els.btnVr.addEventListener("click", () => startSession("immersive-vr"));
    els.btnAr.addEventListener("click", () => startSession("immersive-ar"));
    els.btnInline.addEventListener("click", () => startSession("inline"));
    els.btnEnd.addEventListener("click", endSession);
    els.btnSend.addEventListener("click", sendMessage);
    els.chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Fetch server-side capability hints (non-blocking diagnostic).
    fetch("/api/v1/xr/capabilities")
      .then((r) => r.json())
      .then((c) => logLine(`server hints: modes=${(c.webxr?.supportedModes || []).join(",")}`))
      .catch(() => {});

    // Probe browser support immediately.
    refreshSupport()
      .then((sup) => logLine(`detected: vr=${sup.vr} ar=${sup.ar} inline=${sup.inline}`))
      .catch((err) => logLine("probe failed: " + err.message));
  </script>
</body>
</html>
