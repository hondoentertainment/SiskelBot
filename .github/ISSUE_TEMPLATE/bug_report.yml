name: Bug Report
description: Report a bug in SiskelBot
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: input
    id: version
    attributes:
      label: SiskelBot version
      placeholder: "1.0.0"
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [Ollama, vLLM, OpenAI]
  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      options: [JSON (default), SQLite, PostgreSQL]
