# Build and push the pgbackup utility image used by the backup CronJob.
name: Build pgbackup image

on:
  push:
    branches: [main, master]
    paths:
      - 'docker/pgbackup/**'
      - '.github/workflows/build-pgbackup.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pgbackup

concurrency:
  group: pgbackup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local for scanning)
        uses: docker/build-push-action@v7
        with:
          context: docker/pgbackup
          load: true
          tags: pgbackup:scan
          cache-from: type=gha,scope=pgbackup
          cache-to: type=gha,mode=max,scope=pgbackup

      - name: Trivy scan (block on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pgbackup:scan
          format: table
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/pgbackup
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:16-aws
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:16-aws-${{ github.sha }}
          cache-from: type=gha,scope=pgbackup
          cache-to: type=gha,mode=max,scope=pgbackup

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
