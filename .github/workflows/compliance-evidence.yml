# P3: Weekly SOC2 evidence snapshot (offline — no server required).
name: Compliance evidence

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Collect compliance evidence
        run: node scripts/collect-compliance-evidence.mjs
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence
          path: data/compliance/
          retention-days: 90
