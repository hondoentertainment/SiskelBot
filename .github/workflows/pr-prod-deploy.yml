name: PR Production Deploy

on:
  pull_request:
    branches: [main, master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-prod-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID != '' && secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify Vercel configuration
        run: |
          [ -n "$VERCEL_TOKEN" ] || (echo "Missing VERCEL_TOKEN secret" && exit 1)
          [ -n "$VERCEL_ORG_ID" ] || (echo "Missing VERCEL_ORG_ID (secret or variable)" && exit 1)
          [ -n "$VERCEL_PROJECT_ID" ] || (echo "Missing VERCEL_PROJECT_ID (secret or variable)" && exit 1)

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build deployment artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy pull request to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
