# Generate source SBOM on every PR for early visibility into dependency changes
name: SBOM

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-source.cyclonedx.json
          artifact-name: sbom-source.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-source
          path: sbom-source.cyclonedx.json
          retention-days: 30
