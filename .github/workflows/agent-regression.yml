name: agent-regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: agent-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run regression gate
        run: node scripts/ci-regression-gate.js --output-json report.json --output-md comment.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-regression-report
          path: |
            report.json
            comment.md
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('comment.md')) return;
            const body = fs.readFileSync('comment.md', 'utf-8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Posting the summary comment is best-effort: a transient API/auth
            // error here must not fail the regression gate (its result is
            // already captured in the uploaded report artifact).
            try {
              const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
              const existing = comments.data.find(c => c.user.type === 'Bot' && c.body.includes('Agent regression gate'));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (err) {
              core.warning(`Could not post regression comment: ${err.message}`);
            }

  # Branch protection requires a check named "agent-regression" in addition to
  # the existing job id "regression". This alias reports that context.
  agent-regression:
    name: agent-regression
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Required-check alias for job regression"
