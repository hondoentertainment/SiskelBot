name: agent-regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: agent-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run regression gate
        run: node scripts/ci-regression-gate.js --output-json report.json --output-md comment.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-regression-report
          path: |
            report.json
            comment.md
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('comment.md')) return;
            const body = fs.readFileSync('comment.md', 'utf-8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Find an existing comment from this bot and update instead of spamming
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.user.type === 'Bot' && c.body.includes('Agent regression gate'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
