# Phase 37: CI/CD for SiskelBot (experimentagent)
# Local parity: npm ci && npm run ci   (smoke needs a running server; see smoke job below)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PORT: "3000"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Syntax check (node --check)
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        run: npm run test:ci

      - name: Troubleshooting (on test failure)
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          {
            echo "## Test job failed"
            echo "Mirror CI locally:"
            echo '```bash'
            echo "npm ci"
            echo "npm run ci"
            echo '```'
            echo "Smoke (separate terminal): \`BACKEND=ollama npm start\` then \`npm run smoke-test:ci\`"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Start server
        run: |
          set -e
          BACKEND=ollama PORT="${PORT}" npm start &
      - name: Wait for /health/live
        run: |
          set -e
          url="http://127.0.0.1:${PORT}/health/live"
          for i in $(seq 1 45); do
            if curl -sf "$url" >/dev/null; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server did not respond on $url within 45s"
          exit 1
      - name: Smoke test
        run: npm run smoke-test:ci
        env:
          BASE_URL: http://127.0.0.1:${{ env.PORT }}
