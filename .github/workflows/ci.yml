# Phase 37: CI/CD for SiskelBot (experimentagent)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Fail fast when one job fails
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Optional: add "lint" script to package.json to enable
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Run tests
        run: npm run test:ci

  # Phase 39: Smoke tests (server must respond to health/config)
  smoke:
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Start server
        run: |
          BACKEND=ollama npm start &
          sleep 5
      - name: Smoke test
        run: npm run smoke-test:ci
