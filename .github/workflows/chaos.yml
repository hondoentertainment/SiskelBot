# Weekly chaos test suite — verifies resilience patterns under injected failures
name: Chaos

on:
  schedule:
    # Sundays at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run chaos test suite
        run: npm run test:chaos
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs
          path: |
            *.log
            tests/chaos/**/*.log
          retention-days: 14
          if-no-files-found: ignore
