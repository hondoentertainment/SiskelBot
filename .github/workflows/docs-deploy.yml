# Validate Mintlify docs config and (optionally) trigger deploy.
# Mintlify auto-deploys via GitHub App once installed; this workflow only validates.
name: Docs

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'mint.json'
      - 'introduction.mdx'
      - 'quickstart.mdx'
      - 'docs/**'
  push:
    branches: [main, master]
    paths:
      - 'mint.json'
      - 'introduction.mdx'
      - 'quickstart.mdx'
      - 'docs/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate Mintlify navigation pages
        run: node scripts/validate-mintlify-pages.mjs
