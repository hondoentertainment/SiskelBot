[project]
name = "siskelbot"
version = "0.1.0"
description = "Python SDK for SiskelBot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.27.0"]
authors = [{ name = "Hondo Entertainment" }]
keywords = ["siskelbot", "llm", "ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/hondoentertainment/SiskelBot"
Repository = "https://github.com/hondoentertainment/SiskelBot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siskelbot"]
