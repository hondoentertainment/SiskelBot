{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "siskelbot.fullname" . }}
  labels:
    {{- include "siskelbot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "siskelbot.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.ingressRules }}
    {{- toYaml .Values.networkPolicy.ingressRules | nindent 4 }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egressRules }}
    {{- toYaml .Values.networkPolicy.egressRules | nindent 4 }}
    {{- else }}
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    {{- end }}
{{- end }}
