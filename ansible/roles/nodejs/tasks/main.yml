---
# Install Node.js from NodeSource.

- name: Set Node.js major version
  ansible.builtin.set_fact:
    nodejs_version: "{{ nodejs_version | default('20') }}"

- name: Check if Node.js is already installed at the desired major version
  ansible.builtin.command: node --version
  register: node_installed_version
  changed_when: false
  failed_when: false

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"
    force: true
  when: node_installed_version.rc != 0 or ('v' + nodejs_version) not in (node_installed_version.stdout | default(''))

- name: Add NodeSource apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_version }}.x nodistro main"
    filename: nodesource
    state: present
    update_cache: true
  when: node_installed_version.rc != 0 or ('v' + nodejs_version) not in (node_installed_version.stdout | default(''))

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Verify Node.js installation
  ansible.builtin.command: node --version
  register: node_version_check
  changed_when: false

- name: Display installed Node.js version
  ansible.builtin.debug:
    msg: "Node.js {{ node_version_check.stdout }} installed"

- name: Upgrade npm to latest
  ansible.builtin.command: npm install -g npm@latest
  changed_when: false
