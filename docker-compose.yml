version: '3.8'

services:
  siskelbot:
    build: .
    ports:
      - "3000:3000"
    environment:
      - BACKEND=ollama
      - OLLAMA_URL=http://ollama:11434
      - STORAGE_BACKEND=postgres
      - DATABASE_URL=postgresql://siskelbot:siskelbot@postgres:5432/siskelbot
      - REDIS_URL=redis://redis:6379
      - SESSION_SECRET=dev-secret-change-in-production
      - ENABLE_METRICS=1
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: siskelbot
      POSTGRES_USER: siskelbot
      POSTGRES_PASSWORD: siskelbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siskelbot"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/siskelbot.json
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  pgdata:
  ollama:
  grafana:
